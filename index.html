<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GC PLAY PRO - TV SYSTEM</title>
    <meta name="theme-color" content="#28D905">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #28D905; --bg-main: #000; --bg-card: #0d0d0d; --border: #222; --text-muted: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-main); color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .smart-container { display: flex; flex: 1; width: 100%; height: 100%; flex-direction: column; }
        @media (min-width: 900px) { .smart-container { flex-direction: row; } }
        .main-content-area { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .top-brand-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .brand-title { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; color: #fff; }
        .brand-title span { color: var(--primary); }
        .app-brand-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; background: rgba(40, 217, 5, 0.1); padding: 4px; border: 1px solid var(--primary); }
        .add-account-card { width: 100%; max-width: 280px; height: 140px; background: rgba(255,255,255,0.02); border: 3px dashed var(--border); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
        .add-account-card:hover { border-color: var(--primary); color: #fff; background: #1f1f1f; }
        .sidebar-panel { width: 100%; background: #050705; border-top: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
        @media (min-width: 900px) { .sidebar-panel { width: 340px; border-top: none; border-left: 1px solid var(--border); justify-content: space-between; } }
        .qrcode-container { background: #fff; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; width: 130px; height: 130px; }
        .qrcode-container canvas, .qrcode-container img { display: block; width: 118px !important; height: 118px !important; }
        .mac-display-box { font-family: monospace; font-size: 15px; font-weight: bold; color: var(--primary); letter-spacing: 1px; margin: 6px 0; }
        .btn-ui { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; background: var(--primary); color: #000; text-transform: uppercase; transition: opacity 0.2s; }
        .btn-ui:hover { opacity: 0.9; }
        
        #loadingScreen { display: none; width: 100%; height: 100vh; height: 100dvh; flex-direction: column; align-items: center; justify-content: center; background: #000; position: fixed; top: 0; left: 0; z-index: 9998; text-align: center; }
        .spinner { width: 60px; height: 60px; border: 5px solid rgba(40,217,5,0.1); border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Player Interno Completo com Botão de Migração */
        #playerScreen { display: none; width: 100%; height: 100vh; height: 100dvh; background: #000; position: fixed; top: 0; left: 0; z-index: 9999; flex-direction: row; }
        .playlist-sidebar { width: 340px; background: #0a0a0a; border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        .playlist-header { padding: 15px 18px; background: #121212; font-weight: bold; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--primary); display: flex; align-items: center; justify-content: space-between; }
        .channels-list { flex: 1; overflow-y: auto; padding: 12px; }
        .channel-item { padding: 12px 14px; margin-bottom: 8px; background: #161616; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--border); transition: all 0.2s; }
        .channel-item:hover, .channel-item.active { background: rgba(40,217,5,0.15); border-color: var(--primary); color: var(--primary); }
        .video-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; outline: none; background: #000; }
        .btn-config-icon { background: rgba(40,217,5,0.1); border: 1px solid var(--primary); color: var(--primary); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 0.2s; }
        .btn-config-icon:hover { background: var(--primary); color: #000; }
    </style>
</head>
<body>

    <div id="tvSetupScreen" class="smart-container">
        <div class="main-content-area">
            <div class="top-brand-bar">
                <div class="brand-title">
                    <img src="https://i.imgur.com/7D2A74V.png" class="app-brand-logo" onerror="this.style.display='none'">
                    <i class="fa-solid fa-circle-play" style="color: var(--primary);"></i> GC PLAY <span>PRO</span>
                </div>
                <button class="btn-config-icon" onclick="alterarLinkM3U()" title="Alterar Link M3U / Migrar Servidor"><i class="fa-solid fa-gear"></i></button>
            </div>
            <div>
                <div class="add-account-card" onclick="alterarLinkM3U()">
                    <i class="fa-solid fa-plus" style="font-size: 26px; color: var(--primary);"></i>
                    <span style="font-size: 12px; font-weight: bold; color: #fff;">Adicionar / Alterar Servidor</span>
                </div>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); border-top: 2px solid var(--border); padding-top: 10px;">
                📱 Ativação Oficial via Nuvem ou Manual
            </div>
        </div>

        <div class="sidebar-panel">
            <div style="font-size: 12px; color: var(--primary); font-weight: 700; padding: 8px 14px; background: rgba(40,217,5,0.1); border-radius: 8px; border: 2px solid rgba(40,217,5,0.3);">
                SUPORTE: (19) 99990-18248
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="qrcode-container" id="qrCodeBox"></div>
                <div style="color: var(--primary); font-size: 11px; font-weight: bold; margin-top: 4px;">Escaneie para Ativar</div>
                <div class="mac-display-box" id="displayMac">Gerando...</div>
                <button class="btn-ui" onclick="copiarLinkPortal()"><i class="fa-solid fa-copy"></i> Copiar Link</button>
            </div>
            <div style="font-size: 11px; color: var(--text-muted);">v8.9 GC PLAY PRO</div>
        </div>
    </div>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 20px; font-weight: 600;">Reconhecendo ativação...</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">Baixando e processando lista M3U...</p>
    </div>

    <div id="playerScreen">
        <div class="playlist-sidebar">
            <div class="playlist-header">
                <span><i class="fa-solid fa-tv"></i> Canais</span>
                <button class="btn-config-icon" onclick="alterarLinkM3U()" title="Migrar / Trocar Servidor M3U"><i class="fa-solid fa-gear"></i></button>
            </div>
            <div class="channels-list" id="channelsListContainer">
                <div style="color: #666; text-align: center; margin-top: 20px;">Carregando canais...</div>
            </div>
        </div>
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oududghyzkucvrxffoyg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3KI2wOG7ZXTTIkRccOTYnA_zpAjuaLz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let portalUrlGerado = "";
        let deviceId = "";
        let ativouProcesso = false;

        window.addEventListener('DOMContentLoaded', () => {
            deviceId = localStorage.getItem('gc_device_id');
            if (!deviceId || deviceId.length < 5) {
                deviceId = "GC-" + Math.floor(Math.random() * 899999 + 100000);
                localStorage.setItem('gc_device_id', deviceId);
            }
            
            const macElement = document.getElementById('displayMac');
            if(macElement) macElement.innerText = deviceId;

            let pathSegments = window.location.pathname.split('/');
            pathSegments.pop();
            let basePath = window.location.protocol + "//" + window.location.host + pathSegments.join('/') + "/ativar.html";
            portalUrlGerado = basePath + "?mac=" + deviceId;

            gerarQRCodeSeguro(portalUrlGerado);

            // 1. Prioriza link salvo manualmente no aparelho (se houver migração feita pelo usuário)
            let savedM3u = localStorage.getItem('gc_manual_m3u');
            if (savedM3u) {
                ativouProcesso = true;
                carregarListaM3USegura(savedM3u);
                return;
            }

            // 2. Senão, verifica ativação via Supabase em nuvem
            verificarAtivacaoNuvem(deviceId);
            setInterval(() => {
                if(!ativouProcesso) {
                    verificarAtivacaoNuvem(deviceId);
                }
            }, 3000);
        });

        function gerarQRCodeSeguro(urlTexto) {
            const box = document.getElementById('qrCodeBox');
            if (!box) return;
            box.innerHTML = "";
            try {
                new QRCode(box, {
                    text: urlTexto,
                    width: 118,
                    height: 118,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (e) {
                box.innerHTML = "<span style='color:red; font-size:10px;'>Erro QR</span>";
            }
        }

        async function verificarAtivacaoNuvem(mac) {
            if (ativouProcesso) return;
            try {
                let { data, error } = await supabaseClient
                    .from('ativacoes')
                    .select('url_m3u')
                    .eq('mac', mac)
                    .maybeSingle();

                if (data && data.url_m3u && !ativouProcesso) {
                    ativouProcesso = true;
                    carregarListaM3USegura(data.url_m3u);
                }
            } catch (err) {}
        }

        async function carregarListaM3USegura(url) {
            document.getElementById('tvSetupScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            let m3uText = "";
            
            // Tentativa 1: Direta
            try {
                let response = await fetch(url);
                if (response.ok) m3uText = await response.text();
            } catch (e) {}

            // Tentativa 2: Proxy CORS 1
            if (!m3uText || !m3uText.includes('#EXTINF')) {
                try {
                    let resp = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
                    if (resp.ok) m3uText = await resp.text();
                } catch (e) {}
            }

            // Tentativa 3: Proxy CORS 2
            if (!m3uText || !m3uText.includes('#EXTINF')) {
                try {
                    let resp = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
                    if (resp.ok) m3uText = await resp.text();
                } catch (e) {}
            }

            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('playerScreen').style.display = 'flex';

            if (m3uText && m3uText.includes('#EXTINF')) {
                processarCanaisM3U(m3uText);
            } else {
                document.getElementById('channelsListContainer').innerHTML = 
                    `<div style='color:#ff5555; padding:20px; text-align:center;'>
                        <strong>Falha ao carregar a lista M3U.</strong><br><br>
                        O link atual pode estar expirado ou bloqueado.<br><br>
                        <button onclick="alterarLinkM3U()" style="padding:8px 14px; background:#28D905; color:#000; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Trocar / Migrar Servidor</button>
                    </div>`;
            }
        }

        function processarCanaisM3U(data) {
            let lines = data.split('\n');
            let channels = [];
            let currentName = "Canal";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let match = line.match(/,(.+)$/);
                    if (match) currentName = match[1];
                } else if (line && !line.startsWith('#')) {
                    channels.push({ name: currentName, url: line });
                    currentName = "Canal";
                }
            }

            let container = document.getElementById('channelsListContainer');
            container.innerHTML = "";

            if (channels.length === 0) {
                container.innerHTML = "<div style='color:#888; text-align:center; padding:20px;'>Nenhum canal encontrado.</div>";
                return;
            }

            channels.forEach((ch, index) => {
                let div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = `${index + 1}. ${ch.name}`;
                div.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    reproduzirStream(ch.url);
                };
                container.appendChild(div);
            });

            if (channels.length > 0) {
                container.firstChild.click();
            }
        }

        function reproduzirStream(url) {
            const video = document.getElementById('videoPlayer');
            if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8'))) {
                if (window.hlsInstance) window.hlsInstance.destroy();
                const hls = new Hls();
                window.hlsInstance = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else {
                if (window.hlsInstance) window.hlsInstance.destroy();
                video.src = url;
                video.load();
                video.play().catch(() => {});
            }
        }

        function alterarLinkM3U() {
            let atual = localStorage.getItem('gc_manual_m3u') || "";
            let novoLink = prompt("Digite ou cole o novo link M3U para migrar o servidor:", atual);
            if (novoLink !== null) {
                if (novoLink.trim().length > 5) {
                    localStorage.setItem('gc_manual_m3u', novoLink.trim());
                    alert("Servidor alterado com sucesso! Carregando nova lista...");
                    window.location.reload();
                } else {
                    // Se o usuário apagar o campo e confirmar, limpa a personalização e volta pra nuvem
                    localStorage.removeItem('gc_manual_m3u');
                    alert("Link limpo. O app voltará a buscar ativação pela nuvem.");
                    window.location.reload();
                }
            }
        }

        function copiarLinkPortal() {
            if(!portalUrlGerado) return;
            navigator.clipboard.writeText(portalUrlGerado).then(() => {
                alert("Link de ativação copiado com sucesso!");
            }).catch(() => {
                prompt("Copie o link abaixo:", portalUrlGerado);
            });
        }
    </script>
</body>
</html>
