<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GC PLAY PRO - TV</title>
    <meta name="theme-color" content="#28D905">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #28D905; --bg-main: #000; --bg-card: #0d0d0d; --border: #222; --text-muted: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-main); color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .smart-container { display: flex; flex: 1; width: 100%; height: 100%; flex-direction: column; }
        @media (min-width: 900px) { .smart-container { flex-direction: row; } }
        .main-content-area { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .top-brand-bar { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; color: #fff; }
        .top-brand-bar span { color: var(--primary); }
        .app-brand-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; background: rgba(40, 217, 5, 0.1); padding: 4px; border: 1px solid var(--primary); }
        .add-account-card { width: 100%; max-width: 280px; height: 140px; background: rgba(255,255,255,0.02); border: 3px dashed var(--border); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--text-muted); }
        .add-account-card:hover { border-color: var(--primary); color: #fff; background: #1f1f1f; }
        .sidebar-panel { width: 100%; background: #050705; border-top: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
        @media (min-width: 900px) { .sidebar-panel { width: 340px; border-top: none; border-left: 1px solid var(--border); justify-content: space-between; } }
        .qrcode-container { background: #fff; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; width: 130px; height: 130px; }
        .mac-display-box { font-family: monospace; font-size: 14px; font-weight: bold; color: var(--primary); letter-spacing: 1px; margin: 6px 0; }
        .btn-ui { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; background: var(--primary); color: #000; text-transform: uppercase; }
        
        /* TELA DE CARREGAMENTO DA LISTA M3U */
        #playerScreen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: center; background: #000; text-align: center; padding: 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(40,217,5,0.1); border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- TELA PRINCIPAL (QR CODE) -->
    <div id="tvSetupScreen" class="smart-container">
        <div class="main-content-area">
            <div class="top-brand-bar">
                <img src="https://i.imgur.com/7D2A74V.png" class="app-brand-logo" onerror="this.style.display='none'">
                <i class="fa-solid fa-circle-play" style="color: var(--primary);"></i> GC PLAY <span>PRO</span>
            </div>
            <div>
                <div class="add-account-card" onclick="alert('Use o QR Code ao lado para ativar pelo celular!')">
                    <i class="fa-solid fa-plus" style="font-size: 26px; color: var(--primary);"></i>
                    <span style="font-size: 12px; font-weight: bold; color: #fff;">Adicionar Manualmente</span>
                </div>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); border-top: 2px solid var(--border); padding-top: 10px;">
                📱 Ativação Oficial via Web
            </div>
        </div>

        <div class="sidebar-panel">
            <div style="font-size: 12px; color: var(--primary); font-weight: 700; padding: 8px 14px; background: rgba(40,217,5,0.1); border-radius: 8px; border: 2px solid rgba(40,217,5,0.3);">
                SUPORTE: (19) 99990-18248
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="qrcode-container" id="qrCodeBox"></div>
                <div style="color: var(--primary); font-size: 11px; font-weight: bold; margin-top: 4px;">Escaneie para Ativar</div>
                <div class="mac-display-box" id="displayMac">Gerando...</div>
                <button class="btn-ui" onclick="navigator.clipboard.writeText(portalUrlGerado)"><i class="fa-solid fa-copy"></i> Copiar Link</button>
            </div>
            <div style="font-size: 11px; color: var(--text-muted);">v8.7 GC PLAY PRO</div>
        </div>
    </div>

    <!-- TELA DE PLAYER / CARREGANDO M3U -->
    <div id="playerScreen">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 22px; margin-bottom: 8px;">Carregando Lista M3U...</h2>
        <p id="loadedUrlText" style="color: var(--text-muted); font-size: 13px; max-width: 500px; word-break: break-all;"></p>
    </div>

    <script>
        let portalUrlGerado = "";
        let deviceId = "";

        window.addEventListener('DOMContentLoaded', () => {
            deviceId = localStorage.getItem('gc_device_id');
            if(!deviceId) {
                deviceId = "GC-" + Math.floor(Math.random() * 899999 + 100000);
                localStorage.setItem('gc_device_id', deviceId);
            }
            document.getElementById('displayMac').innerText = deviceId;

            // Verifica se já existe uma lista salva para este aparelho
            let savedList = localStorage.getItem('gc_playlist_' + deviceId);
            if(savedList) {
                mostrarPlayer(JSON.parse(savedList).url);
                return;
            }

            // Gera o link do QR code apontando para o ativar.html
            let pathSegments = window.location.pathname.split('/');
            pathSegments.pop();
            let basePath = window.location.protocol + "//" + window.location.host + pathSegments.join('/') + "/ativar.html";
            portalUrlGerado = basePath + "?mac=" + deviceId;

            setTimeout(() => {
                let box = document.getElementById('qrCodeBox');
                box.innerHTML = "";
                new QRCode(box, {
                    text: portalUrlGerado,
                    width: 118,
                    height: 118,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }, 200);

            // Fica checando a cada 1 segundo se o celular ativou o aparelho
            setInterval(() => {
                let checkActivation = localStorage.getItem('gc_playlist_' + deviceId);
                if(checkActivation) {
                    let dados = JSON.parse(checkActivation);
                    mostrarPlayer(dados.url);
                }
            }, 1000);
        });

        function mostrarPlayer(urlM3u) {
            document.getElementById('tvSetupScreen').style.display = 'none';
            document.getElementById('playerScreen').style.display = 'flex';
            document.getElementById('loadedUrlText').innerText = urlM3u;
            // Aqui você pode integrar o player de vídeo ou carregamento real da M3U futuramente.
        }
    </script>
</body>
</html>
