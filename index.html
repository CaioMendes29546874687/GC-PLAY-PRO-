<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>GC PLAY PRO</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* =========================
   TOPO
========================= */

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #1aff00;
    background: #080808;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #39ff14;
    text-shadow: 0 0 10px #39ff14;
}

.header-buttons {
    display: flex;
    gap: 10px;
}

button {
    border: 1px solid #39ff14;
    background: #0b0b0b;
    color: #39ff14;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover,
button:focus {
    background: #39ff14;
    color: #000;
    outline: none;
}

/* =========================
   TELA INICIAL
========================= */

#home {
    min-height: calc(100vh - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.home-box {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

.home-box h1 {
    font-size: 42px;
    color: #39ff14;
    text-shadow: 0 0 15px #39ff14;
    margin-bottom: 12px;
}

.home-box p {
    color: #aaa;
    margin-bottom: 30px;
}

.menu-buttons {
    display: grid;
    gap: 15px;
}

.big-button {
    width: 100%;
    min-height: 60px;
    font-size: 18px;
}

/* =========================
   APP
========================= */

#app {
    display: none;
    padding: 20px;
}

.menu {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.menu button {
    white-space: nowrap;
}

#status {
    padding: 15px;
    border: 1px solid #222;
    border-radius: 10px;
    background: #0a0a0a;
    margin-bottom: 20px;
    color: #aaa;
}

#status.ok {
    border-color: #39ff14;
    color: #39ff14;
}

#status.error {
    border-color: #ff3333;
    color: #ff5555;
}

/* =========================
   LISTA
========================= */

#lista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 15px;
}

.canal {
    background: #0c0c0c;
    border: 1px solid #202020;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.canal:hover {
    border-color: #39ff14;
    transform: translateY(-2px);
}

.canal img {
    width: 100%;
    height: 110px;
    object-fit: contain;
    background: #050505;
}

.canal-info {
    padding: 12px;
}

.canal-nome {
    font-weight: bold;
    margin-bottom: 5px;
}

.canal-grupo {
    font-size: 12px;
    color: #777;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 600px;
    background: #090909;
    border: 1px solid #39ff14;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 0 30px rgba(57,255,20,.2);
}

.modal-box h2 {
    color: #39ff14;
    margin-bottom: 15px;
}

.modal-box p {
    color: #aaa;
    margin-bottom: 15px;
}

input {
    width: 100%;
    height: 50px;
    background: #050505;
    border: 1px solid #333;
    color: #fff;
    border-radius: 8px;
    padding: 0 15px;
    font-size: 16px;
    margin-bottom: 15px;
}

input:focus {
    outline: none;
    border-color: #39ff14;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
}

/* =========================
   PLAYER
========================= */

#playerModal .modal-box {
    max-width: 1000px;
}

video {
    width: 100%;
    max-height: 70vh;
    background: #000;
    border-radius: 8px;
}

.player-title {
    color: #39ff14;
    margin-bottom: 15px;
    font-weight: bold;
}

/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

    header {
        height: 60px;
        padding: 0 12px;
    }

    .logo {
        font-size: 19px;
    }

    header button {
        padding: 9px 10px;
        font-size: 12px;
    }

    .home-box h1 {
        font-size: 32px;
    }

    #lista {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .canal img {
        height: 85px;
    }
}
</style>
</head>

<body>

<!-- =========================
     TOPO
========================= -->

<header>

    <div class="logo">
        GC PLAY PRO
    </div>

    <div class="header-buttons">

        <button onclick="abrirManual()">
            + M3U
        </button>

        <button onclick="mostrarInicio()">
            INÍCIO
        </button>

    </div>

</header>


<!-- =========================
     TELA INICIAL
========================= -->

<section id="home">

    <div class="home-box">

        <h1>GC PLAY PRO</h1>

        <p>
            Seu aplicativo de entretenimento
        </p>

        <div class="menu-buttons">

            <button
                class="big-button"
                onclick="abrirManual()">
                📋 ADICIONAR M3U MANUALMENTE
            </button>

            <button
                class="big-button"
                onclick="carregarExemplo()">
                ▶ CARREGAR LISTA DE TESTE
            </button>

        </div>

    </div>

</section>


<!-- =========================
     APLICATIVO
========================= -->

<section id="app">

    <div class="menu">

        <button onclick="filtrar('todos')">
            TODOS
        </button>

        <button onclick="filtrar('live')">
            📺 TV AO VIVO
        </button>

        <button onclick="filtrar('vod')">
            🎬 FILMES
        </button>

        <button onclick="filtrar('series')">
            📺 SÉRIES
        </button>

        <button onclick="filtrar('music')">
            🎵 MÚSICA
        </button>

    </div>

    <div id="status">
        Nenhuma lista carregada.
    </div>

    <div id="lista"></div>

</section>


<!-- =========================
     MODAL M3U
========================= -->

<div id="manualModal" class="modal">

    <div class="modal-box">

        <h2>Adicionar lista M3U</h2>

        <p>
            Cole abaixo o endereço da sua lista M3U.
        </p>

        <input
            id="m3uInput"
            type="url"
            placeholder="http://servidor.com/get.php?...">

        <div class="modal-buttons">

            <button onclick="fecharManual()">
                CANCELAR
            </button>

            <button onclick="carregarM3U()">
                CARREGAR
            </button>

        </div>

    </div>

</div>


<!-- =========================
     PLAYER
========================= -->

<div id="playerModal" class="modal">

    <div class="modal-box">

        <div
            id="playerTitle"
            class="player-title">
        </div>

        <video
            id="videoPlayer"
            controls
            playsinline>
        </video>

        <br>

        <button onclick="fecharPlayer()">
            FECHAR PLAYER
        </button>

    </div>

</div>


<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let canais = [];
let canaisFiltrados = [];
let categoriaAtual = "todos";


/* =====================================================
   MODAL MANUAL
===================================================== */

function abrirManual() {

    const modal =
        document.getElementById("manualModal");

    modal.style.display = "flex";

    setTimeout(() => {

        document
            .getElementById("m3uInput")
            .focus();

    }, 100);

}


function fecharManual() {

    document
        .getElementById("manualModal")
        .style.display = "none";

}


/* =====================================================
   CARREGAR M3U
===================================================== */

async function carregarM3U() {

    const input =
        document.getElementById("m3uInput");

    const url = input.value.trim();

    if (!url) {

        alert("Digite o endereço da lista M3U.");

        return;
    }

    fecharManual();

    mostrarStatus(
        "Carregando lista M3U...",
        "normal"
    );

    try {

        const resposta =
            await fetch(url);

        if (!resposta.ok) {

            throw new Error(
                "Servidor retornou HTTP " +
                resposta.status
            );

        }

        const texto =
            await resposta.text();

        if (!texto.trim()) {

            throw new Error(
                "A lista M3U está vazia."
            );

        }

        processarM3U(texto);

    } catch (erro) {

        console.error(erro);

        mostrarStatus(
            "Erro ao carregar M3U: " +
            erro.message,
            "error"
        );

        alert(
            "Não foi possível carregar a lista.\n\n" +
            erro.message
        );

    }

}


/* =====================================================
   PROCESSAR M3U
===================================================== */

function processarM3U(texto) {

    canais = [];

    const linhas =
        texto.split(/\r?\n/);

    let atual = null;

    for (let i = 0; i < linhas.length; i++) {

        const linha =
            linhas[i].trim();

        if (!linha) {
            continue;
        }


        /* EXTINF */

        if (linha.startsWith("#EXTINF")) {

            const virgula =
                linha.indexOf(",");

            let nome =
                virgula >= 0
                ? linha.substring(virgula + 1).trim()
                : "Sem nome";

            const grupo =
                extrairAtributo(
                    linha,
                    "group-title"
                ) || "Outros";

            const logo =
                extrairAtributo(
                    linha,
                    "tvg-logo"
                ) || "";

            const categoria =
                detectarCategoria(
                    grupo,
                    nome
                );

            atual = {

                nome,
                grupo,
                logo,
                categoria,
                url: ""

            };

            continue;
        }


        /* URL */

        if (
            !linha.startsWith("#") &&
            atual
        ) {

            atual.url = linha;

            canais.push(atual);

            atual = null;
        }

    }


    if (canais.length === 0) {

        mostrarStatus(
            "Nenhum canal encontrado na M3U.",
            "error"
        );

        return;
    }


    localStorage.setItem(
        "gc_m3u_url",
        document
            .getElementById("m3uInput")
            .value.trim()
    );


    mostrarStatus(
        canais.length +
        " canais carregados com sucesso.",
        "ok"
    );


    mostrarApp();

    renderizarLista(canais);

}


/* =====================================================
   ATRIBUTOS M3U
===================================================== */

function extrairAtributo(
    linha,
    atributo
) {

    const regex =
        new RegExp(
            atributo +
            '="([^"]*)"',
            "i"
        );

    const resultado =
        linha.match(regex);

    return resultado
        ? resultado[1]
        : "";

}


/* =====================================================
   DETECTAR CATEGORIA
===================================================== */

function detectarCategoria(
    grupo,
    nome
) {

    const texto =
        (
            grupo +
            " " +
            nome
        ).toLowerCase();


    if (
        texto.includes("adult") ||
        texto.includes("xxx")
    ) {

        return "adult";

    }


    if (
        texto.includes("series") ||
        texto.includes("série") ||
        texto.includes("season")
    ) {

        return "series";

    }


    if (
        texto.includes("filme") ||
        texto.includes("movie") ||
        texto.includes("vod")
    ) {

        return "vod";

    }


    if (
        texto.includes("music") ||
        texto.includes("música")
    ) {

        return "music";

    }


    return "live";

}


/* =====================================================
   RENDERIZAR LISTA
===================================================== */

function renderizarLista(lista) {

    const container =
        document.getElementById("lista");

    container.innerHTML = "";


    if (!lista.length) {

        container.innerHTML =
            "<p>Nenhum item encontrado.</p>";

        return;

    }


    lista.forEach((canal, indice) => {

        const card =
            document.createElement("div");

        card.className = "canal";


        const imagem =
            canal.logo
            ? `<img src="${escaparHTML(canal.logo)}"
                    onerror="this.style.display='none'">`
            : "";


        card.innerHTML = `

            ${imagem}

            <div class="canal-info">

                <div class="canal-nome">
                    ${escaparHTML(canal.nome)}
                </div>

                <div class="canal-grupo">
                    ${escaparHTML(canal.grupo)}
                </div>

            </div>

        `;


        card.onclick = () => {

            abrirPlayer(canal);

        };


        container.appendChild(card);

    });

}


/* =====================================================
   FILTROS
===================================================== */

function filtrar(categoria) {

    categoriaAtual =
        categoria;


    if (categoria === "todos") {

        canaisFiltrados =
            canais;

    } else {

        canaisFiltrados =
            canais.filter(
                c => c.categoria === categoria
            );

    }


    renderizarLista(
        canaisFiltrados
    );

}


/* =====================================================
   PLAYER
===================================================== */

function abrirPlayer(canal) {

    if (!canal.url) {

        alert(
            "Este item não possui URL."
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );

    const video =
        document.getElementById(
            "videoPlayer"
        );


    document.getElementById(
        "playerTitle"
    ).textContent =
        canal.nome;


    video.src =
        canal.url;


    modal.style.display =
        "flex";


    video.play()
        .catch(() => {});

}


function fecharPlayer() {

    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.pause();

    video.removeAttribute("src");

    video.load();


    document.getElementById(
        "playerModal"
    ).style.display =
        "none";

}


/* =====================================================
   TELA
===================================================== */

function mostrarApp() {

    document.getElementById(
        "home"
    ).style.display = "none";


    document.getElementById(
        "app"
    ).style.display = "block";

}


function mostrarInicio() {

    document.getElementById(
        "app"
    ).style.display = "none";


    document.getElementById(
        "home"
    ).style.display = "flex";

}


/* =====================================================
   STATUS
===================================================== */

function mostrarStatus(
    texto,
    tipo
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        texto;

    status.className =
        tipo === "ok"
        ? "ok"
        : tipo === "error"
        ? "error"
        : "";

}


/* =====================================================
   DEMO
===================================================== */

function carregarExemplo() {

    const exemplo = `#EXTM3U

#EXTINF:-1 group-title="TV AO VIVO",Canal de Teste
https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8

#EXTINF:-1 group-title="Filmes",Filme de Teste
https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4

#EXTINF:-1 group-title="Música",Música Teste
https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4
`;

    processarM3U(
        exemplo
    );

}


/* =====================================================
   SEGURANÇA HTML
===================================================== */

function escaparHTML(texto) {

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   FECHAR MODAIS CLICANDO FORA
===================================================== */

window.addEventListener(
    "click",
    function(event) {

        const manual =
            document.getElementById(
                "manualModal"
            );

        const player =
            document.getElementById(
                "playerModal"
            );


        if (event.target === manual) {

            fecharManual();

        }


        if (event.target === player) {

            fecharPlayer();

        }

    }
);


/* =====================================================
   ENTER NO CAMPO M3U
===================================================== */

document
    .getElementById("m3uInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                carregarM3U();

            }

        }
    );


/* =====================================================
   RECUPERAR URL SALVA
===================================================== */

const urlSalva =
    localStorage.getItem(
        "gc_m3u_url"
    );


if (urlSalva) {

    document
        .getElementById(
            "m3uInput"
        )
        .value =
        urlSalva;

}

</script>

</body>
</html>
