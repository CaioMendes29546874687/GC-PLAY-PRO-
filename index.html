<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GC PLAY PRO - IPTV Player</title>
<meta name="theme-color" content="#0c0c14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
:root {
  --bg: #0c0c14;
  --surface: #151525;
  --surface2: #1e1e35;
  --border: #2a2a45;
  --text: #e8e8f0;
  --dim: #8888a0;
  --accent: #28D905;
  --accent2: #e04040;
  --live: #30c860;
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 240px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:flex;overflow-x:hidden;width:100%;
}
#sidebar{
  width:var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;z-index:10;
}
#sidebar .logo{
  padding:18px 16px;font-size:18px;font-weight:700;
  color:var(--accent);display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
#sidebar nav{flex:1;overflow-y:auto;padding:10px}
#sidebar nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px 12px;margin:2px 0;border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--dim);font-size:13px;cursor:pointer;transition:all .15s;
}
#sidebar nav button:hover{background:var(--surface2);color:var(--text)}
#sidebar nav button.on{background:var(--accent);color:#000;font-weight:600}

#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{
  padding:14px 24px;display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);background:var(--surface);
  min-height:56px;
}
#topbar .title{font-size:18px;font-weight:700;color:var(--accent)}
#content{flex:1;overflow-y:auto;padding:24px;padding-bottom:100px}

/* Tela de Configuração/Ativação do Link M3U */
.config-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  max-width: 500px;
  margin: 40px auto;
  text-align: center;
}
.config-box h2 { margin-bottom: 10px; color: var(--accent); }
.config-box p { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
.config-box input {
  width: 100%; padding: 12px; background: var(--surface2);
  border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); margin-bottom: 15px; outline: none;
}
.config-box input:focus { border-color: var(--accent); }
.config-box button {
  background: var(--accent); color: #000; border: none;
  padding: 12px 20px; font-weight: bold; border-radius: var(--radius-sm);
  cursor: pointer; width: 100%; font-size: 14px;
}
.config-box button:hover { opacity: 0.9; }

/* Grid de Canais */
.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:12px;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .thumb{
  width:44px;height:44px;border-radius:6px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.card .detail{flex:1;min-width:0}
.card .detail .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .detail .mt{font-size:11px;color:var(--dim);margin-top:2px}

/* Player Cheia / Overlay */
#player-overlay{
  position:fixed;inset:0;background:#000;z-index:200;
  display:none;flex-direction:column;
}
#player-overlay.on{display:flex}
#player-overlay .topbar{background:#0a0a0a;border-bottom:1px solid #222;display:flex;justify-content:space-between;padding:10px 20px}
#player-overlay video{flex:1;width:100%;height:100%;background:#000}
</style>
</head>
<body>

  <!-- Menu Lateral -->
  <div id="sidebar">
    <div class="logo">📺 GC PLAY <span style="font-size:11px;color:var(--dim)">PRO</span></div>
    <nav id="categoryNav">
      <button class="on" onclick="mudarAba('home')">🏠 Início / Link</button>
      <button onclick="mudarAba('canais')">📡 Canais Carregados</button>
    </nav>
  </div>

  <!-- Conteúdo Principal -->
  <div id="main">
    <div id="topbar">
      <div class="title" id="pageTitle">Painel Inicial</div>
    </div>

    <div id="content">
      <!-- Seção Inicial: Ativação / Inserir Link M3U -->
      <div id="section-home" class="view-section">
        <div class="config-box">
          <h2>GC PLAY PRO</h2>
          <p>Insira seu link M3U abaixo para carregar os canais com o novo layout:</p>
          <input type="text" id="m3uInput" placeholder="https://exemplo.com/lista.m3u">
          <button onclick="salvarECarregarM3U()">CARREGAR LISTA M3U</button>
        </div>
      </div>

      <!-- Seção de Canais -->
      <div id="section-canais" class="view-section" style="display:none;">
        <div id="listaCanais" class="grid-view">
          <!-- Os canais aparecem aqui dinamicamente -->
        </div>
      </div>
    </div>
  </div>

  <!-- Player Overlay de Vídeo -->
  <div id="player-overlay">
    <div class="topbar">
      <div id="overlayTitle" style="font-weight:bold;">Reproduzindo</div>
      <button onclick="fecharPlayer()" style="background:#e04040;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;">Fechar X</button>
    </div>
    <video id="videoPlayer" controls autoplay></video>
  </div>

<script>
let canaisLista = [];

window.onload = function() {
    let salvo = localStorage.getItem('gc_manual_m3u');
    if(salvo) {
        document.getElementById('m3uInput').value = salvo;
        carregarM3U(salvo, false);
    }
}

function mudarAba(aba) {
    document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
    document.querySelectorAll('#sidebar nav button').forEach(el => el.classList.remove('on'));
    
    if(aba === 'home') {
        document.getElementById('section-home').style.display = 'block';
        document.getElementById('pageTitle').innerText = 'Painel Inicial';
        event.currentTarget.classList.add('on');
    } else if(aba === 'canais') {
        document.getElementById('section-canais').style.display = 'block';
        document.getElementById('pageTitle').innerText = 'Canais Disponíveis';
        event.currentTarget.classList.add('on');
    }
}

function salvarECarregarM3U() {
    let link = document.getElementById('m3uInput').value.trim();
    if(link.length > 5) {
        localStorage.setItem('gc_manual_m3u', link);
        carregarM3U(link, true);
    } else {
        alert("Insira um link M3U válido!");
    }
}

function carregarM3U(url, showAlert) {
    // Usando proxy CORS público para evitar bloqueio do navegador
    let proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    
    fetch(proxyUrl)
        .then(res => res.text())
        .then(data => {
            analisarM3U(data);
            if(showAlert) {
                alert("Lista carregada com sucesso! Navegue até a aba 'Canais'.");
                mudarAba('canais');
                document.querySelector('#sidebar nav button:nth-child(2)').classList.add('on');
            }
        })
        .catch(err => {
            console.error(err);
            if(showAlert) alert("Erro ao carregar a lista M3U. Verifique o link ou bloqueio de CORS.");
        });
}

function analisarM3U(conteudo) {
    let linhas = conteudo.split('\n');
    canaisLista = [];
    let nomeAtual = "Canal sem nome";
    let logoAtual = "";

    for(let i = 0; i < linhas.length; i++) {
        let linha = linhas[i].trim();
        if(linha.startsWith('#EXTINF:')) {
            let matchNome = linha.match(/,(.+)$/);
            if(matchNome) nomeAtual = matchNome[1];
            
            let matchLogo = linha.match(/tvg-logo="([^"]+)"/);
            logoAtual = matchLogo ? matchLogo[1] : "";
        } else if(linha && !linha.startsWith('#')) {
            canaisLista.push({
                nome: nomeAtual,
                url: linha,
                logo: logoAtual
            });
        }
    }
    
    exibirCanais();
}

function exibirCanais() {
    let container = document.getElementById('listaCanais');
    container.innerHTML = "";
    
    if(canaisLista.length === 0) {
        container.innerHTML = "<p style='color:var(--dim);grid-column:1/-1;'>Nenhum canal encontrado. Verifique se o link possui o formato M3U padrão.</p>";
        return;
    }

    canaisLista.forEach((canal, index) => {
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="thumb">📺</div>
            <div class="detail">
                <div class="nm">${canal.nome}</div>
                <div class="mt">Ao Vivo</div>
            </div>
        `;
        card.onclick = () => abrirPlayer(canal.url, canal.nome);
        container.appendChild(card);
    });
}

function abrirPlayer(url, nome) {
    document.getElementById('overlayTitle').innerText = nome;
    let video = document.getElementById('videoPlayer');
    document.getElementById('player-overlay').classList.add('on');

    if (Hls.isSupported() && url.includes('.m3u8')) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); });
    } else {
        video.src = url;
        video.play();
    }
}

function fecharPlayer() {
    let video = document.getElementById('videoPlayer');
    video.pause();
    video.src = "";
    document.getElementById('player-overlay').classList.remove('on');
}
</script>
</body>
</html>
