<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GC PLAY PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    position:sticky;
    top:0;
    z-index:50;
    height:108px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 24px;
    background:#050505;
    border-bottom:1px solid #222;
}

.logo{
    color:#28ff18;
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;
}

.top-actions{
    display:flex;
    gap:14px;
}

.btn{
    border:1px solid #333;
    background:#111;
    color:#fff;
    border-radius:18px;
    padding:16px 24px;
    font-size:24px;
    min-height:60px;
}

.btn:hover{
    border-color:#28ff18;
}

.btn-green{
    background:#28ff18;
    color:#050505;
    border-color:#28ff18;
    font-weight:900;
}

.btn-danger{
    background:#160606;
    border-color:#8d2222;
    color:#ff7777;
}

main{
    max-width:1400px;
    margin:auto;
    padding:36px 24px 80px;
}

.hero h1{
    font-size:52px;
    margin:0 0 12px;
}

.hero p{
    color:#999;
    font-size:28px;
    line-height:1.25;
    max-width:850px;
    margin:0 0 40px;
}

.status{
    border:1px solid #199e18;
    border-radius:18px;
    padding:18px 22px;
    font-size:24px;
    margin-bottom:28px;
    color:#a8ff9f;
    background:#091009;
}

.status.error{
    border-color:#8f2222;
    color:#ff9d9d;
    background:#120606;
}

.status.info{
    border-color:#555;
    color:#ccc;
    background:#0d0d0d;
}

.list-name{
    display:inline-block;
    border:1px solid #28ff18;
    color:#28ff18;
    border-radius:30px;
    padding:12px 24px;
    font-size:24px;
    margin-bottom:30px;
}

.controls{
    display:grid;
    grid-template-columns:280px 200px 1fr;
    gap:14px;
    margin-bottom:24px;
}

.control{
    width:100%;
    min-height:70px;
    border:1px solid #333;
    border-radius:18px;
    background:#111;
    color:#fff;
    padding:12px 20px;
    font-size:22px;
    outline:none;
}

.control:focus{
    border-color:#28ff18;
}

select.control{
    appearance:auto;
}

.pagination-info{
    color:#888;
    font-size:20px;
    margin-bottom:16px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:16px;
}

.card{
    background:#0c0c0c;
    border:1px solid #292929;
    border-radius:20px;
    overflow:hidden;
    min-height:250px;
    transition:.15s;
}

.card:hover{
    border-color:#28ff18;
    transform:translateY(-2px);
}

.card-img{
    width:100%;
    height:160px;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play-icon{
    font-size:58px;
    color:#333;
}

.card-body{
    padding:16px;
}

.card-title{
    font-size:21px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-meta{
    color:#777;
    margin-top:8px;
    font-size:17px;
}

.empty{
    text-align:center;
    color:#777;
    font-size:24px;
    padding:70px 20px;
}

.loading{
    text-align:center;
    padding:80px 20px;
    color:#aaa;
    font-size:25px;
}

.modal-bg{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-bg.open{
    display:flex;
}

.modal{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid #333;
    border-radius:24px;
    padding:28px;
}

.modal h2{
    margin:0 0 24px;
    font-size:30px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    color:#aaa;
    margin-bottom:8px;
    font-size:18px;
}

.field input{
    width:100%;
    background:#080808;
    color:#fff;
    border:1px solid #444;
    border-radius:14px;
    padding:17px;
    font-size:19px;
    outline:none;
}

.field input:focus{
    border-color:#28ff18;
}

.modal-actions{
    display:flex;
    gap:12px;
    justify-content:flex-end;
    margin-top:25px;
}

.saved-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}

.saved-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid #333;
    background:#090909;
    border-radius:14px;
    padding:14px;
}

.saved-info{
    min-width:0;
}

.saved-name{
    font-weight:bold;
    font-size:19px;
}

.saved-url{
    color:#777;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:420px;
}

.saved-actions{
    display:flex;
    gap:8px;
}

.small-btn{
    border:1px solid #333;
    background:#151515;
    color:#fff;
    border-radius:10px;
    padding:10px 14px;
}

.small-btn:hover{
    border-color:#28ff18;
}

.player-bg{
    position:fixed;
    inset:0;
    z-index:200;
    background:#000;
    display:none;
    flex-direction:column;
}

.player-bg.open{
    display:flex;
}

.player-top{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    background:#080808;
    border-bottom:1px solid #222;
}

.player-title{
    font-size:21px;
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.player-close{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #444;
    background:#111;
    color:#fff;
    font-size:28px;
}

.video-area{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.player-message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:#aaa;
    text-align:center;
    font-size:20px;
    display:none;
    z-index:3;
    width:90%;
}

.series-box{
    margin-top:15px;
    border-top:1px solid #333;
    padding-top:15px;
}

.episode{
    display:block;
    width:100%;
    text-align:left;
    border:1px solid #333;
    background:#0a0a0a;
    color:#fff;
    border-radius:12px;
    padding:14px;
    margin-bottom:8px;
}

.episode:hover{
    border-color:#28ff18;
}

@media(max-width:1000px){
    .grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}

@media(max-width:700px){
    .topbar{
        height:86px;
        padding:14px 20px;
    }

    .logo{
        font-size:30px;
    }

    .top-actions{
        gap:8px;
    }

    .top-actions .btn{
        padding:12px 16px;
        min-height:52px;
        font-size:18px;
    }

    main{
        padding:28px 20px 60px;
    }

    .hero h1{
        font-size:38px;
    }

    .hero p{
        font-size:22px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .card-img{
        height:125px;
    }

    .card-title{
        font-size:17px;
    }

    .card-meta{
        font-size:14px;
    }

    .modal{
        padding:20px;
    }
}

@media(max-width:430px){
    .logo{
        font-size:25px;
    }

    .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .card{
        min-height:210px;
    }

    .card-img{
        height:105px;
    }

    .play-icon{
        font-size:42px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="logo">GC PLAY PRO</div>

    <div class="top-actions">
        <button class="btn" id="btnListas">LISTAS</button>
        <button class="btn btn-green" id="btnAddM3U">+ M3U</button>
    </div>

</header>


<main>

    <section class="hero">

        <h1>Sua TV, do seu jeito.</h1>

        <p>
            Cada lista utiliza seu próprio servidor.
            O GC PLAY PRO não fica preso a nenhum servidor específico.
        </p>

    </section>


    <div id="status" class="status info">
        Nenhuma lista carregada.
    </div>


    <div id="listName" class="list-name" style="display:none;"></div>


    <section id="contentArea">

        <div class="controls">

            <select id="category" class="control">
                <option value="all">Todas (0)</option>
            </select>

            <button id="btnRefresh" class="btn">
                ↻ Atualizar
            </button>

            <input
                id="search"
                class="control"
                type="search"
                placeholder="Pesquisar canal, filme, série..."
                autocomplete="off"
            >

        </div>


        <div id="paginationInfo" class="pagination-info"></div>

        <div id="grid" class="grid"></div>

        <div id="loading" class="loading" style="display:none;">
            Carregando...
        </div>

    </section>

</main>


<!-- MODAL ADICIONAR M3U -->

<div id="m3uModal" class="modal-bg">

    <div class="modal">

        <h2>Adicionar lista M3U</h2>

        <div class="field">

            <label>Nome da lista</label>

            <input
                id="m3uName"
                type="text"
                placeholder="Ex.: Minha TV"
            >

        </div>

        <div class="field">

            <label>URL da lista M3U</label>

            <input
                id="m3uUrl"
                type="url"
                placeholder="http://servidor.com/get.php?..."
                autocomplete="off"
            >

        </div>

        <div class="modal-actions">

            <button
                class="btn"
                id="btnCancelM3U">
                Cancelar
            </button>

            <button
                class="btn btn-green"
                id="btnLoadM3U">
                CARREGAR LISTA
            </button>

        </div>

    </div>

</div>


<!-- MODAL LISTAS -->

<div id="listasModal" class="modal-bg">

    <div class="modal">

        <h2>Minhas listas</h2>

        <div id="savedLists" class="saved-list"></div>

        <div class="modal-actions">

            <button
                class="btn"
                id="btnCloseListas">
                Fechar
            </button>

            <button
                class="btn btn-green"
                id="btnNewList">
                + Nova M3U
            </button>

        </div>

    </div>

</div>


<!-- MODAL SÉRIE -->

<div id="seriesModal" class="modal-bg">

    <div class="modal">

        <h2 id="seriesTitle">Série</h2>

        <div id="seriesEpisodes"></div>

        <div class="modal-actions">

            <button
                class="btn"
                id="btnCloseSeries">
                Fechar
            </button>

        </div>

    </div>

</div>


<!-- PLAYER -->

<div id="playerBg" class="player-bg">

    <div class="player-top">

        <div id="playerTitle" class="player-title">
            Reproduzindo
        </div>

        <button
            id="playerClose"
            class="player-close">
            ×
        </button>

    </div>

    <div class="video-area">

        <video
            id="video"
            controls
            playsinline
            autoplay>
        </video>

        <div
            id="playerMessage"
            class="player-message">
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const PROXY_URL =
    "https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/gcplay-proxy";


/*
   Quantidade de itens mostrados por página.

   A lista pode possuir centenas de milhares de itens.
   Não colocamos todos os cards no DOM ao mesmo tempo.
*/
const PAGE_SIZE = 100;


/* =========================================================
   ESTADO
========================================================= */

let listas = [];

let listaAtual = null;

let itens = [];

let itensFiltrados = [];

let paginaAtual = 1;

let hls = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const statusEl = document.getElementById("status");

const listNameEl = document.getElementById("listName");

const gridEl = document.getElementById("grid");

const loadingEl = document.getElementById("loading");

const categoryEl = document.getElementById("category");

const searchEl = document.getElementById("search");

const paginationInfoEl =
    document.getElementById("paginationInfo");

const m3uModal =
    document.getElementById("m3uModal");

const listasModal =
    document.getElementById("listasModal");

const seriesModal =
    document.getElementById("seriesModal");

const playerBg =
    document.getElementById("playerBg");

const video =
    document.getElementById("video");

const playerTitle =
    document.getElementById("playerTitle");

const playerMessage =
    document.getElementById("playerMessage");


/* =========================================================
   UTILITÁRIOS
========================================================= */

function mostrarStatus(texto, tipo="info"){

    statusEl.textContent = texto;

    statusEl.className = "status " + tipo;

}


function escaparHTML(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function abrirModal(modal){

    modal.classList.add("open");

}


function fecharModal(modal){

    modal.classList.remove("open");

}


/* =========================================================
   STORAGE
========================================================= */

function salvarListas(){

    try{

        localStorage.setItem(
            "gcplay_pro_listas",
            JSON.stringify(listas)
        );

    }catch(e){

        console.warn(
            "Não foi possível salvar as listas.",
            e
        );

    }

}


function carregarListasStorage(){

    try{

        const dados =
            localStorage.getItem("gcplay_pro_listas");

        if(!dados){
            listas = [];
            return;
        }

        const obj = JSON.parse(dados);

        if(Array.isArray(obj)){
            listas = obj;
        }else{
            listas = [];
        }

    }catch(e){

        listas = [];

    }

}


/* =========================================================
   MODAL M3U
========================================================= */

function abrirM3U(){

    document.getElementById("m3uName").value = "";

    document.getElementById("m3uUrl").value = "";

    abrirModal(m3uModal);

    setTimeout(() => {

        document
            .getElementById("m3uName")
            .focus();

    },100);

}


function fecharM3U(){

    fecharModal(m3uModal);

}


async function adicionarM3U(){

    const nome =
        document
            .getElementById("m3uName")
            .value
            .trim();

    const url =
        document
            .getElementById("m3uUrl")
            .value
            .trim();

    if(!nome){

        alert("Digite um nome para a lista.");

        return;

    }

    if(!url){

        alert("Cole o link M3U.");

        return;

    }

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        alert(
            "O link precisa começar com http:// ou https://"
        );

        return;

    }

    const novaLista = {

        id:
            Date.now().toString(36) +
            Math.random().toString(36).slice(2),

        nome: nome,

        url: url

    };

    /*
       Se já existir uma lista com o mesmo nome,
       substitui.
    */

    listas =
        listas.filter(
            item =>
                item.nome.toLowerCase() !==
                nome.toLowerCase()
        );

    listas.push(novaLista);

    salvarListas();

    fecharM3U();

    await carregarLista(novaLista);

}


/* =========================================================
   LISTAS SALVAS
========================================================= */

function abrirListas(){

    renderizarListas();

    abrirModal(listasModal);

}


function renderizarListas(){

    const container =
        document.getElementById("savedLists");

    container.innerHTML = "";

    if(listas.length === 0){

        container.innerHTML =
            `<div class="empty">
                Nenhuma lista salva.
             </div>`;

        return;

    }

    listas.forEach(lista => {

        const div =
            document.createElement("div");

        div.className = "saved-item";

        div.innerHTML = `

            <div class="saved-info">

                <div class="saved-name">
                    ${escaparHTML(lista.nome)}
                </div>

                <div class="saved-url">
                    ${escaparHTML(lista.url)}
                </div>

            </div>

            <div class="saved-actions">

                <button
                    class="small-btn"
                    data-action="open"
                    data-id="${escaparHTML(lista.id)}">
                    Abrir
                </button>

                <button
                    class="small-btn"
                    data-action="delete"
                    data-id="${escaparHTML(lista.id)}">
                    Excluir
                </button>

            </div>
        `;

        container.appendChild(div);

    });

}


async function abrirListaSalva(id){

    const lista =
        listas.find(
            item => item.id === id
        );

    if(!lista){

        alert("Lista não encontrada.");

        return;

    }

    fecharModal(listasModal);

    await carregarLista(lista);

}


function excluirLista(id){

    const lista =
        listas.find(
            item => item.id === id
        );

    if(!lista){
        return;
    }

    if(
        !confirm(
            `Excluir a lista "${lista.nome}"?`
        )
    ){

        return;

    }

    listas =
        listas.filter(
            item => item.id !== id
        );

    salvarListas();

    if(
        listaAtual &&
        listaAtual.id === id
    ){

        listaAtual = null;

        itens = [];

        itensFiltrados = [];

        gridEl.innerHTML = "";

        listNameEl.style.display = "none";

        mostrarStatus(
            "Lista excluída.",
            "info"
        );

    }

    renderizarListas();

}


/* =========================================================
   CARREGAMENTO DA M3U
========================================================= */

async function carregarLista(lista){

    mostrarStatus(
        "Conectando ao servidor da lista...",
        "info"
    );

    loadingEl.style.display = "block";

    gridEl.innerHTML = "";

    itens = [];

    itensFiltrados = [];

    paginaAtual = 1;

    listaAtual = lista;

    listNameEl.textContent = lista.nome;

    listNameEl.style.display = "inline-block";


    try{

        /*
          IMPORTANTE:

          O navegador NÃO acessa diretamente o servidor IPTV.

          A requisição vai para o Supabase Proxy.
          Assim cada lista pode ter seu próprio servidor.
        */

        const endpoint =
            PROXY_URL +
            "?mode=playlist&url=" +
            encodeURIComponent(lista.url);


        const resposta =
            await fetch(
                endpoint,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const texto =
            await resposta.text();


        let dados = null;

        try{

            dados = JSON.parse(texto);

        }catch(e){

            dados = null;

        }


        if(!resposta.ok){

            throw new Error(
                dados?.error ||
                texto ||
                `HTTP ${resposta.status}`
            );

        }


        if(
            dados &&
            dados.success === false
        ){

            throw new Error(
                dados.error ||
                "O servidor recusou a lista."
            );

        }


        /*
          O proxy pode retornar:

          - texto M3U diretamente
          - JSON contendo playlist
        */

        let m3u = texto;


        if(
            dados &&
            typeof dados.playlist === "string"
        ){

            m3u = dados.playlist;

        }

        else if(
            dados &&
            typeof dados.data === "string"
        ){

            m3u = dados.data;

        }


        if(
            !m3u ||
            !m3u.includes("#EXT")
        ){

            throw new Error(
                "A resposta não parece ser uma lista M3U válida."
            );

        }


        mostrarStatus(
            "Processando a lista...",
            "info"
        );


        /*
          Parser progressivo.
        */

        itens =
            parseM3U(m3u);


        if(itens.length === 0){

            throw new Error(
                "Nenhum item foi encontrado na lista."
            );

        }


        /*
          Guarda a lista atualizada.
        */

        listaAtual = lista;

        aplicarFiltro();

        mostrarStatus(
            `${itens.length.toLocaleString("pt-BR")} itens carregados de ${lista.nome}.`,
            "ok"
        );

    }
    catch(error){

        console.error(error);

        mostrarStatus(
            "Erro ao carregar: " +
            error.message,
            "error"
        );

        gridEl.innerHTML =
            `<div class="empty">
                Não foi possível carregar a lista.
             </div>`;

    }
    finally{

        loadingEl.style.display = "none";

    }

}


/* =========================================================
   PARSER M3U
========================================================= */

function parseM3U(text){

    const resultado = [];

    const linhas =
        text
            .replace(/\r/g,"")
            .split("\n");


    let info = null;


    for(let i=0; i<linhas.length; i++){

        const linha =
            linhas[i].trim();


        if(!linha){
            continue;
        }


        if(linha.startsWith("#EXTINF")){

            info =
                interpretarEXTINF(linha);

            continue;

        }


        if(
            info &&
            (
                linha.startsWith("http://") ||
                linha.startsWith("https://")
            )
        ){

            const item = {

                id:
                    resultado.length + 1,

                name:
                    info.name ||
                    "Sem nome",

                group:
                    info.group ||
                    "Outros",

                logo:
                    info.logo ||
                    "",

                tvgId:
                    info.tvgId ||
                    "",

                tvgName:
                    info.tvgName ||
                    "",

                url:
                    linha,

                type:
                    detectarTipo(
                        info.name,
                        info.group,
                        linha
                    )

            };


            resultado.push(item);

            info = null;

        }

    }


    return resultado;

}


/* =========================================================
   EXTINF
========================================================= */

function interpretarEXTINF(linha){

    const resultado = {

        name:"",
        group:"",
        logo:"",
        tvgId:"",
        tvgName:""

    };


    const match =
        linha.match(
            /#EXTINF:[^,]*,(.*)$/i
        );


    if(match){

        resultado.name =
            match[1].trim();

    }


    const attrs = [

        ["group","group-title"],

        ["logo","tvg-logo"],

        ["tvgId","tvg-id"],

        ["tvgName","tvg-name"]

    ];


    attrs.forEach(([campo,atributo]) => {

        const regex =
            new RegExp(
                atributo +
                '="([^"]*)"',
                "i"
            );

        const match =
            linha.match(regex);

        if(match){

            resultado[campo] =
                match[1];

        }

    });


    /*
      Alguns servidores usam aspas simples.
    */

    if(!resultado.group){

        const match =
            linha.match(
                /group-title='([^']*)'/i
            );

        if(match){

            resultado.group =
                match[1];

        }

    }


    if(!resultado.logo){

        const match =
            linha.match(
                /tvg-logo='([^']*)'/i
            );

        if(match){

            resultado.logo =
                match[1];

        }

    }


    return resultado;

}


/* =========================================================
   DETECTAR TIPO
========================================================= */

function detectarTipo(nome,grupo,url){

    const texto =
        (
            (nome || "") +
            " " +
            (grupo || "") +
            " " +
            (url || "")
        ).toLowerCase();


    if(
        texto.includes("adult") ||
        texto.includes("xxx") ||
        texto.includes("18+")
    ){

        return "adult";

    }


    if(
        texto.includes("series") ||
        texto.includes("séries") ||
        texto.includes("serie") ||
        texto.includes("season") ||
        texto.includes("/series/") ||
        texto.includes("/series")
    ){

        return "series";

    }


    if(
        texto.includes("filmes") ||
        texto.includes("films") ||
        texto.includes("movie") ||
        texto.includes("/movie/") ||
        texto.includes("/vod/")
    ){

        return "films";

    }


    if(
        texto.includes("music") ||
        texto.includes("música")
    ){

        return "music";

    }


    return "tv";

}


/* =========================================================
   CATEGORIAS
========================================================= */

function reconstruirCategorias(){

    categoryEl.innerHTML = "";

    const categorias = {

        all:{
            nome:"Todas",
            count:itens.length
        },

        tv:{
            nome:"TV",
            count:0
        },

        films:{
            nome:"Films",
            count:0
        },

        series:{
            nome:"Series",
            count:0
        },

        music:{
            nome:"Music",
            count:0
        },

        adult:{
            nome:"Adult",
            count:0
        }

    };


    itens.forEach(item => {

        if(
            categorias[item.type]
        ){

            categorias[item.type].count++;

        }

    });


    Object.entries(categorias)
        .forEach(([valor,obj]) => {

            const option =
                document.createElement("option");

            option.value = valor;

            option.textContent =
                `${obj.nome} (${obj.count.toLocaleString("pt-BR")})`;

            categoryEl.appendChild(option);

        });

}


/* =========================================================
   FILTRO
========================================================= */

function aplicarFiltro(){

    reconstruirCategorias();


    const categoria =
        categoryEl.value || "all";


    const busca =
        searchEl.value
            .trim()
            .toLowerCase();


    itensFiltrados =
        itens.filter(item => {

            if(
                categoria !== "all" &&
                item.type !== categoria
            ){

                return false;

            }


            if(busca){

                const texto =
                    (
                        item.name +
                        " " +
                        item.group +
                        " " +
                        item.tvgName
                    ).toLowerCase();

                if(
                    !texto.includes(busca)
                ){

                    return false;

                }

            }


            return true;

        });


    paginaAtual = 1;

    renderizarPagina();

}


/* =========================================================
   RENDER
========================================================= */

function renderizarPagina(){

    gridEl.innerHTML = "";


    if(itensFiltrados.length === 0){

        paginationInfoEl.textContent = "";

        gridEl.innerHTML =
            `<div class="empty">
                Nenhum item encontrado.
             </div>`;

        return;

    }


    const total =
        itensFiltrados.length;


    const inicio =
        (paginaAtual - 1) *
        PAGE_SIZE;


    const fim =
        Math.min(
            inicio + PAGE_SIZE,
            total
        );


    paginationInfoEl.textContent =
        `Mostrando ${(inicio+1).toLocaleString("pt-BR")}–${fim.toLocaleString("pt-BR")} de ${total.toLocaleString("pt-BR")}`;


    const fragment =
        document.createDocumentFragment();


    for(
        let i=inicio;
        i<fim;
        i++
    ){

        const item =
            itensFiltrados[i];


        const card =
            document.createElement("div");

        card.className = "card";


        let imagem = "";

        if(item.logo){

            imagem = `
                <img
                    src="${escaparHTML(item.logo)}"
                    loading="lazy"
                    onerror="this.style.display='none'">
            `;

        }


        card.innerHTML = `

            <div class="card-img">

                ${
                    imagem ||
                    `<div class="play-icon">▶</div>`
                }

            </div>

            <div class="card-body">

                <div class="card-title">
                    ${escaparHTML(item.name)}
                </div>

                <div class="card-meta">
                    ${tipoTexto(item.type)}
                    ${item.group ? " | " + escaparHTML(item.group) : ""}
                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            () => abrirItem(item)
        );


        fragment.appendChild(card);

    }


    gridEl.appendChild(fragment);


    renderizarPaginacao(total);

}


/* =========================================================
   TEXTO TIPO
========================================================= */

function tipoTexto(tipo){

    switch(tipo){

        case "tv":
            return "Canais";

        case "films":
            return "Filmes";

        case "series":
            return "Séries";

        case "music":
            return "Música";

        case "adult":
            return "Adult";

        default:
            return "Mídia";

    }

}


/* =========================================================
   PAGINAÇÃO
========================================================= */

function renderizarPaginacao(total){

    const paginas =
        Math.ceil(
            total / PAGE_SIZE
        );


    if(paginas <= 1){
        return;
    }


    const nav =
        document.createElement("div");

    nav.style.cssText =
        `
        display:flex;
        justify-content:center;
        align-items:center;
        gap:10px;
        margin-top:30px;
        flex-wrap:wrap;
        `;


    const anterior =
        document.createElement("button");

    anterior.className = "btn";

    anterior.textContent = "‹ Anterior";

    anterior.disabled =
        paginaAtual <= 1;


    anterior.onclick = () => {

        if(paginaAtual > 1){

            paginaAtual--;

            renderizarPagina();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    };


    const proxima =
        document.createElement("button");

    proxima.className = "btn";

    proxima.textContent = "Próxima ›";

    proxima.disabled =
        paginaAtual >= paginas;


    proxima.onclick = () => {

        if(paginaAtual < paginas){

            paginaAtual++;

            renderizarPagina();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    };


    const info =
        document.createElement("span");

    info.style.color = "#888";

    info.textContent =
        `Página ${paginaAtual} de ${paginas}`;


    nav.appendChild(anterior);

    nav.appendChild(info);

    nav.appendChild(proxima);


    gridEl.parentElement
        .appendChild(nav);

}


/* =========================================================
   ABRIR ITEM
========================================================= */

function abrirItem(item){

    if(!item || !item.url){
        return;
    }


    /*
       Série:

       Mantemos o comportamento simples e seguro.
       Se houver vários episódios relacionados,
       o usuário pode selecionar o episódio.
    */

    if(item.type === "series"){

        abrirPlayer(item);

        return;

    }


    abrirPlayer(item);

}


/* =========================================================
   CONSTRUIR URL DO PROXY DE MÍDIA
========================================================= */

function urlMediaProxy(url){

    return (
        PROXY_URL +
        "?mode=media&url=" +
        encodeURIComponent(url)
    );

}


/* =========================================================
   PLAYER
========================================================= */

async function abrirPlayer(item){

    playerTitle.textContent =
        item.name || "Reproduzindo";


    playerMessage.style.display =
        "none";


    playerMessage.textContent = "";


    abrirModal(playerBg);


    pararPlayer();


    const originalURL =
        item.url;


    const proxyURL =
        urlMediaProxy(originalURL);


    /*
      Primeiro tentamos determinar o formato.
    */

    const urlLower =
        originalURL.toLowerCase();


    const ehHLS =
        urlLower.includes(".m3u8") ||
        urlLower.includes("output=hls") ||
        urlLower.includes("type=hls");


    try{

        if(ehHLS){

            await tocarHLS(
                proxyURL
            );

            return;

        }


        /*
          MPEG-TS:

          O navegador normalmente não reproduz
          MPEG-TS puro no elemento <video>.

          Por isso o proxy pode entregar o fluxo
          quando o servidor disponibilizar formato
          compatível.

          Tentamos primeiro a reprodução nativa.
        */

        await tocarNativo(
            proxyURL
        );

    }
    catch(error){

        console.error(
            "Erro no player:",
            error
        );


        mostrarMensagemPlayer(
            "Não foi possível reproduzir este conteúdo."
        );

    }

}


/* =========================================================
   HLS
========================================================= */

function tocarHLS(url){

    return new Promise(
        (resolve,reject) => {

            if(
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ){

                video.src = url;

                video.onloadedmetadata =
                    () => {

                        video.play()
                            .catch(()=>{});

                        resolve();

                    };


                video.onerror =
                    () => {

                        reject(
                            new Error(
                                "Falha no HLS nativo."
                            )
                        );

                    };


                return;

            }


            if(
                window.Hls &&
                Hls.isSupported()
            ){

                hls =
                    new Hls({
                        enableWorker:true,
                        lowLatencyMode:false,
                        backBufferLength:30
                    });


                hls.loadSource(url);

                hls.attachMedia(video);


                hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    () => {

                        video.play()
                            .catch(()=>{});

                        resolve();

                    }
                );


                hls.on(
                    Hls.Events.ERROR,
                    (event,data) => {

                        if(
                            data &&
                            data.fatal
                        ){

                            reject(
                                new Error(
                                    "Erro fatal no HLS."
                                )
                            );

                        }

                    }
                );


                return;

            }


            reject(
                new Error(
                    "Este navegador não suporta HLS."
                )
            );

        }
    );

}


/* =========================================================
   PLAYER NATIVO
========================================================= */

function tocarNativo(url){

    return new Promise(
        (resolve,reject) => {

            video.src = url;

            const sucesso =
                () => {

                    video.play()
                        .catch(()=>{});

                    resolve();

                };


            const erro =
                () => {

                    reject(
                        new Error(
                            "Falha na reprodução."
                        )
                    );

                };


            video.onloadedmetadata =
                sucesso;

            video.onerror =
                erro;


            /*
              Alguns servidores demoram
              para começar a responder.
            */

            setTimeout(
                () => {

                    if(
                        video.readyState >= 2
                    ){

                        sucesso();

                    }

                },
                3000
            );

        }
    );

}


/* =========================================================
   MENSAGEM DO PLAYER
========================================================= */

function mostrarMensagemPlayer(texto){

    playerMessage.textContent =
        texto;

    playerMessage.style.display =
        "block";

}


/* =========================================================
   PARAR PLAYER
========================================================= */

function pararPlayer(){

    try{

        if(hls){

            hls.destroy();

            hls = null;

        }

    }catch(e){}


    try{

        video.pause();

        video.removeAttribute("src");

        video.load();

    }catch(e){}

}


/* =========================================================
   FECHAR PLAYER
========================================================= */

function fecharPlayer(){

    pararPlayer();

    fecharModal(playerBg);

}
