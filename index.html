<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#050505">

<title>GC PLAY PRO</title>

<style>

/* =========================================================
   BASE
========================================================= */

:root{
    --bg:#050505;
    --panel:#101010;
    --panel2:#171717;
    --line:#292929;
    --text:#f5f5f5;
    --muted:#999;
    --green:#39ff14;
    --red:#ff4545;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(5,5,5,.97);
    border-bottom:1px solid var(--line);
}

.top{
    max-width:1400px;
    margin:auto;
    min-height:76px;
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    color:var(--green);
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
    white-space:nowrap;
}

.grow{
    flex:1;
}


/* =========================================================
   BOTÕES
========================================================= */

.btn{
    border:1px solid #333;
    background:#111;
    color:#fff;
    border-radius:12px;
    padding:12px 16px;
    transition:.18s;
}

.btn:hover{
    border-color:var(--green);
}

.btn.primary{
    background:var(--green);
    color:#000;
    border-color:var(--green);
    font-weight:900;
}

.btn.danger{
    color:#ff8585;
}


/* =========================================================
   MAIN
========================================================= */

main{
    max-width:1400px;
    margin:auto;
    padding:20px 16px 40px;
}

.hero{
    padding:20px 4px 14px;
}

.hero h1{
    margin:0 0 10px;
    font-size:40px;
}

.hero p{
    margin:0;
    color:var(--muted);
    font-size:20px;
    line-height:1.4;
    max-width:800px;
}


/* =========================================================
   STATUS
========================================================= */

.status{
    margin:14px 0;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#0c0c0c;
    color:#bbb;
}

.status.ok{
    color:#baffb1;
    border-color:#168b0d;
}

.status.err{
    color:#ffb1b1;
    border-color:#922222;
}


/* =========================================================
   LISTAS
========================================================= */

.lists{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 0;
    scrollbar-width:none;
}

.lists::-webkit-scrollbar{
    display:none;
}

.pill{
    border:1px solid #333;
    background:#101010;
    color:#fff;
    border-radius:999px;
    padding:10px 15px;
    white-space:nowrap;
}

.pill.active{
    border-color:var(--green);
    color:var(--green);
}


/* =========================================================
   CONTROLES
========================================================= */

.toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    margin:12px 0;
}

.search{
    flex:1;
    min-width:220px;
    max-width:520px;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid #333;
    background:#0e0e0e;
    color:#fff;
    outline:none;
}

.search:focus{
    border-color:var(--green);
}

.toolbar select{
    padding:13px 14px;
    border-radius:12px;
    border:1px solid #333;
    background:#0e0e0e;
    color:#fff;
}


/* =========================================================
   CONTADOR
========================================================= */

.counter{
    color:#888;
    font-size:13px;
    margin:8px 0;
}


/* =========================================================
   GRID
========================================================= */

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );
    gap:12px;
}


/* =========================================================
   CARD
========================================================= */

.card{
    background:
        linear-gradient(
            180deg,
            #161616,
            #0b0b0b
        );

    border:1px solid #262626;
    border-radius:14px;
    overflow:hidden;
    min-height:160px;
}

.card button{
    width:100%;
    border:0;
    background:transparent;
    color:inherit;
    text-align:left;
    padding:0;
}

.thumb{
    height:110px;
    background:#080808;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.noimg{
    font-size:34px;
    color:#333;
}

.ct{
    padding:10px;
}

.ct b{
    display:block;
    font-size:14px;
    line-height:1.3;
}

.ct small{
    display:block;
    margin-top:5px;
    color:#777;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   CARD DE SÉRIE
========================================================= */

.seriesCard{
    min-height:190px;
}

.seriesCard .thumb{
    height:135px;
}

.seriesInfo{
    padding:10px;
}

.seriesInfo b{
    display:block;
    font-size:15px;
    line-height:1.25;
}

.seriesInfo small{
    display:block;
    margin-top:6px;
    color:#888;
}


/* =========================================================
   PAGINAÇÃO
========================================================= */

.pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    padding:25px 0 10px;
}

.pageInfo{
    color:#999;
    min-width:130px;
    text-align:center;
}

.pageBtn{
    min-width:42px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #333;
    background:#111;
    color:#fff;
}

.pageBtn.active{
    border-color:var(--green);
    color:var(--green);
}

.pageBtn:disabled{
    opacity:.35;
    cursor:not-allowed;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 15px;
    color:#777;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:80;
    background:rgba(0,0,0,.82);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.box{
    width:min(650px,100%);
    max-height:92vh;
    overflow:auto;
    background:#101010;
    border:1px solid #333;
    border-radius:17px;
    padding:20px;
}

.box h2{
    margin:0 0 16px;
}

.field{
    margin:14px 0;
}

.field label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #333;
    background:#080808;
    color:#fff;
    outline:none;
}

.field input:focus{
    border-color:var(--green);
}

.actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    flex-wrap:wrap;
    margin-top:18px;
}


/* =========================================================
   LIST MANAGER
========================================================= */

.listRow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid #292929;
    border-radius:12px;
    background:#0b0b0b;
    margin:8px 0;
}

.listRow .name{
    font-weight:800;
}

.listRow .url{
    color:#777;
    font-size:12px;
    margin-top:4px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}


/* =========================================================
   PLAYER
========================================================= */

.playerModal .box{
    width:min(1100px,100%);
    padding:10px;
}

.playerHeader{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 4px 10px;
}

.playerTitle{
    flex:1;
    font-weight:800;
}

.playerWrap{
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

.playerWrap video{
    width:100%;
    display:block;
    background:#000;
    max-height:72vh;
}

.playerStatus{
    padding:10px 5px;
    color:#888;
    font-size:13px;
}


/* =========================================================
   TOAST
========================================================= */

#toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:120;
    background:#171717;
    border:1px solid #333;
    padding:12px 16px;
    border-radius:11px;
    max-width:90%;
    text-align:center;
    display:none;
}


/* =========================================================
   MODAL SÉRIE
========================================================= */

.seriesModal .box{
    width:min(800px,100%);
}

.season{
    border:1px solid #292929;
    border-radius:12px;
    margin:10px 0;
    overflow:hidden;
}

.seasonTitle{
    width:100%;
    padding:13px;
    border:0;
    background:#171717;
    color:#fff;
    text-align:left;
    font-weight:800;
}

.episodeList{
    display:none;
}

.episodeList.open{
    display:block;
}

.episode{
    display:flex;
    gap:10px;
    align-items:center;
    padding:11px;
    border-top:1px solid #292929;
    background:#0c0c0c;
}

.episodeName{
    flex:1;
    font-size:14px;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:900px){

    .top{
        padding-left:22px;
        padding-right:22px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .top{
        min-height:64px;
        padding:8px 12px;
    }

    .logo{
        font-size:21px;
    }

    .top .btn{
        padding:10px 12px;
    }

    main{
        padding:12px;
    }

    .hero{
        padding-top:18px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero p{
        font-size:17px;
    }

    .grid{
        grid-template-columns:
            repeat(
                2,
                minmax(
                    0,
                    1fr
                )
            );
        gap:8px;
    }

    .thumb{
        height:90px;
    }

    .seriesCard .thumb{
        height:105px;
    }

    .ct{
        padding:8px;
    }

    .ct b{
        font-size:12px;
    }

    .ct small{
        font-size:11px;
    }

    .search{
        width:100%;
        max-width:none;
        min-width:0;
        order:1;
    }

    .toolbar select{
        flex:1;
    }

    .toolbar .btn{
        flex:1;
    }

    .listRow{
        align-items:flex-start;
        flex-wrap:wrap;
    }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>



<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const PROXY_URL =
"https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/gcplay-proxy";

const STORAGE_KEY =
"gcplay_pro_v6";

const ITEMS_PER_PAGE = 100;


/* =========================================================
   ESTADO
========================================================= */

let state = {

    lists: [],

    current: null,

    items: [],

    page: 1,

    filtered: [],

    seriesGroups: [],

    viewMode: "normal"

};


let hls = null;

let mpegPlayer = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char])
        );

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const el =
        $("toast");

    el.textContent =
        message;

    el.style.display =
        "block";

    clearTimeout(
        window.__toast
    );

    window.__toast =
        setTimeout(
            () => {

                el.style.display =
                    "none";

            },
            3000
        );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    ok = true
){

    const el =
        $("status");

    el.textContent =
        text;

    el.className =
        "status " +
        (
            ok
            ? "ok"
            : "err"
        );

    el.classList.remove(
        "hidden"
    );

}


/* =========================================================
   STORAGE
========================================================= */

function saveState(){

    try{

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(
                state.lists
            )

        );

    }

    catch(error){

        console.warn(
            "Não foi possível salvar:",
            error
        );

    }

}


function loadState(){

    try{

        state.lists =
            JSON.parse(

                localStorage.getItem(
                    STORAGE_KEY
                ) ||
                "[]"

            );

        if(
            !Array.isArray(
                state.lists
            )
        ){

            state.lists = [];

        }

    }

    catch(error){

        state.lists = [];

    }

}


/* =========================================================
   URL DO PROXY
========================================================= */

function proxyURL(
    target,
    mode
){

    return (

        PROXY_URL +

        "?mode=" +

        encodeURIComponent(
            mode
        ) +

        "&url=" +

        encodeURIComponent(
            target
        )

    );

}


/* =========================================================
   NORMALIZAR URL
========================================================= */

function normalizeURL(url){

    url =
        String(
            url || ""
        ).trim();

    if(!url){

        return "";

    }

    if(
        url.startsWith("//")
    ){

        return "http:" + url;

    }

    return url;

}


/* =========================================================
   PARSER EXTINF
========================================================= */

function parseEXTINF(line){

    const data = {};

    const regex =
        /([\w-]+)="([^"]*)"/g;

    let match;

    while(
        (
            match =
            regex.exec(line)
        )
    ){

        data[
            match[1].toLowerCase()
        ] =
            match[2];

    }

    const comma =
        line.indexOf(",");

    data.title =

        comma >= 0

        ?

        line
            .slice(
                comma + 1
            )
            .trim()

        :

        "Sem nome";

    return data;

}


/* =========================================================
   CLASSIFICAÇÃO
========================================================= */

function classify(
    metadata,
    url
){

    const group =
        (
            metadata[
                "group-title"
            ] ||
            ""
        )
        .toLowerCase();

    const title =
        (
            metadata.title ||
            ""
        )
        .toLowerCase();

    const address =
        (
            url ||
            ""
        )
        .toLowerCase();

    const combined =
        group +
        " " +
        title;


    if(
        /adult|18\+|xxx|erotic|adulto/
        .test(combined)
    ){

        return "Adult";

    }


    if(
        /series?|série|season|temporada|episode|episódio/
        .test(combined)

        ||

        /\/series?\//
        .test(address)
    ){

        return "Series";

    }


    if(
        /movie|filme|film|vod|cinema/
        .test(combined)

        ||

        /\/movies?\//
        .test(address)
    ){

        return "Films";

    }


    if(
        /music|música|radio/
        .test(combined)
    ){

        return "Music";

    }


    return "TV";

}


/* =========================================================
   ADICIONAR ITEM
========================================================= */

function addItem(
    metadata,
    url
){

    url =
        normalizeURL(
            url
        );

    if(!url){

        return;

    }

    metadata =
        metadata ||
        {
            title:"Canal"
        };


    state.items.push({

        id:
            state.items.length,

        name:
            metadata.title
            ||
            metadata[
                "tvg-name"
            ]
            ||
            "Sem nome",

        url:

            url,

        logo:

            metadata[
                "tvg-logo"
            ]
            ||
            "",

        group:

            metadata[
                "group-title"
            ]
            ||
            "Sem categoria",

        tvgId:

            metadata[
                "tvg-id"
            ]
            ||
            "",

        category:

            classify(
                metadata,
                url
            ),

        raw:
            metadata

    });

}


/* =========================================================
   NOME DA SÉRIE
========================================================= */

function getSeriesName(
    item
){

    let name =
        item.name
        ||
        "Série sem nome";


    /*
       Remove padrões comuns de episódio.
    */

    name =
        name.replace(

            /\bS\d{1,3}\s*E\d{1,3}\b/gi,

            ""

        );


    name =
        name.replace(

            /\b\d{1,3}x\d{1,3}\b/gi,

            ""

        );


    name =
        name.replace(

            /\btemporada\s*\d+\b/gi,

            ""

        );


    name =
        name.replace(

            /\bseason\s*\d+\b/gi,

            ""

        );


    name =
        name.replace(

            /\bepis[oó]dio\s*\d+\b/gi,

            ""

        );


    name =
        name.replace(

            /\bepisode\s*\d+\b/gi,

            ""

        );


    name =
        name.replace(

            /[\[\(]\s*(?:S\d+|E\d+|S\d+\s*E\d+)[^\]\)]*[\]\)]/gi,

            ""

        );


    return name
        .replace(
            /\s+/g,
            " "
        )
        .replace(
            /[-|:]+\s*$/,
            ""
        )
        .trim();

}


/* =========================================================
   TEMPORADA DO ITEM
========================================================= */

function getSeasonNumber(
    item
){

    const text =
        item.name +
        " " +
        item.url;


    let match =
        text.match(
            /\bS(\d{1,3})\b/i
        );


    if(match){

        return Number(
            match[1]
        );

    }


    match =
        text.match(
            /\bseason[\s._-]*(\d{1,3})\b/i
        );


    if(match){

        return Number(
            match[1]
        );

    }


    match =
        text.match(
            /\btemporada[\s._-]*(\d{1,3})\b/i
        );


    if(match){

        return Number(
            match[1]
        );

    }


    return 1;

}


/* =========================================================
   EPISÓDIO
========================================================= */

function getEpisodeNumber(
    item
){

    const text =
        item.name +
        " " +
        item.url;


    let match =
        text.match(
            /\bE(\d{1,3})\b/i
        );


    if(match){

        return Number(
            match[1]
        );

    }


    match =
        text.match(
            /\b\d{1,3}x(\d{1,3})\b/i
        );


    if(match){

        return Number(
            match[1]
        );

    }


    match =
        text.match(
            /\b(?:epis[oó]dio|episode)[\s._-]*(\d{1,3})\b/i
        );


    if(match){

        return Number(
            match[1]
        );

    }


    return 0;

}


/* =========================================================
   AGRUPAR SÉRIES
========================================================= */

function buildSeriesGroups(){

    const map =
        new Map();


    for(
        const item
        of state.items
    ){

        if(
            item.category !==
            "Series"
        ){

            continue;

        }


        const name =
            getSeriesName(
                item
            );


        const key =
            name
                .toLowerCase()
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();


        if(
            !map.has(key)
        ){

            map.set(
                key,
                {

                    name:
                        name,

                    logo:
                        item.logo,

                    items:[]

                }
            );

        }


        map
            .get(key)
            .items
            .push(item);

    }


    state.seriesGroups =
        Array.from(
            map.values()
        );


    state.seriesGroups
        .sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name
                )
        );

}


/* =========================================================
   CATEGORIAS
========================================================= */

function buildCategories(){

    const select =
        $("cat");

    const old =
        select.value;


    const counts = {};


    for(
        const item
        of state.items
    ){

        counts[
            item.category
        ] =

            (
                counts[
                    item.category
                ] ||
                0
            ) + 1;

    }


    let html =
        '<option value="ALL">' +
        'Todas (' +
        state.items.length +
        ')' +
        '</option>';


    const order = [

        "TV",
        "Films",
        "Series",
        "Music",
        "Adult"

    ];


    for(
        const category
        of order
    ){

        if(
            counts[category]
        ){

            html +=

                '<option value="' +
                category +
                '">' +

                category +

                " (" +
                counts[category] +
                ")" +

                "</option>";

        }

    }


    for(
        const category
        of Object.keys(
            counts
        )
        .filter(
            c =>
                !order.includes(c)
        )
        .sort()
    ){

        html +=

            '<option value="' +
            escapeHTML(category) +
            '">' +

            escapeHTML(category) +

            " (" +
            counts[category] +
            ")" +

            "</option>";

    }


    select.innerHTML =
        html;


    if(
        Array.from(
            select.options
        )
        .some(
            option =>
                option.value === old
        )
    ){

        select.value =
            old;

    }

}

/* =========================================================
   MODO DA TELA
========================================================= */

function updateViewMode(){

    const category =
        $("cat").value;


    state.viewMode =
        category ===
        "Series"
        ?
        "series"
        :
        "normal";

}


/* =========================================================
   PREPARAR FILTRO
========================================================= */

function prepareFiltered(){

    updateViewMode();


    const search =
        $("search")
            .value
            .trim()
            .toLowerCase();


    const category =
        $("cat").value;


    /*
       SÉRIES
    */

    if(
        category ===
        "Series"
    ){

        state.filtered =
            state.seriesGroups
            .filter(
                series => {

                    if(!search){

                        return true;

                    }


                    return (

                        series.name
                            .toLowerCase()
                            .includes(
                                search
                            )

                        ||

                        series.items.some(
                            item =>

                                item.name
                                    .toLowerCase()
                                    .includes(
                                        search
                                    )
                        )

                    );

                }
            );

        return;

    }


    /*
       OUTRAS CATEGORIAS
    */

    state.filtered =
        state.items
        .filter(
            item => {

                const categoryOK =

                    category ===
                    "ALL"

                    ||

                    item.category ===
                    category;


                const searchOK =

                    !search

                    ||

                    (

                        item.name +

                        " " +

                        item.group +

                        " " +

                        item.url

                    )
                    .toLowerCase()
                    .includes(
                        search
                    );


                return (

                    categoryOK
                    &&
                    searchOK

                );

            }
        );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    prepareFiltered();


    const total =
        state.filtered.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                total /
                ITEMS_PER_PAGE
            )
        );


    if(
        state.page >
        totalPages
    ){

        state.page =
            totalPages;

    }


    if(
        state.page < 1
    ){

        state.page = 1;

    }


    const start =
        (
            state.page -
            1
        ) *
        ITEMS_PER_PAGE;


    const pageItems =
        state.filtered.slice(

            start,

            start +
            ITEMS_PER_PAGE

        );


    const grid =
        $("grid");


    /*
       CONTADOR
    */

    if(total){

        const first =
            start + 1;

        const last =
            Math.min(
                start +
                ITEMS_PER_PAGE,
                total
            );


        $("counter").textContent =

            state.viewMode ===
            "series"

            ?

            (
                "Mostrando séries " +
                first +
                "–" +
                last +
                " de " +
                total
            )

            :

            (
                "Mostrando " +
                first +
                "–" +
                last +
                " de " +
                total
            );

    }

    else{

        $("counter").textContent =
            "Nenhum resultado";

    }


    /*
       GRID VAZIO
    */

    if(
        !pageItems.length
    ){

        grid.innerHTML =

            '<div class="empty">' +

            "Nenhum item encontrado." +

            "</div>";


        renderPagination(
            totalPages
        );

        return;

    }


    /*
       SÉRIES
    */

    if(
        state.viewMode ===
        "series"
    ){

        grid.innerHTML =
            pageItems
            .map(
                renderSeriesCard
            )
            .join("");

    }

    else{

        grid.innerHTML =
            pageItems
            .map(
                renderItemCard
            )
            .join("");

    }


    /*
       PAGINAÇÃO
    */

    renderPagination(
        totalPages
    );


    /*
       Eventos
    */

    bindGridEvents();

}

/* =========================================================
   PAGINAÇÃO
========================================================= */

function renderPagination(
    totalPages
){

    const el =
        $("pagination");


    if(
        totalPages <= 1
    ){

        el.innerHTML =
            "";

        return;

    }


    let html = "";


    html +=

        '<button class="pageBtn" ' +

        'data-page="prev" ' +

        (
            state.page <= 1
            ?
            "disabled"
            :
            ""
        ) +

        '>‹</button>';


    /*
       Janela de páginas
    */

    let start =
        Math.max(
            1,
            state.page - 2
        );


    let end =
        Math.min(
            totalPages,
            start + 4
        );


    if(
        end - start < 4
    ){

        start =
            Math.max(
                1,
                end - 4
            );

    }


    for(
        let i = start;
        i <= end;
        i++
    ){

        html +=

            '<button class="pageBtn ' +

            (
                i === state.page
                ?
                "active"
                :
                ""
            ) +

            '" data-page="' +
            i +
            '">' +

            i +

            "</button>";

    }


    html +=

        '<span class="pageInfo">' +

        state.page +

        " / " +

        totalPages +

        "</span>";


    html +=

        '<button class="pageBtn" ' +

        'data-page="next" ' +

        (
            state.page >= totalPages
            ?
            "disabled"
            :
            ""
        ) +

        '>›</button>';


    el.innerHTML =
        html;


    el
        .querySelectorAll(
            "[data-page]"
        )
        .forEach(
            button => {

                button.onclick = () => {

                    const value =
                        button.dataset.page;


                    if(
                        value ===
                        "prev"
                    ){

                        if(
                            state.page > 1
                        ){

                            state.page--;

                        }

                    }

                    else if(
                        value ===
                        "next"
                    ){

                        if(
                            state.page <
                            totalPages
                        ){

                            state.page++;

                        }

                    }

                    else{

                        state.page =
                            Number(
                                value
                            );

                    }


                    render();


                    window.scrollTo({

                        top:0,

                        behavior:
                            "smooth"

                    });

                };

            }
        );

}

/* =========================================================
   SALVAR M3U
========================================================= */

async function saveM3U(){

    const name =
        $("mName")
            .value
            .trim()
        ||
        "Minha TV";


    const url =
        $("mUrl")
            .value
            .trim();


    if(
        !/^https?:\/\//i
        .test(url)
    ){

        toast(
            "Informe uma URL HTTP ou HTTPS válida."
        );

        return;

    }


    const list = {

        id:
            crypto.randomUUID(),

        name:
            name,

        url:
            url,

        createdAt:
            new Date()
                .toISOString(),

        updatedAt:
            null

    };


    state.lists.push(
        list
    );


    saveState();


    closeM3U();


    $("mName").value =
        "";

    $("mUrl").value =
        "";


    await loadList(
        list
    );

}


/* =========================================================
   CARREGAR LISTA
========================================================= */

async function loadList(
    list
){

    state.current =
        list.id;

    state.items =
        [];

    state.filtered =
        [];

    state.seriesGroups =
        [];

    state.page =
        1;


    renderListPills();

    buildCategories();

    render();


    setStatus(

        "Conectando ao servidor de " +
        list.name +
        "...",

        true

    );


    try{

        const response =
            await fetch(

                proxyURL(
                    list.url,
                    "playlist"
                ),

                {

                    method:"GET",

                    cache:"no-store",

                    headers:{

                        "Accept":
                            "application/x-mpegURL,text/plain,*/*"

                    }

                }

            );


        if(
            !response.ok
        ){

            const errorText =
                await response.text();


            throw new Error(

                errorText
                ||
                (
                    "HTTP " +
                    response.status
                )

            );

        }


        if(
            !response.body
        ){

            throw new Error(
                "O navegador não disponibilizou o fluxo."
            );

        }


        /*
        =====================================================
        STREAMING
        =====================================================
        */

        const reader =
            response.body
                .getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer = "";

        let metadata =
            null;

        let total = 0;


        /*
        =====================================================
        LER POR PARTES
        =====================================================
        */

        while(true){

            const result =
                await reader.read();


            if(
                result.done
            ){

                break;

            }


            buffer +=

                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split(
                    /\r?\n/
                );


            buffer =
                lines.pop()
                ||
                "";


            for(
                const rawLine
                of lines
            ){

                const line =
                    rawLine.trim();


                if(!line){

                    continue;

                }


                if(
                    line.startsWith(
                        "#EXTINF"
                    )
                ){

                    metadata =
                        parseEXTINF(
                            line
                        );

                    continue;

                }


                if(
                    line.startsWith("#")
                ){

                    continue;

                }


                const url =
                    normalizeURL(
                        line
                    );


                if(!url){

                    continue;

                }


                addItem(
                    metadata,
                    url
                );


                metadata =
                    null;


                total++;


                /*
                =============================================
                A CADA 100 ITENS
                =============================================
                */

                if(
                    total % 100 === 0
                ){

                    setStatus(

                        total +
                        " itens encontrados...",

                        true

                    );


                    /*
                       NÃO renderiza 100 vezes.
                       Apenas atualiza a informação.
                    */

                    if(
                        total % 1000 === 0
                    ){

                        await new Promise(
                            resolve =>
                                setTimeout(
                                    resolve,
                                    0
                                )
                        );

                    }

                }

            }

        }


        /*
        =====================================================
        FINAL DO DECODER
        =====================================================
        */

        buffer +=
            decoder.decode();


        const lastLines =
            buffer.split(
                /\r?\n/
            );


        for(
            const rawLine
            of lastLines
        ){

            const line =
                rawLine.trim();


            if(!line){

                continue;

            }


            if(
                line.startsWith(
                    "#EXTINF"
                )
            ){

                metadata =
                    parseEXTINF(
                        line
                    );

                continue;

            }


            if(
                line.startsWith("#")
            ){

                continue;

            }


            const url =
                normalizeURL(
                    line
                );


            if(!url){

                continue;

            }


            addItem(
                metadata,
                url
            );


            metadata =
                null;

        }


        /*
        =====================================================
        AGRUPAR SÉRIES
        =====================================================
        */

        setStatus(
            "Organizando " +
            state.items.length +
            " itens...",
            true
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    0
                )
        );


        buildSeriesGroups();


        list.updatedAt =
            new Date()
                .toISOString();


        saveState();


        buildCategories();


        state.page =
            1;


        render();


        setStatus(

            state.items.length +
            " itens carregados de " +
            list.name +
            ".",

            true

        );


        toast(
            "Lista carregada com sucesso."
        );

    }

    catch(error){

        console.error(
            "GC PLAY PRO:",
            error
        );


        setStatus(

            "Erro ao carregar: " +
            error.message,

            false

        );


        toast(
            "Falha ao carregar a lista."
        );

    }

}

/* =========================================================
   EDITAR
========================================================= */

function editList(
    id
){

    const list =
        state.lists.find(
            item =>
                item.id === id
        );


    if(!list){

        return;

    }


    const name =
        prompt(
            "Nome da lista:",
            list.name
        );


    if(
        name === null
    ){

        return;

    }


    const url =
        prompt(
            "URL M3U:",
            list.url
        );


    if(
        url === null
    ){

        return;

    }


    if(
        !/^https?:\/\//i
        .test(
            url.trim()
        )
    ){

        toast(
            "URL inválida."
        );

        return;

    }


    list.name =
        name.trim()
        ||
        "Minha TV";


    list.url =
        url.trim();


    saveState();


    renderListManager();


    loadList(
        list
    );

}


/* =========================================================
   EXCLUIR
========================================================= */

function deleteList(
    id
){

    if(
        !confirm(
            "Excluir esta lista?"
        )
    ){

        return;

    }


    state.lists =
        state.lists.filter(
            list =>
                list.id !== id
        );


    if(
        state.current === id
    ){

        state.current =
            null;

        state.items =
            [];

        state.filtered =
            [];

        state.seriesGroups =
            [];

    }


    saveState();


    renderListManager();

    renderListPills();

    buildCategories();

    render();

}


/* =========================================================
   SELECIONAR LISTA
========================================================= */

function selectList(
    id
){

    const list =
        state.lists.find(
            item =>
                item.id === id
        );


    if(list){

        loadList(
            list
        );

    }

}


/* =========================================================
   ATUALIZAR
========================================================= */

async function refreshCurrent(){

    const list =
        state.lists.find(
            item =>
                item.id ===
                state.current
        );


    if(!list){

        toast(
            "Adicione uma lista primeiro."
        );

        return;

    }


    await loadList(
        list
    );

}


/* =========================================================
   SÉRIES
========================================================= */

function openSeries(
    seriesName
){

    const series =
        state.seriesGroups.find(
            item =>
                item.name ===
                seriesName
        );


    if(!series){

        return;

    }


    $("seriesTitle")
        .textContent =
        series.name;


    const seasons =
        new Map();


    for(
        const episode
        of series.items
    ){

        const season =
            getSeasonNumber(
                episode
            );


        if(
            !seasons.has(
                season
            )
        ){

            seasons.set(
                season,
                []
            );

        }


        seasons
            .get(season)
            .push(
                episode
            );

    }


    const seasonNumbers =
        Array.from(
            seasons.keys()
        )
        .sort(
            (a,b) =>
                a - b
        );


    $("seriesContent").innerHTML =

        seasonNumbers
        .map(
            season => {

                const episodes =
                    seasons
                        .get(
                            season
                        )
                        .sort(
                            (a,b) =>
                                getEpisodeNumber(a) -
                                getEpisodeNumber(b)
                        );


                return

                    '<div class="season">' +

                        '<button class="seasonTitle">' +

                        'Temporada ' +
                        season +

                        ' (' +
                        episodes.length +
                        ' episódios)' +

                        '</button>' +

                        '<div class="episodeList">' +

                            episodes
                            .map(
                                episode =>

                                    '<div class="episode">' +

                                        '<div class="episodeName">' +

                                        escapeHTML(
                                            episode.name
                                        ) +

                                        '</div>' +

                                        '<button class="btn primary" data-episode="' +

                                        episode.id +

                                        '">' +

                                        '▶' +

                                        '</button>' +

                                    '</div>'

                            )
                            .join("") +

                        '</div>' +

                    '</div>';

            }
        )
        .join("");


    $("seriesModal")
        .classList
        .remove(
            "hidden"
        );


    /*
       Abrir/fechar temporadas
    */

    $("seriesContent")
        .querySelectorAll(
            ".seasonTitle"
        )
        .forEach(
            button => {

                button.onclick = () => {

                    const list =
                        button
                            .nextElementSibling;


                    list.classList.toggle(
                        "open"
                    );

                };

            }
        );


    /*
       Episódios
    */

    $("seriesContent")
        .querySelectorAll(
            "[data-episode]"
        )
        .forEach(
            button => {

                button.onclick = () => {

                    const id =
                        Number(
                            button.dataset.episode
                        );


                    closeSeries();


                    playItem(
                        id
                    );

                };

            }
        );

}


function closeSeries(){

    $("seriesModal")
        .classList
        .add(
            "hidden"
        );

}


/* =========================================================
   PLAYER
========================================================= */

function closePlayer(){

    $("playerModal")
        .classList
        .add(
            "hidden"
        );


    if(hls){

        try{
            hls.destroy();
        }
        catch(e){}

        hls =
            null;

    }


    if(mpegPlayer){

        try{
            mpegPlayer.destroy();
        }
        catch(e){}

        mpegPlayer =
            null;

    }


    const video =
        $("video");


    try{
        video.pause();
    }
    catch(e){}


    video.removeAttribute(
        "src"
    );


    video.load();

}


function playerStatus(
    text
){

    $("playerStatus")
        .textContent =
        text;

}


/* =========================================================
   REPRODUZIR
========================================================= */

function playItem(
    id
){

    const item =
        state.items.find(
            channel =>
                channel.id === id
        );


    if(!item){

        toast(
            "Canal não encontrado."
        );

        return;

    }


    closePlayer();


    $("playerName")
        .textContent =
        item.name;


    $("playerModal")
        .classList
        .remove(
            "hidden"
        );


    playerStatus(
        "Conectando ao servidor..."
    );


    const video =
        $("video");


    /*
    ========================================================
    SEMPRE PASSAR PELO PROXY
    ========================================================
    */

    const streamURL =
        proxyURL(
            item.url,
            "media"
        );


    const original =
        item.url
            .toLowerCase();


    /*
    ========================================================
    HLS
    ========================================================
    */

    if(
        /\.m3u8(?:$|\?)/i
        .test(
            original
        )
    ){

        if(
            window.Hls &&
            Hls.isSupported()
        ){

            hls =
                new Hls({

                    enableWorker:
                        true,

                    lowLatencyMode:
                        false,

                    enableStashBuffer:
                        true

                });


            hls.loadSource(
                streamURL
            );


            hls.attachMedia(
                video
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {

                    playerStatus(
                        "HLS conectado."
                    );


                    video
                        .play()
                        .catch(
                            () => {}
                        );

                }
            );


            hls.on(
                Hls.Events.ERROR,
                (
                    event,
                    data
                ) => {

                    console.error(
                        "HLS:",
                        data
                    );


                    if(
                        data &&
                        data.fatal
                    ){

                        playerStatus(
                            "Erro HLS: " +
                            (
                                data.details ||
                                "falha fatal"
                            )
                        );

                    }

                }
            );

        }

        else if(
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ){

            video.src =
                streamURL;


            video
                .play()
                .catch(
                    () => {}
                );

        }

        else{

            playerStatus(
                "Este navegador não suporta HLS."
            );

        }


        return;

    }


    /*
    ========================================================
    MPEG-TS
    ========================================================
    */

    if(
        typeof mpegts ===
        "undefined"
    ){

        playerStatus(
            "mpegts.js não carregou."
        );

        return;

    }


    try{

        mpegPlayer =
            mpegts.createPlayer(

                {

                    type:
                        "mpegts",

                    isLive:
                        true,

                    url:
                        streamURL

                },

                {

                    enableWorker:
                        true,

                    enableStashBuffer:
                        true,

                    stashInitialSize:
                        128

                }

            );


        mpegPlayer.attachMediaElement(
            video
        );


        mpegPlayer.load();


        mpegPlayer.play()
            .catch(
                () => {}
            );


        mpegPlayer.on(
            mpegts.Events.ERROR,
            (
                type,
                detail,
                info
            ) => {

                console.error(
                    "MPEGTS:",
                    type,
                    detail,
                    info
                );


                playerStatus(
                    "Falha ao reproduzir MPEG-TS."
                );

            }
        );


        playerStatus(
            "MPEG-TS conectado."
        );

    }

    catch(error){

        console.error(
            error
        );


        playerStatus(

            "Erro no player: " +
            error.message

        );

    }

}


/* =========================================================
   FECHAR MODAIS AO CLICAR FORA
========================================================= */

[
    "m3uModal",
    "listsModal",
    "seriesModal",
    "playerModal"
]
.forEach(
    id => {

        $(id)
            .addEventListener(
                "click",
                event => {

                    if(
                        event.target ===
                        $(id)
                    ){

                        $(id)
                            .classList
                            .add(
                                "hidden"
                            );

                    }

                }
            );

    }
);

   INICIALIZAÇÃO
========================================================= */

loadState();


renderListPills();


buildCategories();


if(
    state.lists.length
){

    /*
       Recupera a primeira lista.
    */

    loadList(
        state.lists[0]
    );

}

else{

    $("grid").innerHTML =

        '<div class="empty">' +

        'Adicione sua primeira lista M3U para começar.' +

        '</div>';

}
