/* =========================================================

.menu {

/* =========================================================

/* =========================================================

========================================================= */

.canal {

}

<header>

<!-- =======================================================

<section id="home">

<section id="app">


    <div class="menu">

        </button>

<script>

/* =========================================================
   VARIÁVEIS GLOBAIS
========================================================= */

let canais = [];

let canaisFiltrados = [];

let categoriaAtual = "todos";

let hls = null;


/* =========================================================
   ABRIR MODAL M3U
========================================================= */

function abrirManual() {

    const modal =
        document.getElementById(
            "manualModal"
        );


    if (!modal) {

        alert(
            "Erro interno: janela M3U não encontrada."
        );

        return;

    }


    modal.style.display =
        "flex";


    const campo =
        document.getElementById(
            "m3uInput"
        );


    if (campo) {

        setTimeout(
            function() {

                campo.focus();

                campo.setSelectionRange(
                    campo.value.length,
                    campo.value.length
                );

            },
            150
        );

    }

}


/* =========================================================
   FECHAR MODAL M3U
========================================================= */

function fecharManual() {

    const modal =
        document.getElementById(
            "manualModal"
        );


    if (modal) {

        modal.style.display =
            "none";

    }

}


/* =========================================================
   CARREGAR M3U
========================================================= */

async function carregarM3U() {

    const campo =
        document.getElementById(
            "m3uInput"
        );


    if (!campo) {

        alert(
            "Campo M3U não encontrado."
        );

        return;

    }


    const url =
        campo.value.trim();


    /* -----------------------------------------------------
       VERIFICAR URL
    ----------------------------------------------------- */

    if (!url) {

        alert(
            "Cole o endereço da sua lista M3U."
        );

        campo.focus();

        return;

    }


    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        alert(
            "A URL precisa começar com:\n\n" +
            "http://\n\n" +
            "ou\n\n" +
            "https://"
        );

        campo.focus();

        return;

    }


    /* -----------------------------------------------------
       FECHAR MODAL
    ----------------------------------------------------- */

    fecharManual();


    /* -----------------------------------------------------
       MOSTRAR APP
    ----------------------------------------------------- */

    mostrarApp();


    /* -----------------------------------------------------
       STATUS
    ----------------------------------------------------- */

    mostrarStatus(
        "⏳ Conectando ao servidor da M3U...",
        "normal"
    );


    try {

        console.log(
            "================================="
        );

        console.log(
            "GC PLAY PRO"
        );

        console.log(
            "URL M3U:",
            url
        );

        console.log(
            "================================="
        );


        /* -------------------------------------------------
           FETCH
        ------------------------------------------------- */

        const resposta =
            await fetch(
                url,
                {
                    method:
                        "GET",

                    cache:
                        "no-store",

                    redirect:
                        "follow"
                }
            );


        console.log(
            "HTTP:",
            resposta.status
        );


        if (!resposta.ok) {

            throw new Error(
                "Servidor retornou HTTP " +
                resposta.status
            );

        }


        /* -------------------------------------------------
           TEXTO
        ------------------------------------------------- */

        mostrarStatus(
            "⏳ Baixando lista M3U...",
            "normal"
        );


        const texto =
            await resposta.text();


        console.log(
            "Tamanho recebido:",
            texto.length
        );


        if (
            !texto ||
            !texto.trim()
        ) {

            throw new Error(
                "A lista retornada está vazia."
            );

        }


        /* -------------------------------------------------
           VALIDAR M3U
        ------------------------------------------------- */

        if (
            !texto.includes(
                "#EXTINF"
            ) &&
            !texto.includes(
                "#EXTM3U"
            )
        ) {

            throw new Error(
                "O conteúdo recebido não parece ser uma lista M3U válida."
            );

        }


        /* -------------------------------------------------
           SALVAR URL
        ------------------------------------------------- */

        try {

            localStorage.setItem(
                "gc_m3u_url",
                url
            );

        } catch(e) {

            console.warn(
                "Não foi possível salvar a URL."
            );

        }


        /* -------------------------------------------------
           PROCESSAR
        ------------------------------------------------- */

        mostrarStatus(
            "⏳ Processando canais...",
            "normal"
        );


        processarM3U(
            texto
        );


    } catch(erro) {

        console.error(
            "ERRO M3U:",
            erro
        );


        mostrarStatus(
            "❌ Erro ao carregar a M3U.",
            "error"
        );


        alert(
            "NÃO FOI POSSÍVEL CARREGAR A LISTA.\n\n" +
            erro.message +
            "\n\n" +
            "Se estiver usando GitHub Pages, " +
            "uma M3U HTTP pode ser bloqueada pelo navegador. " +
            "Nesse caso vamos colocar o proxy do GC PLAY PRO."
        );

    }

}


/* =========================================================
   PROCESSAR M3U
========================================================= */

function processarM3U(texto) {

    canais = [];


    const linhas =
        texto.split(
            /\r?\n/
        );


    let atual = null;


    for (
        let i = 0;
        i < linhas.length;
        i++
    ) {

        const linha =
            linhas[i].trim();


        if (!linha) {

            continue;

        }


        /* -------------------------------------------------
           EXTINF
        ------------------------------------------------- */

        if (
            linha
                .toUpperCase()
                .startsWith(
                    "#EXTINF"
                )
        ) {


            const virgula =
                linha.indexOf(",");


            let nome =
                virgula >= 0
                ? linha
                    .substring(
                        virgula + 1
                    )
                    .trim()
                : "Sem nome";


            nome =
                nome
                    .replace(
                        /^[-\s]+/,
                        ""
                    )
                    .trim();


            const grupo =
                extrairAtributo(
                    linha,
                    "group-title"
                ) ||
                extrairAtributo(
                    linha,
                    "group"
                ) ||
                "Outros";


            const logo =
                extrairAtributo(
                    linha,
                    "tvg-logo"
                ) || "";


            const id =
                extrairAtributo(
                    linha,
                    "tvg-id"
                ) || "";


            const categoria =
                detectarCategoria(
                    grupo,
                    nome
                );


            atual = {

                nome:
                    nome,

                grupo:
                    grupo,

                logo:
                    logo,

                id:
                    id,

                categoria:
                    categoria,

                url:
                    ""

            };


            continue;

        }


        /* -------------------------------------------------
           IGNORAR OUTRAS LINHAS #
        ------------------------------------------------- */

        if (
            linha.startsWith("#")
        ) {

            continue;

        }


        /* -------------------------------------------------
           URL
        ------------------------------------------------- */

        if (atual) {

            atual.url =
                linha;


            if (
                atual.url.startsWith(
                    "http://"
                ) ||
                atual.url.startsWith(
                    "https://"
                )
            ) {

                canais.push(
                    atual
                );

            }


            atual = null;

        }

    }


    console.log(
        "TOTAL DE ITENS:",
        canais.length
    );


    /* -----------------------------------------------------
       NENHUM ITEM
    ----------------------------------------------------- */

    if (
        canais.length === 0
    ) {

        mostrarStatus(
            "❌ Nenhum conteúdo foi encontrado.",
            "error"
        );


        document.getElementById(
            "lista"
        ).innerHTML = `
            <div class="empty">
                Nenhum canal ou conteúdo encontrado nesta M3U.
            </div>
        `;


        return;

    }


    /* -----------------------------------------------------
       MOSTRAR
    ----------------------------------------------------- */

    mostrarApp();


    categoriaAtual =
        "todos";


    canaisFiltrados =
        canais;


    renderizarLista(
        canais
    );


    mostrarStatus(
        "✅ " +
        canais.length +
        " conteúdos carregados com sucesso.",
        "ok"
    );

}


/* =========================================================
   EXTRAIR ATRIBUTO
========================================================= */

function extrairAtributo(
    linha,
    atributo
) {

    let regex =
        new RegExp(
            atributo +
            '\\s*=\\s*"([^"]*)"',
            "i"
        );


    let resultado =
        linha.match(
            regex
        );


    if (resultado) {

        return resultado[1];

    }


    regex =
        new RegExp(
            atributo +
            "\\s*=\\s*'([^']*)'",
            "i"
        );


    resultado =
        linha.match(
            regex
        );


    if (resultado) {

        return resultado[1];

    }


    return "";

}


/* =========================================================
   DETECTAR CATEGORIA
========================================================= */

function detectarCategoria(
    grupo,
    nome
) {

    const texto =
        (
            String(grupo) +
            " " +
            String(nome)
        )
        .toLowerCase();


    /* ADULTO */

    if (
        texto.includes("adult") ||
        texto.includes("xxx") ||
        texto.includes("18+")
    ) {

        return "adult";

    }


    /* SÉRIES */

    if (
        texto.includes("series") ||
        texto.includes("séries") ||
        texto.includes("serie") ||
        texto.includes("série") ||
        texto.includes("season") ||
        texto.includes("temporada")
    ) {

        return "series";

    }


    /* FILMES */

    if (
        texto.includes("filme") ||
        texto.includes("filmes") ||
        texto.includes("movie") ||
        texto.includes("movies") ||
        texto.includes("vod")
    ) {

        return "vod";

    }


    /* MÚSICA */

    if (
        texto.includes("music") ||
        texto.includes("música") ||
        texto.includes("musica")
    ) {

        return "music";

    }


    /* PADRÃO */

    return "live";

}


/* =========================================================
   RENDERIZAR LISTA
========================================================= */

function renderizarLista(
    lista
) {

    const container =
        document.getElementById(
            "lista"
        );


    if (!container) {

        return;

    }


    container.innerHTML =
        "";


    if (
        !lista ||
        lista.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                Nenhum conteúdo encontrado.
            </div>
        `;

        return;

    }


    const fragment =
        document.createDocumentFragment();


    lista.forEach(
        function(canal) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "canal";


            card.tabIndex =
                0;


            /* ------------------------------------------------
               LOGO
            ------------------------------------------------ */

            if (canal.logo) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    canal.logo;


                img.alt =
                    canal.nome;


                img.loading =
                    "lazy";


                img.onerror =
                    function() {

                        this.style.display =
                            "none";

                    };


                card.appendChild(
                    img
                );

            }


            /* ------------------------------------------------
               INFORMAÇÕES
            ------------------------------------------------ */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "canal-info";


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "canal-nome";


            nome.textContent =
                canal.nome;


            const grupo =
                document.createElement(
                    "div"
                );


            grupo.className =
                "canal-grupo";


            grupo.textContent =
                canal.grupo;


            info.appendChild(
                nome
            );


            info.appendChild(
                grupo
            );


            card.appendChild(
                info
            );


            /* ------------------------------------------------
               CLICK
            ------------------------------------------------ */

            card.addEventListener(
                "click",
                function() {

                    abrirPlayer(
                        canal
                    );

                }
            );


            /* ------------------------------------------------
               TECLADO TV
            ------------------------------------------------ */

            card.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        abrirPlayer(
                            canal
                        );

                    }

                }
            );


            fragment.appendChild(
                card
            );

        }
    );


    container.appendChild(
        fragment
    );

}


/* =========================================================
   FILTRAR
========================================================= */

function filtrar(
    categoria
) {

    categoriaAtual =
        categoria;


    if (
        categoria ===
        "todos"
    ) {

        canaisFiltrados =
            canais;

    } else {

        canaisFiltrados =
            canais.filter(
                function(canal) {

                    return (
                        canal.categoria ===
                        categoria
                    );

                }
            );

    }


    renderizarLista(
        canaisFiltrados
    );


    mostrarStatus(
        canaisFiltrados.length +
        " conteúdos encontrados.",
        "ok"
    );

}


/* =========================================================
   PLAYER
========================================================= */

function abrirPlayer(
    canal
) {

    if (
        !canal ||
        !canal.url
    ) {

        alert(
            "Este conteúdo não possui URL de reprodução."
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const titulo =
        document.getElementById(
            "playerTitle"
        );


    if (
        !modal ||
        !video
    ) {

        alert(
            "Player não encontrado."
        );

        return;

    }


    titulo.textContent =
        canal.nome;


    /* -----------------------------------------------------
       DESTRUIR HLS ANTERIOR
    ----------------------------------------------------- */

    if (hls) {

        try {

            hls.destroy();

        } catch(e) {

            console.warn(e);

        }

        hls = null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    modal.style.display =
        "flex";


    const url =
        canal.url.trim();


    console.log(
        "REPRODUZINDO:",
        url
    );


    /* =====================================================
       HLS M3U8
    ===================================================== */

    if (
        url
            .toLowerCase()
            .includes(
                ".m3u8"
            )
    ) {


        /* -------------------------------------------------
           HLS NATIVO
        ------------------------------------------------- */

        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src =
                url;


            video.play()
                .catch(
                    function() {}
                );


            return;

        }


        /* -------------------------------------------------
           HLS.JS
        ------------------------------------------------- */

        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            hls =
                new Hls({

                    enableWorker:
                        true,

                    lowLatencyMode:
                        false,

                    backBufferLength:
                        30

                });


            hls.loadSource(
                url
            );


            hls.attachMedia(
                video
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    video.play()
                        .catch(
                            function() {}
                        );

                }
            );


            hls.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ) {

                    console.error(
                        "HLS ERROR:",
                        data
                    );


                    if (
                        data.fatal
                    ) {

                        mostrarStatus(
                            "❌ Erro na reprodução HLS.",
                            "error"
                        );

                    }

                }
            );


            return;

        }


        alert(
            "Seu navegador não possui suporte HLS."
        );


        return;

    }


    /* =====================================================
       MP4 / OUTROS FORMATOS
    ===================================================== */

    video.src =
        url;


    video.load();


    video.play()
        .catch(
            function(erro) {

                console.log(
                    "Autoplay bloqueado:",
                    erro
                );

            }
        );

}


/* =========================================================
   FECHAR PLAYER
========================================================= */

function fecharPlayer() {

    const video =
        document.getElementById(
            "videoPlayer"
        );


    if (hls) {

        try {

            hls.destroy();

        } catch(e) {}

        hls = null;

    }


    if (video) {

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    if (modal) {

        modal.style.display =
            "none";

    }

}

/* =========================================================
   STATUS
========================================================= */

function mostrarStatus(
    texto,
    tipo
) {

    const status =
        document.getElementById(
            "status"
        );


    if (!status) {

        return;

    }


    status.textContent =
        texto;


    status.className =
        "";


    if (
        tipo ===
        "ok"
    ) {

        status.classList.add(
            "ok"
        );

    }


    if (
        tipo ===
        "error"
    ) {

        status.classList.add(
            "error"
        );

    }

}
