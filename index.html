<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>GC PLAY PRO</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#070707;
}

/* HEADER */

.header{
    height:65px;
    min-height:65px;
    background:#111;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:bold;
    color:#00e5ff;
    white-space:nowrap;
}

.logo span{
    color:#fff;
}

.status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff9800;
}

.status.active .status-dot{
    background:#00e676;
}

.status.blocked .status-dot{
    background:#ff1744;
}

/* BODY */

.body{
    flex:1;
    min-height:0;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    min-width:250px;
    background:#0d0d0d;
    border-right:1px solid #222;
    display:flex;
    flex-direction:column;
}

.menu{
    padding:12px;
}

.menu button{
    width:100%;
    border:0;
    background:transparent;
    color:#aaa;
    padding:13px;
    text-align:left;
    border-radius:7px;
    margin-bottom:5px;
    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:#191919;
    color:#00e5ff;
}

.playlist-info{
    margin-top:auto;
    border-top:1px solid #222;
    padding:15px;
    color:#777;
    font-size:11px;
    line-height:1.5;
}

/* CONTENT */

.content{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* TOOLBAR */

.toolbar{
    min-height:58px;
    padding:10px 15px;
    display:flex;
    gap:8px;
    border-bottom:1px solid #222;
    background:#0b0b0b;
}

.toolbar input{
    flex:1;
    min-width:0;
    background:#171717;
    border:1px solid #292929;
    color:#fff;
    border-radius:7px;
    padding:0 13px;
    outline:none;
}

.toolbar input:focus{
    border-color:#00bcd4;
}

.btn{
    border:0;
    border-radius:7px;
    padding:0 15px;
    background:#00bcd4;
    color:#001014;
    font-weight:bold;
}

.btn:hover{
    filter:brightness(1.1);
}

.btn.secondary{
    background:#202020;
    color:#fff;
}

/* CHANNELS */

.channels{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:10px;
}

.channel{
    background:#121212;
    border:1px solid #242424;
    border-radius:9px;
    padding:11px;
    display:flex;
    gap:10px;
    align-items:center;
    min-height:70px;
    transition:.15s;
}

.channel:hover,
.channel.selected{
    border-color:#00bcd4;
    background:#181818;
}

.channel-logo{
    width:48px;
    height:48px;
    flex:none;
    object-fit:contain;
    background:#080808;
    border-radius:6px;
}

.channel-no-logo{
    width:48px;
    height:48px;
    flex:none;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#202020;
    color:#00bcd4;
    font-size:20px;
}

.channel-info{
    min-width:0;
}

.channel-name{
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel-group{
    color:#777;
    font-size:11px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* PLAYER */

.player{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    display:none;
    flex-direction:column;
}

.player.show{
    display:flex;
}

.player-video{
    flex:1;
    min-height:0;
    width:100%;
    background:#000;
    object-fit:contain;
}

.player-bar{
    min-height:60px;
    background:#101010;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 15px;
}

.player-title{
    flex:1;
    min-width:0;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-close{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#222;
    color:#fff;
    font-size:18px;
}

/* ACTIVATION */

.activation{
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.96);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.activation.hidden{
    display:none;
}

.activation-box{
    width:min(500px,100%);
    background:#101010;
    border:1px solid #292929;
    border-radius:14px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.activation-title{
    color:#00e5ff;
    font-size:25px;
    font-weight:bold;
    margin-bottom:8px;
}

.activation-subtitle{
    color:#999;
    font-size:13px;
    margin-bottom:20px;
}

.qr{
    width:220px;
    height:220px;
    background:#fff;
    padding:10px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.qr img,
.qr canvas{
    max-width:100%;
    max-height:100%;
}

.device-label{
    color:#777;
    font-size:11px;
    margin-bottom:6px;
}

.device-code{
    color:#fff;
    font-size:20px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:15px;
}

.activation-state{
    padding:12px;
    border-radius:8px;
    background:#181818;
    color:#ffb300;
    font-size:13px;
}

.activation-state.active{
    color:#00e676;
}

.activation-state.error{
    color:#ff5252;
}

.activation-url{
    margin-top:15px;
    font-size:10px;
    color:#555;
    word-break:break-all;
}

/* EMPTY */

.empty{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#555;
    text-align:center;
    padding:30px;
}

.empty i{
    font-size:50px;
    margin-bottom:15px;
}

.empty h2{
    color:#888;
    margin-bottom:8px;
}

.empty p{
    font-size:13px;
}

/* LOADING */

.loading{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:#151515;
    padding:25px;
    border-radius:10px;
    text-align:center;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid #333;
    border-top-color:#00e5ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:70px;
        min-width:70px;
    }

    .menu button{
        text-align:center;
        font-size:0;
    }

    .menu button i{
        font-size:18px;
    }

    .playlist-info{
        display:none;
    }

    .logo{
        font-size:17px;
    }

    .grid{
        grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    }

    .toolbar{
        flex-wrap:wrap;
    }

    .toolbar input{
        width:100%;
        height:42px;
        flex:none;
    }

    .toolbar .btn{
        height:40px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">
            GC <span>PLAY</span> PRO
        </div>

        <div id="status" class="status">
            <span class="status-dot"></span>
            <span id="statusText">AGUARDANDO</span>
        </div>
    </header>

    <div class="body">

        <aside class="sidebar">

            <div class="menu">

                <button id="menuTodos" class="active">
                    <i class="fa-solid fa-tv"></i>
                    <span>Todos</span>
                </button>

                <button id="menuAoVivo">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <span>TV ao vivo</span>
                </button>

                <button id="menuFilmes">
                    <i class="fa-solid fa-film"></i>
                    <span>Filmes</span>
                </button>

                <button id="menuSeries">
                    <i class="fa-solid fa-clapperboard"></i>
                    <span>Séries</span>
                </button>

                <button id="menuMusica">
                    <i class="fa-solid fa-music"></i>
                    <span>Música</span>
                </button>

            </div>

            <div class="playlist-info">
                <div>GC PLAY PRO</div>
                <div id="playlistInfo">Nenhuma lista carregada</div>
            </div>

        </aside>

        <main class="content">

            <div class="toolbar">

                <input
                    id="playlistUrl"
                    type="url"
                    placeholder="Cole aqui sua URL M3U..."
                    autocomplete="off"
                >

                <button id="loadBtn" class="btn">
                    <i class="fa-solid fa-download"></i>
                    Carregar
                </button>

                <button id="clearBtn" class="btn secondary">
                    <i class="fa-solid fa-trash"></i>
                </button>

            </div>

            <div id="channels" class="channels">

                <div class="empty">
                    <i class="fa-solid fa-tv"></i>
                    <h2>GC PLAY PRO</h2>
                    <p>Carregue uma lista M3U para começar.</p>
                </div>

            </div>

        </main>

    </div>

</div>


<!-- PLAYER -->

<div id="player" class="player">

    <video
        id="video"
        class="player-video"
        controls
        playsinline
        autoplay
    ></video>

    <div class="player-bar">

        <div id="playerTitle" class="player-title">
            Reproduzindo
        </div>

        <button id="fullscreenBtn" class="player-close">
            <i class="fa-solid fa-expand"></i>
        </button>

        <button id="closePlayer" class="player-close">
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>

</div>


<!-- ACTIVATION -->

<div id="activation" class="activation">

    <div class="activation-box">

        <div class="activation-title">
            GC PLAY PRO
        </div>

        <div class="activation-subtitle">
            Ative este dispositivo através do QR Code
        </div>

        <div id="qrcode" class="qr"></div>

        <div class="device-label">
            CÓDIGO DE ATIVAÇÃO
        </div>

        <div id="deviceCode" class="device-code">
            ------
        </div>

        <div id="activationState" class="activation-state">
            AGUARDANDO ATIVAÇÃO
        </div>

        <div id="activationUrl" class="activation-url"></div>

    </div>

</div>


<!-- LOADING -->

<div id="loading" class="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            Carregando...
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const SUPABASE_URL =
    "https://kuzgdvpdqmocklsgyzvt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2qV7Uw-99dQlVcXluSuikw_YZGClN13";

/*
 * IMPORTANTE:
 * Este é o endereço REAL do seu connect.html.
 */
const ACTIVATION_BASE_URL =
    "https://caiomendes29546874687.github.io/GC-PLAY-PRO-/connect.html";


/*
 * Edge Function.
 */
const EDGE_FUNCTION_URL =
    SUPABASE_URL + "/functions/v1/activate-device";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   APLICAÇÃO
========================================================= */

const app = {

    inicializado:false,

    deviceId:null,

    activationCode:null,

    activationPoll:null,

    realtimeChannel:null,

    hls:null,

    lista:[],

    listaOriginal:[],

    categoria:"todos",

    busca:"",


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    async init(){

        if(this.inicializado) return;

        this.inicializado = true;

        this.inicializarDispositivo();

        this.configurarEventos();

        this.gerarQRCode();

        this.atualizarStatusAtivacao(
            "AGUARDANDO ATIVAÇÃO",
            "waiting"
        );

        await this.registrarDispositivo();

        await this.verificarStatusDispositivo();

        this.iniciarRealtime();

        this.restaurarListaLocal();

    },


    /* =====================================================
       DISPOSITIVO
    ===================================================== */

    inicializarDispositivo(){

        let deviceId =
            localStorage.getItem("gcplay_device_id");

        if(!deviceId){

            if(
                window.crypto &&
                typeof crypto.randomUUID === "function"
            ){

                deviceId = crypto.randomUUID();

            }else{

                deviceId =
                    "gc-" +
                    Date.now().toString(36) +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2,10);

            }

            localStorage.setItem(
                "gcplay_device_id",
                deviceId
            );
        }

        this.deviceId = deviceId;


        let code =
            localStorage.getItem(
                "gcplay_activation_code"
            );

        if(!code){

            code = this.gerarCodigoAtivacao();

            localStorage.setItem(
                "gcplay_activation_code",
                code
            );

        }

        this.activationCode = code;


        document.getElementById(
            "deviceCode"
        ).textContent = code;

    },


    gerarCodigoAtivacao(){

        const chars =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        let result = "";

        for(let i=0;i<6;i++){

            result += chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];

        }

        return result;

    },


    /* =====================================================
       QR CODE
    ===================================================== */

    gerarQRCode(){

        const container =
            document.getElementById("qrcode");

        container.innerHTML = "";


        const qrUrl =
            ACTIVATION_BASE_URL +
            "?device=" +
            encodeURIComponent(
                this.deviceId || ""
            ) +
            "&code=" +
            encodeURIComponent(
                this.activationCode || ""
            );


        new QRCode(container,{

            text:qrUrl,

            width:200,

            height:200,

            colorDark:"#000000",

            colorLight:"#ffffff",

            correctLevel:
                QRCode.CorrectLevel.M

        });


        document.getElementById(
            "activationUrl"
        ).textContent = qrUrl;

    },


    /* =====================================================
       REGISTRAR DISPOSITIVO
    ===================================================== */

    async registrarDispositivo(){

        try{

            const response =
                await fetch(
                    EDGE_FUNCTION_URL,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY
                        },

                        body:JSON.stringify({

                            action:"register",

                            device_id:
                                this.deviceId,

                            activation_code:
                                this.activationCode

                        })
                    }
                );


            const data =
                await response.json();


            if(!response.ok){

                console.error(
                    "Erro ao registrar dispositivo:",
                    data
                );

                return false;

            }


            return true;


        }catch(error){

            console.error(
                "Falha no registro:",
                error
            );

            return false;

        }

    },


    /* =====================================================
       STATUS
    ===================================================== */

    async verificarStatusDispositivo(){

        try{

            const {data,error} =
                await supabaseClient
                    .from("devices")
                    .select(
                        "device_id,activation_code,status,playlist_url,expires_at"
                    )
                    .eq(
                        "device_id",
                        this.deviceId
                    )
                    .maybeSingle();


            if(error){

                console.error(
                    "Erro status:",
                    error
                );

                return;

            }


            if(!data){

                return;

            }


            this.processarAtualizacaoDispositivo(
                data
            );


        }catch(error){

            console.error(error);

        }

    },


    /* =====================================================
       REALTIME
    ===================================================== */

    iniciarRealtime(){

        if(this.realtimeChannel){

            supabaseClient
                .removeChannel(
                    this.realtimeChannel
                );

        }


        this.realtimeChannel =
            supabaseClient
                .channel(
                    "gcplay-device-" +
                    this.deviceId
                )
                .on(
                    "postgres_changes",
                    {
                        event:"*",

                        schema:"public",

                        table:"devices",

                        filter:
                            "device_id=eq." +
                            this.deviceId
                    },
                    payload => {

                        console.log(
                            "Atualização:",
                            payload
                        );

                        if(payload.new){

                            this.processarAtualizacaoDispositivo(
                                payload.new
                            );

                        }

                    }
                )
                .subscribe();


        /*
         * Backup caso o realtime não esteja disponível.
         */
        clearInterval(
            this.activationPoll
        );


        this.activationPoll =
            setInterval(
                () => {

                    this.verificarStatusDispositivo();

                },
                15000
            );

    },


    /* =====================================================
       PROCESSAR ATIVAÇÃO
    ===================================================== */

    processarAtualizacaoDispositivo(data){

        if(!data) return;


        if(
            data.activation_code &&
            data.activation_code !==
                this.activationCode
        ){

            this.activationCode =
                data.activation_code;

            localStorage.setItem(
                "gcplay_activation_code",
                this.activationCode
            );

            document.getElementById(
                "deviceCode"
            ).textContent =
                this.activationCode;

            this.gerarQRCode();

        }


        if(data.status === "active"){

            this.atualizarStatusAtivacao(
                "DISPOSITIVO ATIVADO",
                "active"
            );


            document
                .getElementById("activation")
                .classList.add("hidden");


            if(data.playlist_url){

                document.getElementById(
                    "playlistUrl"
                ).value =
                    data.playlist_url;

                this.carregarListaM3U(
                    data.playlist_url
                );

            }


        }else if(data.status === "blocked"){

            this.atualizarStatusAtivacao(
                "DISPOSITIVO BLOQUEADO",
                "blocked"
            );


            document
                .getElementById("activation")
                .classList.remove("hidden");


        }else{

            this.atualizarStatusAtivacao(
                "AGUARDANDO ATIVAÇÃO",
                "waiting"
            );


            document
                .getElementById("activation")
                .classList.remove("hidden");

        }

    },


    /* =====================================================
       STATUS VISUAL
    ===================================================== */

    atualizarStatusAtivacao(texto,tipo){

        const status =
            document.getElementById("status");

        const statusText =
            document.getElementById(
                "statusText"
            );

        const state =
            document.getElementById(
                "activationState"
            );


        status.className =
            "status " +
            (tipo || "");


        statusText.textContent =
            texto;


        state.textContent =
            texto;


        state.className =
            "activation-state " +
            (tipo === "active"
                ? "active"
                : tipo === "blocked"
                    ? "error"
                    : "");

    },


    /* =====================================================
       EVENTOS
    ===================================================== */

    configurarEventos(){

        document
            .getElementById("loadBtn")
            .addEventListener(
                "click",
                () => {

                    const url =
                        document.getElementById(
                            "playlistUrl"
                        ).value.trim();

                    if(url){

                        this.carregarListaM3U(
                            url
                        );

                    }

                }
            );


        document
            .getElementById("playlistUrl")
            .addEventListener(
                "keydown",
                e => {

                    if(e.key === "Enter"){

                        const url =
                            e.target.value.trim();

                        if(url){

                            this.carregarListaM3U(
                                url
                            );

                        }

                    }

                }
            );


        document
            .getElementById("clearBtn")
            .addEventListener(
                "click",
                () => {

                    localStorage.removeItem(
                        "gcplay_playlist_url"
                    );

                    document.getElementById(
                        "playlistUrl"
                    ).value = "";

                    this.lista = [];

                    this.listaOriginal = [];

                    this.renderizar();

                }
            );


        document
            .getElementById("closePlayer")
            .addEventListener(
                "click",
                () => this.fecharPlayer()
            );


        document
            .getElementById("fullscreenBtn")
            .addEventListener(
                "click",
                () => {

                    const video =
                        document.getElementById(
                            "video"
                        );

                    if(video.requestFullscreen){

                        video.requestFullscreen();

                    }

                }
            );


        const busca =
            document.getElementById(
                "search"
            );

        if(busca){

            busca.addEventListener(
                "input",
                e => {

                    this.busca =
                        e.target.value
                            .toLowerCase();

                    this.renderizar();

                }
            );

        }


        document
            .getElementById("menuTodos")
            .addEventListener(
                "click",
                () => this.mudarCategoria("todos")
            );


        document
            .getElementById("menuAoVivo")
            .addEventListener(
                "click",
                () => this.mudarCategoria("live")
            );


        document
            .getElementById("menuFilmes")
            .addEventListener(
                "click",
                () => this.mudarCategoria("movie")
            );


        document
            .getElementById("menuSeries")
            .addEventListener(
                "click",
                () => this.mudarCategoria("series")
            );


        document
            .getElementById("menuMusica")
            .addEventListener(
                "click",
                () => this.mudarCategoria("music")
            );

    },


    /* =====================================================
       CATEGORIA
    ===================================================== */

    mudarCategoria(categoria){

        this.categoria =
            categoria;


        document
            .querySelectorAll(".menu button")
            .forEach(btn =>
                btn.classList.remove("active")
            );


        const map = {

            todos:"menuTodos",

            live:"menuAoVivo",

            movie:"menuFilmes",

            series:"menuSeries",

            music:"menuMusica"

        };


        const button =
            document.getElementById(
                map[categoria]
            );


        if(button){

            button.classList.add(
                "active"
            );

        }


        this.renderizar();

    },


    /* =====================================================
       CARREGAR M3U
    ===================================================== */

    async carregarListaM3U(url){

        if(!url) return;


        this.mostrarLoading(
            "Baixando lista M3U..."
        );


        try{

            let texto = null;


            /*
             * Primeiro tenta diretamente.
             */
            try{

                const response =
                    await fetch(
                        url,
                        {
                            method:"GET",
                            cache:"no-store"
                        }
                    );


                if(response.ok){

                    texto =
                        await response.text();

                }

            }catch(e){

                console.log(
                    "Fetch direto falhou."
                );

            }


            /*
             * Depois tenta proxies.
             */
            if(!texto){

                const proxies = [

                    "https://corsproxy.io/?url=",

                    "https://api.allorigins.win/raw?url="

                ];


                for(
                    const proxy of proxies
                ){

                    try{

                        const response =
                            await fetch(
                                proxy +
                                encodeURIComponent(url)
                            );


                        if(response.ok){

                            texto =
                                await response.text();

                            if(texto){

                                break;

                            }

                        }

                    }catch(e){

                        console.log(
                            "Proxy falhou:",
                            proxy
                        );

                    }

                }

            }


            if(!texto){

                throw new Error(
                    "Não foi possível baixar a lista M3U."
                );

            }


            const lista =
                this.parseM3U(
                    texto,
                    url
                );


            if(!lista.length){

                throw new Error(
                    "Nenhum canal encontrado."
                );

            }


            this.lista =
                lista;

            this.listaOriginal =
                lista.slice();


            localStorage.setItem(
                "gcplay_playlist_url",
                url
            );


            document.getElementById(
                "playlistUrl"
            ).value = url;


            document.getElementById(
                "playlistInfo"
            ).textContent =
                lista.length +
                " canais";


            this.renderizar();


        }catch(error){

            console.error(error);


            this.mostrarErro(
                error.message ||
                "Erro ao carregar lista."
            );

        }finally{

            this.esconderLoading();

        }

    },


    /* =====================================================
       PARSER M3U
    ===================================================== */

    parseM3U(texto,baseUrl){

        texto =
            texto
                .replace(/^\uFEFF/,"")
                .replace(/\r\n/g,"\n")
                .replace(/\r/g,"\n");


        const linhas =
            texto.split("\n");


        const resultado = [];

        let atual = null;


        for(
            let i=0;
            i<linhas.length;
            i++
        ){

            const linha =
                linhas[i].trim();


            if(!linha) continue;


            if(
                linha.startsWith(
                    "#EXTINF:"
                )
            ){

                const info =
                    linha;


                const nomeMatch =
                    info.match(
                        /,(.*)$/
                    );


                const nome =
                    nomeMatch
                        ? nomeMatch[1].trim()
                        : "Sem nome";


                const attrs = {};


                const regex =
                    /([a-zA-Z0-9_-]+)="([^"]*)"/g;


                let match;


                while(
                    (match =
                        regex.exec(info))
                ){

                    attrs[
                        match[1].toLowerCase()
                    ] =
                        match[2];

                }


                const group =
                    attrs["group-title"] ||
                    "";


                const logo =
                    attrs["tvg-logo"] ||
                    "";


                const tvgId =
                    attrs["tvg-id"] ||
                    "";


                atual = {

                    name:nome,

                    group:group,

                    logo:logo,

                    tvgId:tvgId,

                    url:"",

                    category:
                        this.classificar(
                            nome,
                            group
                        )

                };


                continue;

            }


            if(
                !linha.startsWith("#") &&
                atual
            ){

                let streamUrl =
                    linha;


                try{

                    streamUrl =
                        new URL(
                            streamUrl,
                            baseUrl
                        ).href;

                }catch(e){}


                atual.url =
                    streamUrl;


                resultado.push(
                    atual
                );


                atual = null;

            }

        }


        return resultado;

    },


    /* =====================================================
       CLASSIFICAÇÃO
    ===================================================== */

    classificar(nome,grupo){

        const texto =
            (
                nome +
                " " +
                grupo
            ).toLowerCase();


        if(
            /s\d{1,2}e\d{1,2}/i
                .test(texto) ||
            /t\d{1,2}e\d{1,2}/i
                .test(texto) ||
            /\d{1,2}x\d{1,2}/i
                .test(texto) ||
            /temporada/i.test(texto) ||
            /epis[oó]dio/i.test(texto) ||
            /series?/i.test(texto)
        ){

            return "series";

        }


        if(
            /filme|movie|cinema|vod/i
                .test(texto)
        ){

            return "movie";

        }


        if(
            /music|m[uú]sica|radio|rádio/i
                .test(texto)
        ){

            return "music";

        }


        return "live";

    },


    /* =====================================================
       RENDER
    ===================================================== */

    renderizar(){

        const container =
            document.getElementById(
                "channels"
            );


        let lista =
            this.listaOriginal
                .slice();


        if(
            this.categoria !==
            "todos"
        ){

            lista =
                lista.filter(
                    item =>
                        item.category ===
                        this.categoria
                );

        }


        if(this.busca){

            lista =
                lista.filter(
                    item => {

                        const texto =
                            (
                                item.name +
                                " " +
                                item.group
                            ).toLowerCase();

                        return texto.includes(
                            this.busca
                        );

                    }
                );

        }


        if(!lista.length){

            container.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-tv"></i>

                    <h2>Nenhum canal</h2>

                    <p>
                        Não existem itens
                        para esta categoria.
                    </p>

                </div>

            `;

            return;

        }


        const grid =
            document.createElement(
                "div"
            );


        grid.className = "grid";


        lista.forEach(
            item => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "channel";


                card.tabIndex = 0;


                let logoHtml;


                if(item.logo){

                    logoHtml = `

                        <img
                            class="channel-logo"
                            src="${this.escapeAttr(item.logo)}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >

                    `;

                }else{

                    logoHtml = `

                        <div class="channel-no-logo">
                            <i class="fa-solid fa-tv"></i>
                        </div>

                    `;

                }


                card.innerHTML = `

                    ${logoHtml}

                    <div class="channel-info">

                        <div class="channel-name">
                            ${this.escapeHtml(item.name)}
                        </div>

                        <div class="channel-group">
                            ${this.escapeHtml(item.group || item.category)}
                        </div>

                    </div>

                `;


                card.addEventListener(
                    "click",
                    () => this.reproduzir(item)
                );


                card.addEventListener(
                    "keydown",
                    e => {

                        if(
                            e.key === "Enter" ||
                            e.key === " "
                        ){

                            e.preventDefault();

                            this.reproduzir(
                                item
                            );

                        }

                    }
                );


                grid.appendChild(card);

            }
        );


        container.innerHTML = "";

        container.appendChild(
            grid
        );

    },


    /* =====================================================
       REPRODUÇÃO
    ===================================================== */

    reproduzir(item){

        if(!item || !item.url){

            this.mostrarErro(
                "URL do canal inválida."
            );

            return;

        }


        const video =
            document.getElementById(
                "video"
            );


        document.getElementById(
            "playerTitle"
        ).textContent =
            item.name;


        this.pararPlayer();


        document
            .getElementById("player")
            .classList.add("show");


        const url =
            item.url;


        /*
         * HLS.js
         */
        if(
            window.Hls &&
            Hls.isSupported() &&
            (
                /\.m3u8($|\?)/i.test(url) ||
                !video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            )
        ){

            this.hls =
                new Hls({
                    enableWorker:true,
                    lowLatencyMode:false
                });


            this.hls.loadSource(
                url
            );


            this.hls.attachMedia(
                video
            );


            this.hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {

                    video.play()
                        .catch(
                            () => {}
                        );

                }
            );


            this.hls.on(
                Hls.Events.ERROR,
                (event,data) => {

                    if(
                        data.fatal
                    ){

                        console.error(
                            "HLS error:",
                            data
                        );

                    }

                }
            );


        }else{

            video.src = url;

            video.play()
                .catch(
                    () => {}
                );

        }

    },


    pararPlayer(){

        const video =
            document.getElementById(
                "video"
            );


        if(this.hls){

            try{

                this.hls.destroy();

            }catch(e){}

            this.hls = null;

        }


        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

    },


    fecharPlayer(){

        this.pararPlayer();

        document
            .getElementById("player")
            .classList.remove("show");

    },


    /* =====================================================
       LISTA LOCAL
    ===================================================== */

    restaurarListaLocal(){

        const url =
            localStorage.getItem(
                "gcplay_playlist_url"
            );


        if(url){

            document.getElementById(
                "playlistUrl"
            ).value = url;

            /*
             * Só carrega automaticamente
             * depois que o dispositivo estiver
             * ativado.
             */

            supabaseClient
                .from("devices")
                .select(
                    "status,playlist_url"
                )
                .eq(
                    "device_id",
                    this.deviceId
                )
                .maybeSingle()
                .then(
                    ({data}) => {

                        if(
                            data &&
                            data.status ===
                            "active"
                        ){

                            this.carregarListaM3U(
                                data.playlist_url ||
                                url
                            );

                        }

                    }
                );

        }

    },


    /* =====================================================
       UTILIDADES
    ===================================================== */

    mostrarLoading(texto){

        document.getElementById(
            "loadingText"
        ).textContent =
            texto || "Carregando...";


        document
            .getElementById("loading")
            .classList.add("show");

    },


    esconderLoading(){

        document
            .getElementById("loading")
            .classList.remove("show");

    },


    mostrarErro(texto){

        alert(
            texto ||
            "Ocorreu um erro."
        );

    },


    escapeHtml(value){

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    },


    escapeAttr(value){

        return this.escapeHtml(
            value
        );

    }

};


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    () => {

        app.init();

    }
);

</script>
