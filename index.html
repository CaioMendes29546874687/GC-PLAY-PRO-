<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color" content="#050505">

<title>GC PLAY PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    min-height: 100%;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =====================================================
   HEADER
===================================================== */

header {

    height: 90px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: #070707;

    border-bottom: 2px solid #39ff14;

    box-shadow:
        0 0 20px
        rgba(57,255,20,.25);

    position: sticky;
    top: 0;

    z-index: 1000;
}

.logo {

    color: #39ff14;

    font-size: 34px;

    font-weight: 900;

    text-shadow:
        0 0 8px #39ff14,
        0 0 20px rgba(57,255,20,.5);

}

.header-buttons {

    display: flex;
    gap: 10px;

}

button {

    min-height: 50px;

    padding: 0 20px;

    border: 1px solid #39ff14;

    border-radius: 10px;

    background: #080808;

    color: #39ff14;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}

button:hover,
button:focus {

    background: #39ff14;
    color: #000;

    outline: none;

}

/* =====================================================
   HOME
===================================================== */

#home {

    min-height:
        calc(100vh - 90px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

}

.home-box {

    width: 100%;
    max-width: 700px;

    text-align: center;

}

.home-box h1 {

    color: #39ff14;

    font-size: 58px;

    font-weight: 900;

    margin-bottom: 15px;

    text-shadow:
        0 0 10px #39ff14,
        0 0 30px rgba(57,255,20,.5);

}

.home-box p {

    color: #aaa;

    font-size: 22px;

    margin-bottom: 40px;

}

.home-buttons {

    display: grid;

    gap: 18px;

}

.big-button {

    width: 100%;

    min-height: 70px;

    font-size: 19px;

}

/* =====================================================
   APP
===================================================== */

#app {

    display: none;

    padding: 20px;

    max-width: 1600px;

    margin: auto;

}

/* =====================================================
   MENU
===================================================== */

.menu {

    display: flex;

    gap: 10px;

    overflow-x: auto;

    padding-bottom: 15px;

}

.menu button {

    flex-shrink: 0;

    white-space: nowrap;

}

/* =====================================================
   STATUS
===================================================== */

#status {

    margin-bottom: 20px;

    padding: 15px;

    border-radius: 10px;

    border: 1px solid #252525;

    background: #090909;

    color: #aaa;

}

#status.ok {

    color: #39ff14;

    border-color: #39ff14;

}

#status.error {

    color: #ff5555;

    border-color: #ff3333;

}

/* =====================================================
   LISTA
===================================================== */

#lista {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );

    gap: 15px;

}

.canal {

    background: #0b0b0b;

    border: 1px solid #222;

    border-radius: 12px;

    overflow: hidden;

    cursor: pointer;

    transition: .2s;

}

.canal:hover,
.canal:focus {

    border-color: #39ff14;

    transform: translateY(-2px);

    box-shadow:
        0 0 15px
        rgba(57,255,20,.15);

}

.canal img {

    width: 100%;

    height: 120px;

    object-fit: contain;

    background: #050505;

}

.canal-info {

    padding: 12px;

}

.canal-nome {

    font-weight: bold;

    font-size: 15px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.canal-grupo {

    margin-top: 6px;

    color: #777;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.empty {

    grid-column: 1 / -1;

    text-align: center;

    color: #777;

    padding: 50px 20px;

}

/* =====================================================
   MODAL
===================================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.88);

    z-index: 5000;

    align-items: center;

    justify-content: center;

    padding: 15px;

}

.modal-box {

    width: 100%;

    max-width: 650px;

    background: #090909;

    border: 1px solid #39ff14;

    border-radius: 15px;

    padding: 25px;

    box-shadow:
        0 0 35px
        rgba(57,255,20,.25);

}

.modal-box h2 {

    color: #39ff14;

    font-size: 28px;

    margin-bottom: 10px;

}

.modal-box p {

    color: #aaa;

    line-height: 1.5;

    margin-bottom: 20px;

}

input {

    width: 100%;

    height: 55px;

    padding: 0 15px;

    margin-bottom: 15px;

    background: #050505;

    color: white;

    border: 1px solid #39ff14;

    border-radius: 9px;

    font-size: 15px;

}

input:focus {

    outline: none;

    box-shadow:
        0 0 12px
        rgba(57,255,20,.25);

}

.modal-buttons {

    display: flex;

    gap: 10px;

}

.modal-buttons button {

    flex: 1;

}

/* =====================================================
   PLAYER
===================================================== */

#playerModal .modal-box {

    max-width: 1100px;

}

#playerTitle {

    color: #39ff14;

    font-weight: bold;

    margin-bottom: 12px;

}

#videoPlayer {

    width: 100%;

    max-height: 70vh;

    background: black;

    border-radius: 8px;

}

.close-player {

    width: 100%;

    margin-top: 12px;

}

/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px) {

    header {

        height: 75px;

        padding: 0 12px;

    }

    .logo {

        font-size: 22px;

    }

    header button {

        min-height: 42px;

        padding: 0 10px;

        font-size: 12px;

    }

    #home {

        min-height:
            calc(100vh - 75px);

    }

    .home-box h1 {

        font-size: 40px;

    }

    .home-box p {

        font-size: 18px;

    }

    .big-button {

        min-height: 65px;

        font-size: 16px;

    }

    #app {

        padding: 12px;

    }

    #lista {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 9px;

    }

    .canal img {

        height: 85px;

    }

    .canal-info {

        padding: 9px;

    }

    .canal-nome {

        font-size: 13px;

    }

    .modal-buttons {

        flex-direction: column;

    }

}

</style>

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        GC PLAY PRO
    </div>

    <div class="header-buttons">

        <button onclick="abrirManual()">
            + M3U
        </button>

        <button onclick="mostrarInicio()">
            INÍCIO
        </button>

    </div>

</header>


<!-- =====================================================
     HOME
===================================================== -->

<section id="home">

    <div class="home-box">

        <h1>
            GC PLAY PRO
        </h1>

        <p>
            Seu aplicativo de entretenimento
        </p>

        <div class="home-buttons">

            <button
                class="big-button"
                onclick="abrirManual()">

                📋 ADICIONAR M3U MANUALMENTE

            </button>

            <button
                class="big-button"
                onclick="abrirXtream()">

                🔐 ENTRAR COM XTREAM CODES

            </button>

            <button
                class="big-button"
                onclick="carregarExemplo()">

                ▶ CARREGAR LISTA DE TESTE

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<section id="app">

    <div class="menu">

        <button onclick="filtrar('todos')">
            🏠 TODOS
        </button>

        <button onclick="filtrar('live')">
            📺 TV AO VIVO
        </button>

        <button onclick="filtrar('vod')">
            🎬 FILMES
        </button>

        <button onclick="filtrar('series')">
            📺 SÉRIES
        </button>

        <button onclick="filtrar('music')">
            🎵 MÚSICA
        </button>

        <button onclick="abrirManual()">
            ➕ NOVA M3U
        </button>

    </div>

    <div id="status">
        Nenhuma lista carregada.
    </div>

    <div id="lista"></div>

</section>


<!-- =====================================================
     MODAL M3U
===================================================== -->

<div
    id="manualModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Adicionar lista M3U
        </h2>

        <p>
            Cole o endereço completo da sua lista M3U.
        </p>

        <input
            id="m3uInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="http://servidor.com/get.php?...">

        <div class="modal-buttons">

            <button onclick="fecharManual()">
                CANCELAR
            </button>

            <button onclick="carregarM3U()">
                CARREGAR
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL XTREAM
===================================================== -->

<div
    id="xtreamModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Entrar com Xtream Codes
        </h2>

        <p>
            Informe o servidor, usuário e senha.
        </p>

        <input
            id="xtreamServer"
            type="text"
            placeholder="http://servidor:porta">

        <input
            id="xtreamUser"
            type="text"
            placeholder="Usuário">

        <input
            id="xtreamPass"
            type="password"
            placeholder="Senha">

        <div class="modal-buttons">

            <button onclick="fecharXtream()">
                CANCELAR
            </button>

            <button onclick="carregarXtream()">
                ENTRAR
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     PLAYER
===================================================== -->

<div
    id="playerModal"
    class="modal">

    <div class="modal-box">

        <div id="playerTitle">
            Reprodutor
        </div>

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata">
        </video>

        <button
            class="close-player"
            onclick="fecharPlayer()">

            FECHAR PLAYER

        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

/*
   URL DA NOVA EDGE FUNCTION.

   Vamos criar essa função no Supabase
   na próxima etapa deste código.
*/

const PROXY_URL =
"https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/gcplay-proxy";


/* =====================================================
   VARIÁVEIS
===================================================== */

let canais = [];

let canaisFiltrados = [];

let categoriaAtual = "todos";

let hls = null;


/* =====================================================
   MODAL M3U
===================================================== */

function abrirManual() {

    const modal =
        document.getElementById(
            "manualModal"
        );

    modal.style.display =
        "flex";

    setTimeout(() => {

        document
            .getElementById(
                "m3uInput"
            )
            .focus();

    }, 100);

}


function fecharManual() {

    document
        .getElementById(
            "manualModal"
        )
        .style.display =
        "none";

}


/* =====================================================
   MODAL XTREAM
===================================================== */

function abrirXtream() {

    document
        .getElementById(
            "xtreamModal"
        )
        .style.display =
        "flex";

}


function fecharXtream() {

    document
        .getElementById(
            "xtreamModal"
        )
        .style.display =
        "none";

}


/* =====================================================
   XTREAM → M3U
===================================================== */

function carregarXtream() {

    const servidor =
        document
            .getElementById(
                "xtreamServer"
            )
            .value
            .trim();

    const usuario =
        document
            .getElementById(
                "xtreamUser"
            )
            .value
            .trim();

    const senha =
        document
            .getElementById(
                "xtreamPass"
            )
            .value
            .trim();


    if (
        !servidor ||
        !usuario ||
        !senha
    ) {

        alert(
            "Preencha servidor, usuário e senha."
        );

        return;

    }


    let base =
        servidor.replace(
            /\/+$/,
            ""
        );


    const url =
        base +
        "/get.php?username=" +
        encodeURIComponent(usuario) +
        "&password=" +
        encodeURIComponent(senha) +
        "&type=m3u_plus&output=hls";


    fecharXtream();


    carregarURLM3U(
        url
    );

}


/* =====================================================
   M3U MANUAL
===================================================== */

function carregarM3U() {

    const campo =
        document.getElementById(
            "m3uInput"
        );


    const url =
        campo.value.trim();


    if (!url) {

        alert(
            "Cole a URL completa da M3U."
        );

        campo.focus();

        return;

    }


    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        alert(
            "A URL precisa começar com http:// ou https://"
        );

        return;

    }


    fecharManual();


    carregarURLM3U(
        url
    );

}


/* =====================================================
   CARREGAR ATRAVÉS DO PROXY
===================================================== */

async function carregarURLM3U(url) {

    mostrarApp();


    mostrarStatus(
        "⏳ Conectando ao servidor M3U...",
        "normal"
    );


    try {

        console.log(
            "M3U original:",
            url
        );


        /*
           IMPORTANTE:

           A URL original fica dentro do parâmetro
           e é codificada para não quebrar
           caracteres como &, ?, = etc.
        */

        const endpoint =
            PROXY_URL +
            "?mode=playlist&url=" +
            encodeURIComponent(url);


        console.log(
            "Proxy:",
            endpoint
        );


        mostrarStatus(
            "⏳ Baixando sua lista M3U...",
            "normal"
        );


        const resposta =
            await fetch(
                endpoint,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        console.log(
            "Resposta:",
            resposta.status
        );


        if (!resposta.ok) {

            let mensagem =
                "HTTP " +
                resposta.status;


            try {

                const erro =
                    await resposta.text();

                if (erro) {

                    mensagem +=
                        "\n" +
                        erro;

                }

            } catch(e) {}


            throw new Error(
                mensagem
            );

        }


        const texto =
            await resposta.text();


        console.log(
            "Tamanho da M3U:",
            texto.length
        );


        if (
            !texto ||
            !texto.trim()
        ) {

            throw new Error(
                "O servidor retornou uma lista vazia."
            );

        }


        /*
           Algumas listas começam diretamente
           com #EXTINF.
        */

        if (
            !texto.includes(
                "#EXTINF"
            )
        ) {

            throw new Error(
                "O conteúdo recebido não contém canais M3U."
            );

        }


        /*
           Salvar URL
        */

        localStorage.setItem(
            "gc_m3u_url",
            url
        );


        mostrarStatus(
            "⏳ Processando conteúdos...",
            "normal"
        );


        processarM3U(
            texto
        );


    } catch(erro) {

        console.error(
            "ERRO:",
            erro
        );


        mostrarStatus(
            "❌ Erro ao carregar a lista.",
            "error"
        );


        alert(
            "NÃO FOI POSSÍVEL CARREGAR A M3U\n\n" +
            erro.message +
            "\n\n" +
            "Abra o console do navegador se precisar verificar o erro."
        );

    }

}


/* =====================================================
   PROCESSAR M3U
===================================================== */

function processarM3U(texto) {

    canais = [];


    const linhas =
        texto.split(
            /\r?\n/
        );


    let atual = null;


    for (
        let i = 0;
        i < linhas.length;
        i++
    ) {

        const linha =
            linhas[i].trim();


        if (!linha) {
            continue;
        }


        if (
            linha
                .toUpperCase()
                .startsWith(
                    "#EXTINF"
                )
        ) {

            const virgula =
                linha.indexOf(",");


            let nome =
                virgula >= 0
                ? linha
                    .substring(
                        virgula + 1
                    )
                    .trim()
                : "Sem nome";


            nome =
                nome
                    .replace(
                        /^[-\s]+/,
                        ""
                    )
                    .trim();


            const grupo =
                extrairAtributo(
                    linha,
                    "group-title"
                ) ||
                extrairAtributo(
                    linha,
                    "group"
                ) ||
                "Outros";


            const logo =
                extrairAtributo(
                    linha,
                    "tvg-logo"
                ) || "";


            atual = {

                nome:
                    nome,

                grupo:
                    grupo,

                logo:
                    logo,

                url:
                    "",

                categoria:
                    detectarCategoria(
                        grupo,
                        nome
                    )

            };


            continue;

        }


        if (
            linha.startsWith("#")
        ) {

            continue;

        }


        if (atual) {

            if (
                linha.startsWith(
                    "http://"
                ) ||
                linha.startsWith(
                    "https://"
                )
            ) {

                atual.url =
                    linha;


                canais.push(
                    atual
                );

            }


            atual = null;

        }

    }


    console.log(
        "TOTAL:",
        canais.length
    );


    if (
        canais.length === 0
    ) {

        mostrarStatus(
            "❌ Nenhum conteúdo encontrado.",
            "error"
        );


        document
            .getElementById(
                "lista"
            )
            .innerHTML = `
                <div class="empty">
                    Nenhum canal foi encontrado.
                </div>
            `;


        return;

    }


    canaisFiltrados =
        canais;

    categoriaAtual =
        "todos";


    renderizarLista(
        canais
    );


    mostrarStatus(
        "✅ " +
        canais.length +
        " conteúdos carregados.",
        "ok"
    );

}


/* =====================================================
   ATRIBUTO M3U
===================================================== */

function extrairAtributo(
    linha,
    atributo
) {

    let regex =
        new RegExp(
            atributo +
            '\\s*=\\s*"([^"]*)"',
            "i"
        );


    let resultado =
        linha.match(
            regex
        );


    if (resultado) {

        return resultado[1];

    }


    regex =
        new RegExp(
            atributo +
            "\\s*=\\s*'([^']*)'",
            "i"
        );


    resultado =
        linha.match(
            regex
        );


    if (resultado) {

        return resultado[1];

    }


    return "";

}


/* =====================================================
   CATEGORIA
===================================================== */

function detectarCategoria(
    grupo,
    nome
) {

    const texto =
        (
            grupo +
            " " +
            nome
        )
        .toLowerCase();


    if (
        texto.includes("adult") ||
        texto.includes("xxx") ||
        texto.includes("18+")
    ) {

        return "adult";

    }


    if (
        texto.includes("serie") ||
        texto.includes("série") ||
        texto.includes("series") ||
        texto.includes("séries") ||
        texto.includes("season") ||
        texto.includes("temporada")
    ) {

        return "series";

    }


    if (
        texto.includes("filme") ||
        texto.includes("filmes") ||
        texto.includes("movie") ||
        texto.includes("movies") ||
        texto.includes("vod")
    ) {

        return "vod";

    }


    if (
        texto.includes("music") ||
        texto.includes("musica") ||
        texto.includes("música")
    ) {

        return "music";

    }


    return "live";

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarLista(
    lista
) {

    const container =
        document.getElementById(
            "lista"
        );


    container.innerHTML =
        "";


    if (
        !lista ||
        lista.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">
                Nenhum conteúdo encontrado.
            </div>
        `;

        return;

    }


    const fragment =
        document
            .createDocumentFragment();


    lista.forEach(
        function(canal) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "canal";


            card.tabIndex =
                0;


            if (canal.logo) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    canal.logo;


                img.alt =
                    canal.nome;


                img.loading =
                    "lazy";


                img.onerror =
                    function() {

                        this.style.display =
                            "none";

                    };


                card.appendChild(
                    img
                );

            }


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "canal-info";


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "canal-nome";


            nome.textContent =
                canal.nome;


            const grupo =
                document.createElement(
                    "div"
                );


            grupo.className =
                "canal-grupo";


            grupo.textContent =
                canal.grupo;


            info.appendChild(
                nome
            );

            info.appendChild(
                grupo
            );

            card.appendChild(
                info
            );


            card.onclick =
                function() {

                    abrirPlayer(
                        canal
                    );

                };


            card.onkeydown =
                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        abrirPlayer(
                            canal
                        );

                    }

                };


            fragment.appendChild(
                card
            );

        }
    );


    container.appendChild(
        fragment
    );

}


/* =====================================================
   FILTRO
===================================================== */

function filtrar(
    categoria
) {

    categoriaAtual =
        categoria;


    if (
        categoria ===
        "todos"
    ) {

        canaisFiltrados =
            canais;

    } else {

        canaisFiltrados =
            canais.filter(
                function(canal) {

                    return (
                        canal.categoria ===
                        categoria
                    );

                }
            );

    }


    renderizarLista(
        canaisFiltrados
    );


    mostrarStatus(
        canaisFiltrados.length +
        " conteúdos encontrados.",
        "ok"
    );

}


/* =====================================================
   PLAYER
===================================================== */

function abrirPlayer(
    canal
) {

    if (
        !canal ||
        !canal.url
    ) {

        alert(
            "Este conteúdo não possui URL."
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    document.getElementById(
        "playerTitle"
    ).textContent =
        canal.nome;


    if (hls) {

        try {
            hls.destroy();
        } catch(e) {}

        hls = null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    modal.style.display =
        "flex";


    const url =
        canal.url.trim();


    /*
       HLS
    */

    if (
        url
            .toLowerCase()
            .includes(
                ".m3u8"
            )
    ) {


        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src =
                url;

            video.play()
                .catch(
                    () => {}
                );

            return;

        }


        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            hls =
                new Hls({

                    enableWorker:
                        true,

                    backBufferLength:
                        30

                });


            hls.loadSource(
                url
            );


            hls.attachMedia(
                video
            );


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    video.play()
                        .catch(
                            () => {}
                        );

                }
            );


            hls.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ) {

                    console.error(
                        "HLS:",
                        data
                    );

                }
            );


            return;

        }

    }


    /*
       MP4
    */

    video.src =
        url;


    video.load();


    video.play()
        .catch(
            () => {}
        );

}


/* =====================================================
   FECHAR PLAYER
===================================================== */

function fecharPlayer() {

    const video =
        document.getElementById(
            "videoPlayer"
        );


    if (hls) {

        try {
            hls.destroy();
        } catch(e) {}

        hls = null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    document.getElementById(
        "playerModal"
    ).style.display =
        "none";

}

/* =====================================================
   STATUS
===================================================== */

function mostrarStatus(
    texto,
    tipo
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        texto;


    status.className =
        "";


    if (
        tipo === "ok"
    ) {

        status.classList.add(
            "ok"
        );

    }


    if (
        tipo === "error"
    ) {

        status.classList.add(
            "error"
        );

    }

}
