<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GC PLAY PRO - TV SYSTEM</title>
<meta name="theme-color" content="#28D905">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
:root {
  --bg: #000000;
  --surface: #0d0d0d;
  --surface2: #161616;
  --border: #222222;
  --text: #ffffff;
  --dim: #888888;
  --accent: #28D905;
  --accent-glow: rgba(40, 217, 5, 0.2);
  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 260px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', Roboto, sans-serif;}
body{
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:flex;overflow:hidden;width:100%;
}

/* SETUP SCREEN (QR CODE & MANUAL) */
#tvSetupScreen {
  position: fixed; inset: 0; background: var(--bg); z-index: 999;
  display: flex; flex-direction: column;
}
@media (min-width: 900px) { #tvSetupScreen { flex-direction: row; } }

.setup-main { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
.top-brand { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.brand-title { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; color: #fff; }
.brand-title span { color: var(--accent); }

.manual-card-box {
  width: 100%; max-width: 450px; margin: auto;
  background: rgba(255,255,255,0.02); border: 2px dashed var(--accent);
  border-radius: var(--radius); padding: 30px; text-align: center;
}
.manual-card-box input {
  width: 100%; padding: 14px; background: var(--surface2);
  border: 1px solid var(--border); color: #fff; border-radius: var(--radius-sm);
  margin: 15px 0; outline: none; font-size: 14px;
}
.manual-card-box input:focus { border-color: var(--accent); }
.btn-ui {
  width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
  font-weight: bold; font-size: 14px; cursor: pointer; background: var(--accent);
  color: #000; text-transform: uppercase; transition: opacity 0.2s;
}
.btn-ui:hover { opacity: 0.9; }

.sidebar-panel {
  width: 100%; background: var(--surface); border-top: 1px solid var(--border);
  padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px;
}
@media (min-width: 900px) {
  .sidebar-panel { width: 340px; border-top: none; border-left: 1px solid var(--border); justify-content: space-between; }
}
.qrcode-container { background: #fff; padding: 8px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; width: 140px; height: 140px; }
.mac-display-box { font-family: monospace; font-size: 16px; font-weight: bold; color: var(--accent); letter-spacing: 1px; margin: 6px 0; }

/* APP DASHBOARD (APÓS CARREGAR M3U) */
#appDashboard { display: none; width: 100%; height: 100vh; height: 100dvh; flex-direction: row; }
#sidebar {
  width: var(--sidebar-w); background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
}
#sidebar .logo { padding: 20px; font-size: 18px; font-weight: 800; color: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
#sidebar .logo span { color: var(--accent); }
#sidebar nav { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
#sidebar nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 12px 14px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--dim); font-size: 14px; cursor: pointer; font-weight: 600; transition: all .15s;
}
#sidebar nav button:hover { background: var(--surface2); color: #fff; }
#sidebar nav button.on { background: var(--accent); color: #000; }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg); }
#topbar {
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); background: var(--surface); min-height: 64px;
}
#topbar .title { font-size: 18px; font-weight: 700; color: #fff; }

#content { flex: 1; overflow-y: auto; padding: 24px; }
.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px; cursor: pointer;
  transition: all .2s; display: flex; align-items: center; gap: 14px;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 20px var(--accent-glow); }
.card .thumb {
  width: 46px; height: 46px; border-radius: 8px; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); flex-shrink: 0;
}
.card .detail { flex: 1; min-width: 0; }
.card .detail .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.card .detail .mt { font-size: 11px; color: var(--dim); margin-top: 3px; }

/* PLAYER FULLSCREEN OVERLAY */
#player-overlay {
  position: fixed; inset: 0; background: #000; z-index: 9999;
  display: none; flex-direction: column;
}
#player-overlay.on { display: flex; }
#player-overlay .topbar { background: #0a0a0a; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; }
#player-overlay video { flex: 1; width: 100%; height: 100%; background: #000; object-fit: contain; outline: none; }

.btn-icon { background: rgba(40,217,5,0.1); border: 1px solid var(--accent); color: var(--accent); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: background 0.2s; }
.btn-icon:hover { background: var(--accent); color: #000; }
</style>
</head>
<body>

    <!-- TELA DE SETUP / QR CODE E ATIVAÇÃO -->
    <div id="tvSetupScreen">
        <div class="setup-main">
            <div class="top-brand">
                <div class="brand-title">
                    <i class="fa-solid fa-circle-play" style="color: var(--accent);"></i> GC PLAY <span>PRO</span>
                </div>
                <button class="btn-icon" onclick="trocarModoManual()" title="Inserir Manualmente"><i class="fa-solid fa-keyboard"></i></button>
            </div>
            
            <div class="manual-card-box">
                <i class="fa-solid fa-cloud-arrow-down" style="font-size: 38px; color: var(--accent); margin-bottom: 10px;"></i>
                <h3 style="font-size: 16px; font-weight: bold; margin-bottom: 6px;">Ativação Remota ou M3U</h3>
                <p style="font-size: 12px; color: var(--dim); margin-bottom: 10px;">Escaneie o QR Code ao lado pelo celular ou insira sua lista M3U diretamente abaixo:</p>
                <input type="text" id="manualM3uInput" placeholder="Cole o link M3U aqui...">
                <button class="btn-ui" onclick="salvarLinkManualDireto()">Carregar Lista M3U</button>
            </div>

            <div style="font-size: 11px; color: var(--dim); text-align: center; border-top: 1px solid var(--border); padding-top: 12px;">
                ⚡ Sistema Protegido contra CORS e Otimizado v10.0
            </div>
        </div>

        <div class="sidebar-panel">
            <div style="font-size: 12px; color: var(--accent); font-weight: 700; padding: 8px 14px; background: rgba(40,217,5,0.1); border-radius: 8px; border: 1px solid rgba(40,217,5,0.3);">
                SUPORTE TÉCNICO
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="qrcode-container" id="qrCodeBox"></div>
                <div style="color: var(--accent); font-size: 11px; font-weight: bold; margin-top: 6px;">Escaneie para Ativar no Painel</div>
                <div class="mac-display-box" id="displayMac">Gerando...</div>
                <button class="btn-ui" style="margin-top: 8px;" onclick="copiarLinkPortal()"><i class="fa-solid fa-copy"></i> Copiar Link de Ativação</button>
            </div>
            <div style="font-size: 11px; color: var(--dim);">GC PLAY PRO SYSTEM</div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL DO APLICATIVO APÓS CARREGAR -->
    <div id="appDashboard">
        <div id="sidebar">
            <div class="logo"><i class="fa-solid fa-tv" style="color:var(--accent);"></i> GC PLAY <span>PRO</span></div>
            <nav>
                <button class="on" onclick="filtrarCategoria('live', this)"><i class="fa-solid fa-satellite-dish"></i> Ao Vivo (Live)</button>
                <button onclick="filtrarCategoria('movie', this)"><i class="fa-solid fa-film"></i> Filmes (VOD)</button>
                <button onclick="filtrarCategoria('series', this)"><i class="fa-solid fa-clapperboard"></i> Séries</button>
                <button onclick="voltarConfiguracao()" style="margin-top: auto; color: #e04040;"><i class="fa-solid fa-right-from-bracket"></i> Trocar / Sair M3U</button>
            </nav>
        </div>

        <div id="main">
            <div id="topbar">
                <div class="title" id="currentCategoryTitle">Canais Ao Vivo</div>
                <div style="font-size: 12px; color: var(--dim);" id="counterItems">0 itens</div>
            </div>
            <div id="content">
                <div id="dynamicGrid" class="grid-view"></div>
            </div>
        </div>
    </div>

    <!-- PLAYER DE VÍDEO OVERLAY -->
    <div id="player-overlay">
        <div class="topbar">
            <div id="overlayTitle" style="font-weight: bold; font-size: 15px; color: #fff;">Reproduzindo</div>
            <button class="btn-icon" onclick="fecharPlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

<script>
    const SUPABASE_URL = 'https://oududghyzkucvrxffoyg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3KI2wOG7ZXTTIkRccOTYnA_zpAjuaLz';
    let supabaseClient = null;
    try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

    let deviceId = "";
    let portalUrlGerado = "";
    let ativouProcesso = false;
    let listaGlobalM3U = { live: [], movie: [], series: [] };

    window.addEventListener('DOMContentLoaded', () => {
        deviceId = localStorage.getItem('gc_device_id');
        if (!deviceId || deviceId.length < 5) {
            deviceId = "GC-" + Math.floor(Math.random() * 899999 + 100000);
            localStorage.setItem('gc_device_id', deviceId);
        }
        document.getElementById('displayMac').innerText = deviceId;

        let pathSegments = window.location.pathname.split('/');
        pathSegments.pop();
        portalUrlGerado = window.location.protocol + "//" + window.location.host + pathSegments.join('/') + "/ativar.html?mac=" + deviceId;
        
        gerarQRCode(portalUrlGerado);

        let savedM3u = localStorage.getItem('gc_manual_m3u');
        if (savedM3u) {
            ativouProcesso = true;
            processarLinkM3U(savedM3u);
            return;
        }

        if (supabaseClient) {
            verificarSupabaseNuvem(deviceId);
            setInterval(() => {
                if(!ativouProcesso) verificarSupabaseNuvem(deviceId);
            }, 3000);
        }
    });

    function gerarQRCode(texto) {
        const box = document.getElementById('qrCodeBox');
        if (!box) return;
        box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=124x124&data=${encodeURIComponent(texto)}" alt="QR Code" style="width:124px;height:124px;display:block;" onerror="this.parentElement.innerHTML='<span style=\'color:#000;font-size:11px;\'>Use o Link</span>'">`;
    }

    async function verificarSupabaseNuvem(mac) {
        if (ativouProcesso || !supabaseClient) return;
        try {
            let { data } = await supabaseClient.from('ativacoes').select('url_m3u').eq('mac', mac).maybeSingle();
            if (data && data.url_m3u && !ativouProcesso) {
                ativouProcesso = true;
                localStorage.setItem('gc_manual_m3u', data.url_m3u);
                processarLinkM3U(data.url_m3u);
            }
        } catch(e) {}
    }

    function salvarLinkManualDireto() {
        let link = document.getElementById('manualM3uInput').value.trim();
        if(link.length > 5) {
            localStorage.setItem('gc_manual_m3u', link);
            ativouProcesso = true;
            processarLinkM3U(link);
        } else {
            alert("Insira um link M3U válido.");
        }
    }

    async function processarLinkM3U(url) {
        document.getElementById('tvSetupScreen').style.display = 'none';
        document.getElementById('appDashboard').style.display = 'flex';

        // Estratégia anti-CORS robusta baseada em múltiplos proxies públicos de alta performance
        const proxies = [
            url,
            "https://corsproxy.io/?" + encodeURIComponent(url),
            "https://api.allorigins.win/raw?url=" + encodeURIComponent(url)
        ];

        let conteudoM3U = "";
        for (let p of proxies) {
            try {
                let res = await fetch(p);
                if(res.ok) {
                    let txt = await res.text();
                    if(txt && txt.includes('#EXTINF')) {
                        conteudoM3U = txt;
                        break;
                    }
                }
            } catch(err) {}
        }

        if(!conteudoM3U) {
            alert("Erro de CORS ou link inacessível. Verifique o link M3U.");
            voltarConfiguracao();
            return;
        }

        parsearDadosM3U(conteudoM3U);
        filtrarCategoria('live', document.querySelector('#sidebar nav button'));
    }

    function parsearDadosM3U(dados) {
        listaGlobalM3U = { live: [], movie: [], series: [] };
        let linhas = dados.split('\n');
        let nomeAtual = "Conteúdo";
        let grupoAtual = "Geral";

        for(let i = 0; i < linhas.length; i++) {
            let linha = linhas[i].trim();
            if(linha.startsWith('#EXTINF:')) {
                let matchNome = linha.match(/,(.+)$/);
                if(matchNome) nomeAtual = matchNome[1];

                let matchGrp = linha.match(/group-title="([^"]+)"/i);
                if(matchGrp) grupoAtual = matchGrp.tag || matchGrp[1];
            } else if(linha && !linha.startsWith('#')) {
                let tipo = 'live';
                let lowerGrp = grupoAtual.toLowerCase();
                let lowerUrl = linha.toLowerCase();
                let lowerName = nomeAtual.toLowerCase();

                if(lowerGrp.includes('filme') || lowerGrp.includes('vod') || lowerUrl.includes('/movie/') || lowerName.includes('filme')) {
                    tipo = 'movie';
                } else if(lowerGrp.includes('série') || lowerGrp.includes('serie') || lowerUrl.includes('/series/') || lowerName.includes('s0') || lowerName.includes('temp')) {
                    tipo = 'series';
                }

                listaGlobalM3U[tipo].push({ name: nomeAtual, group: grupoAtual, url: linha });
                nomeAtual = "Conteúdo";
                grupoAtual = "Geral";
            }
        }
    }

    function filtrarCategoria(tipo, btnElement) {
        if(btnElement) {
            document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.remove('on'));
            if(!btnElement.style.color) btnElement.classList.add('on');
        }

        let grid = document.getElementById('dynamicGrid');
        grid.innerHTML = "";
        let itens = listaGlobalM3U[tipo] || [];

        document.getElementById('counterItems').innerText = itens.length + " itens";
        if(tipo === 'live') document.getElementById('currentCategoryTitle').innerText = "Canais Ao Vivo";
        if(tipo === 'movie') document.getElementById('currentCategoryTitle').innerText = "Filmes (VOD)";
        if(tipo === 'series') document.getElementById('currentCategoryTitle').innerText = "Séries";

        if(itens.length === 0) {
            grid.innerHTML = `<div style="color:var(--dim); padding:20px;">Nenhum conteúdo encontrado nesta aba.</div>`;
            return;
        }

        itens.forEach((item, index) => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="thumb"><i class="fa-solid ${tipo === 'live' ? 'fa-tv' : tipo === 'movie' ? 'fa-film' : 'fa-clapperboard'}"></i></div>
                <div class="detail">
                    <div class="nm">${item.name}</div>
                    <div class="mt">${item.group}</div>
                </div>
            `;
            card.onclick = () => dispararPlayer(item.url, item.name);
            grid.appendChild(card);
        });
    }

    function dispararPlayer(url, nome) {
        document.getElementById('overlayTitle').innerText = nome;
        let video = document.getElementById('videoPlayer');
        document.getElementById('player-overlay').classList.add('on');

        if (window.hlsPlayerInstance) {
            window.hlsPlayerInstance.destroy();
            window.hlsPlayerInstance = null;
        }

        if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8'))) {
            const hls = new Hls();
            window.hlsPlayerInstance = hls;
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); });
        } else {
            video.src = url;
            video.play().catch(()=>{});
        }
    }

    function fecharPlayer() {
        let video = document.getElementById('videoPlayer');
        video.pause();
        video.src = "";
        document.getElementById('player-overlay').classList.remove('on');
    }

    function voltarConfiguracao() {
        if(confirm("Deseja desconectar a lista atual?")) {
            localStorage.removeItem('gc_manual_m3u');
            window.location.reload();
        }
    }

    function trocarModoManual() {
        document.getElementById('manualM3uInput').focus();
    }

    function copiarLinkPortal() {
        navigator.clipboard.writeText(portalUrlGerado).then(() => {
            alert("Link de ativação copiado com sucesso!");
        }).catch(() => {
            prompt("Copie o link abaixo:", portalUrlGerado);
        });
    }
</script>
</body>
</html>
