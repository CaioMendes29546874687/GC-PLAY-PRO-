<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050805">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>GC PLAY PRO</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#030503;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

:root{
    --green:#00ff66;
    --green2:#00c853;
    --dark:#030503;
    --panel:#071008;
    --panel2:#0a150b;
    --border:rgba(0,255,102,.22);
    --text:#fff;
    --muted:#7f9184;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% -20%,rgba(0,255,102,.08),transparent 35%),
        #030503;
}

/* =========================
   HEADER
========================= */

header{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 18px;
    background:#050905;
    border-bottom:1px solid var(--border);
    box-shadow:0 0 20px rgba(0,255,102,.05);
    z-index:10;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:max-content;
}

.logo-icon{
    width:36px;
    height:36px;
    border:2px solid var(--green);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--green);
    box-shadow:0 0 14px rgba(0,255,102,.25);
}

.logo-text{
    font-size:19px;
    font-weight:900;
    letter-spacing:1px;
}

.logo-text span{
    color:var(--green);
}

.search-box{
    flex:1;
    max-width:520px;
    margin:auto;
    position:relative;
}

.search-box i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#6e8173;
}

.search-box input{
    width:100%;
    height:40px;
    border-radius:20px;
    border:1px solid #17251a;
    background:#091009;
    color:#fff;
    padding:0 15px 0 40px;
    outline:none;
}

.search-box input:focus{
    border-color:var(--green);
    box-shadow:0 0 12px rgba(0,255,102,.12);
}

.status-box{
    display:flex;
    align-items:center;
    gap:8px;
    color:#9cac9f;
    font-size:12px;
    min-width:max-content;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#777;
}

.status-dot.active{
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

/* =========================
   BODY
========================= */

.main{
    flex:1;
    display:flex;
    min-height:0;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:220px;
    min-width:220px;
    background:#050905;
    border-right:1px solid var(--border);
    padding:14px 10px;
    overflow-y:auto;
}

.side-title{
    color:#607166;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    padding:10px;
}

.category-btn{
    width:100%;
    height:42px;
    border:0;
    background:transparent;
    color:#a9b7ad;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 13px;
    margin-bottom:4px;
    text-align:left;
}

.category-btn i{
    width:20px;
    text-align:center;
}

.category-btn:hover,
.category-btn.active{
    color:#000;
    background:var(--green);
    box-shadow:0 0 14px rgba(0,255,102,.15);
}

.category-count{
    margin-left:auto;
    font-size:11px;
    opacity:.65;
}

/* =========================
   CONTENT
========================= */

.content{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.toolbar{
    min-height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border-bottom:1px solid rgba(0,255,102,.1);
    background:#050905;
}

.url-input{
    flex:1;
    min-width:100px;
    height:39px;
    background:#091009;
    border:1px solid #17251a;
    border-radius:8px;
    color:#fff;
    outline:none;
    padding:0 12px;
}

.url-input:focus{
    border-color:var(--green);
}

.btn{
    height:39px;
    border-radius:8px;
    border:1px solid rgba(0,255,102,.35);
    background:#071007;
    color:var(--green);
    padding:0 14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.btn:hover,
.btn:focus{
    background:var(--green);
    color:#000;
}

.btn-primary{
    background:var(--green);
    color:#000;
}

.btn-primary:hover{
    background:#39ff83;
}

/* =========================
   CHANNEL AREA
========================= */

.channel-area{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:16px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.section-title{
    font-size:18px;
    font-weight:800;
}

.section-title span{
    color:var(--green);
}

.channel-count{
    color:#607166;
    font-size:12px;
}

.channel-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(185px,1fr));
    gap:10px;
}

.channel-card{
    min-height:94px;
    position:relative;
    border:1px solid #152117;
    background:
        linear-gradient(145deg,#091109,#050805);
    border-radius:10px;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    cursor:pointer;
    transition:.15s;
    overflow:hidden;
}

.channel-card:hover,
.channel-card.focused{
    border-color:var(--green);
    transform:translateY(-2px);
    box-shadow:0 0 16px rgba(0,255,102,.12);
}

.channel-card.active{
    border-color:var(--green);
    box-shadow:inset 3px 0 0 var(--green);
}

.channel-icon{
    width:40px;
    height:40px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0d190e;
    color:var(--green);
    margin-bottom:8px;
}

.channel-name{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channel-group{
    color:#65766a;
    font-size:10px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.favorite{
    position:absolute;
    top:8px;
    right:9px;
    color:#415047;
}

.favorite.active{
    color:var(--green);
}

.empty{
    min-height:260px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#627166;
    gap:12px;
}

.empty i{
    font-size:42px;
    color:#26362b;
}

.empty strong{
    color:#a0afa4;
}

/* =========================
   PLAYER
========================= */

#playerModal{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    display:none;
    flex-direction:column;
}

#playerModal.show{
    display:flex;
}

.player-header{
    height:54px;
    min-height:54px;
    display:flex;
    align-items:center;
    padding:0 14px;
    background:#050805;
    border-bottom:1px solid rgba(0,255,102,.18);
}

.player-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:700;
}

.player-close{
    width:38px;
    height:38px;
    border:1px solid #203123;
    background:#091009;
    color:#fff;
    border-radius:8px;
}

.player-close:hover{
    background:var(--green);
    color:#000;
}

.video-wrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* =========================
   ACTIVATION
========================= */

#activationOverlay{
    position:fixed;
    inset:0;
    z-index:1000;
    background:
        radial-gradient(circle at center,rgba(0,255,102,.08),transparent 45%),
        rgba(1,4,2,.98);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#activationOverlay.show{
    display:flex;
}

.activation-box{
    width:min(460px,100%);
    max-height:95vh;
    overflow:auto;
    background:#071008;
    border:1px solid rgba(0,255,102,.35);
    border-radius:16px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,255,102,.1);
}

.activation-logo{
    width:58px;
    height:58px;
    margin:0 auto 13px;
    border:2px solid var(--green);
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--green);
    font-size:24px;
    box-shadow:0 0 20px rgba(0,255,102,.15);
}

.activation-box h1{
    font-size:23px;
    margin-bottom:5px;
}

.activation-box h1 span{
    color:var(--green);
}

.activation-sub{
    color:#7e8f83;
    font-size:13px;
    margin-bottom:20px;
}

.qr-wrap{
    width:220px;
    height:220px;
    background:#fff;
    padding:10px;
    border-radius:10px;
    margin:0 auto 18px;
}

#qrcode{
    width:200px;
    height:200px;
}

.activation-code-label{
    color:#68796e;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.activation-code{
    font-size:28px;
    font-weight:900;
    letter-spacing:5px;
    color:var(--green);
    margin:4px 0 15px;
}

.device-id{
    background:#030603;
    border:1px solid #172318;
    border-radius:7px;
    padding:9px;
    color:#68786d;
    font-size:10px;
    word-break:break-all;
    margin-bottom:15px;
}

.activation-box input{
    width:100%;
    height:43px;
    background:#030603;
    color:#fff;
    border:1px solid #172318;
    border-radius:8px;
    outline:none;
    padding:0 12px;
    margin-bottom:9px;
}

.activation-box input:focus{
    border-color:var(--green);
}

.activation-message{
    min-height:20px;
    margin-top:12px;
    font-size:12px;
}

.activation-message.success{
    color:var(--green);
}

.activation-message.error{
    color:#ff7474;
}

.activation-message.waiting{
    color:#9da99f;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.82);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
}

#loading.show{
    display:flex;
}

.spinner{
    width:44px;
    height:44px;
    border:3px solid #172319;
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.loading-text{
    color:#9baa9e;
    font-size:13px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:3000;
    max-width:360px;
    padding:13px 16px;
    background:#091009;
    border:1px solid var(--green);
    border-radius:9px;
    color:#fff;
    box-shadow:0 0 20px rgba(0,255,102,.12);
    display:none;
    font-size:13px;
}

#toast.show{
    display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    header{
        padding:0 10px;
        gap:9px;
    }

    .logo-text{
        font-size:15px;
    }

    .logo-icon{
        width:31px;
        height:31px;
    }

    .search-box{
        max-width:none;
    }

    .status-box{
        display:none;
    }

    .sidebar{
        width:64px;
        min-width:64px;
        padding:8px 5px;
    }

    .side-title{
        display:none;
    }

    .category-btn{
        height:45px;
        justify-content:center;
        padding:0;
    }

    .category-btn span,
    .category-count{
        display:none;
    }

    .toolbar{
        padding:7px;
    }

    .toolbar .btn span{
        display:none;
    }

    .toolbar .btn{
        width:42px;
        padding:0;
    }

    .channel-area{
        padding:10px;
    }

    .channel-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
    }

    .channel-card{
        min-height:90px;
    }
}

@media(max-width:450px){

    .logo-text{
        display:none;
    }

    .search-box input{
        height:36px;
    }

    .channel-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .activation-box{
        padding:18px;
    }

    .qr-wrap{
        width:200px;
        height:200px;
    }

    #qrcode{
        width:180px;
        height:180px;
    }
}
</style>
</head>

<body>

<div id="app">

    <header>

        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-play"></i>
            </div>

            <div class="logo-text">

            </div>
        </div>

        <div class="search-box">

            <input

        </div>

        <div class="status-box">
            <div id="statusDot" class="status-dot"></div>

    </header>

    <div class="main">

        <aside class="sidebar">

            <div class="side-title">

            </div>

            <button class="category-btn active"

                <span>Todos</span>

            <button class="category-btn"

                       id="countLive">0</small>

            <button class="category-btn"
                    data-category="movies">

                       id="countMovies">0</small>
            </button>

            <button class="category-btn"
                    data-category="series">
                <i class="fa-solid fa-clapperboard"></i>
                <span>Séries</span>
                <small class="category-count"
                       id="countSeries">0</small>
            </button>

            <button class="category-btn"
                    data-category="music">
                <i class="fa-solid fa-music"></i>
                <span>Música</span>

                       id="countMusic">0</small>
            </button>

            <button class="category-btn"
                    data-category="adult">
                <i class="fa-solid fa-lock"></i>

            <button class="category-btn"

                <i class="fa-solid fa-star"></i>
                <span>Favoritos</span>

            </button>

        </aside>

        <section class="content">

            <div class="toolbar">

                <input
                    id="playlistInput"
                    class="url-input"
                    type="url"
                    placeholder="Cole aqui a URL da sua playlist M3U">

                <button
                    id="loadPlaylistBtn"
                    class="btn btn-primary">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span>Carregar</span>
                </button>

                <button
                    id="activationBtn"
                    class="btn"
                    title="Ativação">
                    <i class="fa-solid fa-qrcode"></i>
                    <span>Ativação</span>
                </button>

                <button
                    id="reloadBtn"
                    class="btn"
                    title="Atualizar">
                    <i class="fa-solid fa-rotate"></i>
                </button>

            </div>

            <div class="channel-area">

                <div class="section-head">

                    <div class="section-title">
                        <span id="sectionTitle">Todos</span>
                    </div>

                    <div class="channel-count"
                         id="channelCount">
                        0 itens
                    </div>

                </div>

                <div
                    id="channelGrid"
                    class="channel-grid">
                </div>

                <div
                    id="emptyState"
                    class="empty">

                    <i class="fa-solid fa-tv"></i>

                    <strong>
                        Nenhuma playlist carregada
                    </strong>

                    <span>
                        Cole uma URL M3U acima para começar.
                    </span>

                </div>

            </div>

        </section>

    </div>

</div>


<!-- =========================
     PLAYER
========================= -->

<div id="playerModal">

    <div class="player-header">

        <div
            id="playerTitle"
            class="player-title">
            GC PLAY PRO
        </div>

        <button
            id="playerClose"
            class="player-close">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="video-wrap">

        <video
            id="video"
            controls

        </video>

    </div>

</div>


<!-- =========================
     ACTIVATION
========================= -->

<div id="activationOverlay">

    <div class="activation-box">

        <div class="activation-logo">
            <i class="fa-solid fa-qrcode"></i>
        </div>

        <h1>
            GC <span>PLAY PRO</span>
        </h1>

        <div class="activation-sub">
            Ative este dispositivo para liberar o aplicativo
        </div>

        <div class="qr-wrap">
            <div id="qrcode"></div>
        </div>

        <div class="activation-code-label">
            Código de ativação
        </div>

        <div
            id="activationCode"
            class="activation-code">
            ------

            --

        <input
            id="activationPlaylist"
            type="url"
            placeholder="URL da playlist M3U">

        <button
            id="sendActivationBtn"

            <i class="fa-solid fa-unlock"></i>

        </button>

        <div
            id="activationMessage"
            class="activation-message waiting">
            Aguardando ativação...
        </div>

    </div>

</div>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="spinner"></div>

    <div
        id="loadingText"
        class="loading-text">
        Carregando...
    </div>

</div>


<div id="toast"></div>

        SUPABASE_URL,

    );


/* ============================================================
   UTILITÁRIOS
============================================================ */

function $(id){
    return document.getElementById(id);
}

function showLoading(text){
    $("loadingText").textContent = text || "Carregando...";
    $("loading").classList.add("show");
}

function hideLoading(){
    $("loading").classList.remove("show");
}

function toast(message){
    const el = $("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer =
        setTimeout(() => {
            el.classList.remove("show");
        }, 3500);
}

function validUUID(value){

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value);

}


/* ============================================================
   UUID COMPATÍVEL COM APARELHOS ANTIGOS
============================================================ */

function gerarUUIDFallback(){

    const bytes =
        new Uint8Array(16);

    if(
        window.crypto &&
        typeof window.crypto.getRandomValues === "function"
    ){

        window.crypto.getRandomValues(bytes);

    }else{

        for(
            let i = 0;
            i < 16;
            i++
        ){

            bytes[i] =
                Math.floor(
                    Math.random() * 256
                );

        }

    }

    bytes[6] =
        (bytes[6] & 0x0f) | 0x40;

    bytes[8] =
        (bytes[8] & 0x3f) | 0x80;

    const hex =
        Array.from(bytes)
            .map(
                b =>
                    b.toString(16)
                        .padStart(2,"0")
            )
            .join("");

    return (
        hex.substring(0,8) + "-" +
        hex.substring(8,12) + "-" +
        hex.substring(12,16) + "-" +
        hex.substring(16,20) + "-" +
        hex.substring(20,32)
    );
}


function gerarUUID(){

    try{

        if(
            window.crypto &&
            typeof window.crypto.randomUUID === "function"
        ){

            return window.crypto.randomUUID();

        }

    }catch(e){}

    return gerarUUIDFallback();
}


/* ============================================================
   CÓDIGO DE ATIVAÇÃO
============================================================ */

function gerarCodigoAtivacao(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i = 0; i < 6; i++){

        result +=
            chars.charAt(
                Math.floor(
                    Math.random() *
                    chars.length
                )
            );

    }

    return result;
}

    ======================================================== */

        let id =
            localStorage.getItem(

            );

        if(!validUUID(id || "")){

            localStorage.setItem(
                "gcplay_device_id",

            );

    /* ========================================================
       QR CODE
    ======================================================== */

    gerarQRCode(){

        const qr =
            $("qrcode");

        qr.innerHTML = "";

        const url =
            ACTIVATION_BASE_URL +
            "?device=" +
            encodeURIComponent(
                this.deviceId
            ) +
            "&code=" +
            encodeURIComponent(
                this.activationCode
            );

        new QRCode(

            {

    /* ========================================================
       EDGE FUNCTION
    ======================================================== */

    async edgeFunction(body){

        const response =
            await fetch(
                EDGE_FUNCTION_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        let data = null;

        try{
            data =
                await response.json();
        }catch(e){}

        if(!response.ok){

            throw new Error(
                data &&
                data.error
                    ? data.error
                    : "Erro no servidor."
            );

        }

        return data;

    },


    /* ========================================================
       REGISTRAR DISPOSITIVO
    ======================================================== */

    async registrarDispositivo(){

        if(!validUUID(this.deviceId)){

            console.error(
                "UUID inválido:",
                this.deviceId
            );

            this.inicializarDispositivo();

        }

        try{

            const data =
                await this.edgeFunction(
                    {
                        action:"register",

                        device_id:
                            this.deviceId,

                        activation_code:
                            this.activationCode
                    }
                );

            if(
                data &&
                data.device &&
                data.device.activation_code
            ){

                this.activationCode =
                    String(
                        data.device.activation_code
                    ).toUpperCase();

                localStorage.setItem(
                    "gcplay_activation_code",
                    this.activationCode
                );

                this.gerarQRCode();

            }

            if(
                data.status === "active"
            ){

                this.processarAtualizacaoDispositivo(
                    data.device
                );

            }else{

                this.atualizarStatusAtivacao(
                    "AGUARDANDO ATIVAÇÃO",
                    "waiting"
                );

            }

        }catch(error){

            console.error(
                "Erro ao registrar dispositivo:",

            );

            this.atualizarStatusAtivacao(
                "AGUARDANDO SERVIDOR",
                "waiting"
            );

       STATUS
    ======================================================== */

    async verificarStatusDispositivo(){

        if(!validUUID(this.deviceId)){
            return;
        }

        try{

            const data =
                await this.edgeFunction(
                    {
                        action:"status",

                        device_id:
                            this.deviceId
                    }
                );

            if(
                data &&
                data.device
            ){

                this.processarAtualizacaoDispositivo(
                    data.device
                );

            console.warn(
                "Status:",
                error
            );

        }

    /* ========================================================
       PROCESSAR STATUS
    ======================================================== */

    processarAtualizacaoDispositivo(device){

        if(!device){
            return;
        }

        if(device.activation_code){

            this.activationCode =
                String(
                    device.activation_code
                ).toUpperCase();

            localStorage.setItem(
                "gcplay_activation_code",
                this.activationCode
            );

            this.gerarQRCode();

        }

        if(device.status === "active"){

            this.atualizarStatusAtivacao(
                "ATIVO",
                "active"
            );

            if(
                device.playlist_url &&
                device.playlist_url !==
                    this.playlistUrl
            ){

                this.playlistUrl =
                    device.playlist_url;

                localStorage.setItem(
                    "gcplay_playlist_url",
                    device.playlist_url
                );

                this.carregarListaM3U(
                    device.playlist_url,
                    false
                );

            }

        }else if(
            device.status === "blocked"
        ){

            this.atualizarStatusAtivacao(
                "DISPOSITIVO BLOQUEADO",
                "error"
            );

            toast(
                "Este dispositivo está bloqueado."
            );

        }else{

            this.atualizarStatusAtivacao(
                "AGUARDANDO ATIVAÇÃO",
                "waiting"
            );

        }

    },


    /* ========================================================
       REALTIME + POLLING
    ======================================================== */

    iniciarRealtime(){

        try{

            if(this.activationChannel){

                supabaseClient
                    .removeChannel(
                        this.activationChannel
                    );

            }

            this.activationChannel =
                supabaseClient
                    .channel(
                        "gcplay-device-" +
                        this.deviceId
                    )
                    .on(
                        "postgres_changes",
                        {
                            event:"*",
                            schema:"public",
                            table:"devices",
                            filter:
                                "device_id=eq." +
                                this.deviceId
                        },
                        payload => {

                            if(
                                payload &&
                                payload.new
                            ){

                                this.processarAtualizacaoDispositivo(
                                    payload.new
                                );

                            }

                        }
                    )
                    .subscribe();

        }catch(error){

            console.warn(
                "Realtime:",
                error
            );

        }


        clearInterval(
            this.activationPoll
        );

        this.activationPoll =
            setInterval(
                () => {
                    this.verificarStatusDispositivo();
                },
                15000
            );

    },

        msg.className =

                    : tipo === "error"
                        ? "error"
                        : "waiting"
            );

       ABRIR ATIVAÇÃO
    ======================================================== */

        this.gerarQRCode();

        $("activationPlaylist").value =
            this.playlistUrl ||
            localStorage.getItem(

            ) ||

    /* ========================================================
       ATIVAÇÃO DIRETA
    ======================================================== */

    async ativarDispositivo(){

        const playlist =
            $("activationPlaylist")
                .value
                .trim();

        if(!playlist){

            $("activationMessage").textContent =
                "Informe a URL da playlist M3U.";

            $("activationMessage").className =
                "activation-message error";

            return;

        }

        let parsed;

        try{

            parsed =
                new URL(playlist);

            if(
                parsed.protocol !== "http:" &&
                parsed.protocol !== "https:"
            ){

                throw new Error();

            }

        }catch(e){

            $("activationMessage").textContent =
                "URL da playlist inválida.";

            $("activationMessage").className =
                "activation-message error";

            return;

        }


        showLoading(
            "Ativando dispositivo..."
        );

        try{

            const data =
                await this.edgeFunction(
                    {
                        action:"activate",

                        device_id:
                            this.deviceId,

                        activation_code:
                            this.activationCode,

                        playlist_url:
                            playlist
                    }
                );

            if(
                data.success &&
                data.device
            ){

                localStorage.setItem(
                    "gcplay_playlist_url",
                    playlist
                );

                this.playlistUrl =
                    playlist;

                this.processarAtualizacaoDispositivo(
                    data.device
                );

                $("activationMessage").textContent =
                    "Dispositivo ativado com sucesso!";

                $("activationMessage").className =
                    "activation-message success";

                toast(
                    "Dispositivo ativado."
                );

                setTimeout(
                    () => {
                        this.fecharAtivacao();
                    },
                    1200
                );

                await this.carregarListaM3U(
                    playlist,
                    true
                );

            }else{

                throw new Error(
                    data.error ||
                    "Não foi possível ativar."
                );

            }

        }catch(error){

            console.error(
                error
            );

            $("activationMessage").textContent =
                error.message ||
                "Erro ao ativar dispositivo.";

            $("activationMessage").className =
                "activation-message error";

        }finally{

            hideLoading();

        }

    },

    /* ========================================================
       CLASSIFICAÇÃO
    ======================================================== */

    classificarCanal(
        name,
        group,
        url
    ){

        const text =
            (
                name +
                " " +
                group +
                " " +
                url
            ).toLowerCase();


        if(
            /adult|xxx|18\+|porn|sex/.test(
                text
            )
        ){

            return "adult";

        }


        if(
            /music|música|musica|radio|rádio|fm/.test(
                text
            )
        ){

            return "music";

        }


        if(
            /series|séries|serie|temporada|season|epis[oó]dio|s\d{1,2}e\d{1,2}/i
                .test(text)
        ){

            return "series";

        }


        if(
            /movie|filme|cinema|vod|film/.test(
                text
            )
        ){

            return "movies";

        }


        return "live";

    },


    /* ========================================================
       PARSER M3U
    ======================================================== */

    parseM3U(text){

        text =
            String(text || "")
                .replace(/^\uFEFF/, "");

        const lines =
            text.replace(
                /\r\n/g,
                "\n"
            ).replace(
                /\r/g,
                "\n"
            ).split("\n");


        const result = [];

        let current = null;

        for(
            let i = 0;
            i < lines.length;
            i++
        ){

            const raw =
                lines[i];

            const line =
                raw.trim();

            if(!line){
                continue;
            }


            if(
                line.toUpperCase()
                    .startsWith(
                        "#EXTINF:"
                    )
            ){

                const info =
                    line.substring(
                        8
                    );

                let title =
                    info;

                const comma =
                    info.indexOf(",");

                if(comma >= 0){

                    title =
                        info.substring(
                            comma + 1
                        ).trim();

                }


                const attrs = {};

                const attrRegex =
                    /([A-Za-z0-9_-]+)="([^"]*)"/g;

                let match;

                while(
                    (match =
                        attrRegex.exec(info))
                ){

                    attrs[
                        match[1].toLowerCase()
                    ] =
                        match[2];

                }


                current = {

                    name:
                        title ||
                        "Sem nome",

                    group:
                        attrs["group-title"] ||
                        attrs["group"] ||
                        "Sem categoria",

                    logo:
                        attrs["tvg-logo"] ||
                        attrs["logo"] ||
                        "",

                    tvgId:
                        attrs["tvg-id"] ||
                        "",

                    tvgName:
                        attrs["tvg-name"] ||
                        "",

                    url:"",

                    category:"live"

                };

                continue;

            }


            if(
                line.startsWith("#EXTGRP:")
            ){

                if(current){

                    current.group =
                        line.substring(
                            8
                        ).trim() ||
                        current.group;

                }

                continue;

            }


            if(
                line.startsWith("#")
            ){

                continue;

            }


            if(current){

                current.url =
                    line;

                current.category =
                    this.classificarCanal(
                        current.name,
                        current.group,
                        current.url
                    );

                result.push(
                    current
                );

                current = null;

            }

        }


        const seen =
            new Set();

        return result.filter(
            channel => {

                if(!channel.url){
                    return false;
                }

                const key =
                    channel.name +
                    "|" +
                    channel.url;

                if(seen.has(key)){
                    return false;
                }

                seen.add(key);

                return true;

            }
        );

    },


    /* ========================================================
       CARREGAR M3U
    ======================================================== */

    async carregarListaM3U(
        url,
        mostrarLoading = true
    ){

        if(!url){
            return;
        }

        if(mostrarLoading){

            showLoading(
                "Baixando playlist..."
            );

        }

        let text = null;

        let lastError = null;


        /* tentativa direta */

        try{

            const response =
                await fetch(
                    url,
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }

            text =
                await response.text();

        }catch(error){

            lastError =
                error;

        }


        /* tentativa via proxies */

        if(
            !text
        ){

            for(
                const proxy of CORS_PROXIES
            ){

                try{

                    if(mostrarLoading){

                        $("loadingText")
                            .textContent =
                            "Tentando conexão alternativa...";

                    }

                    const proxyUrl =
                        proxy +
                        encodeURIComponent(
                            url
                        );

                    const response =
                        await fetch(
                            proxyUrl,
                            {
                                method:"GET",
                                cache:"no-store"
                            }
                        );

                    if(!response.ok){

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }

                    const candidate =
                        await response.text();

                    if(
                        candidate &&
                        candidate.length > 10
                    ){

                        text =
                            candidate;

                        break;

                    }

                }catch(error){

                    lastError =
                        error;

                }

            }

        }


        if(!text){

            if(mostrarLoading){
                hideLoading();
            }

            toast(
                "Não foi possível carregar a playlist."
            );

            console.error(
                lastError
            );

            return;

        }


        const canais =
            this.parseM3U(
                text
            );


        if(!canais.length){

            if(mostrarLoading){
                hideLoading();
            }

            toast(
                "Nenhum canal encontrado na playlist."
            );

            return;

        }


        this.canais =
            canais;

        this.playlistUrl =
            url;


        localStorage.setItem(
            "gcplay_playlist_url",
            url
        );


        $("playlistInput").value =
            url;


        this.atualizarCategorias();

        this.renderizar();


        if(mostrarLoading){

            hideLoading();

        }


        toast(
            canais.length +
            " itens carregados."
        );

    },


    /* ========================================================
       RESTAURAR PLAYLIST
    ======================================================== */

    restaurarListaLocal(){

        const url =
            localStorage.getItem(
                "gcplay_playlist_url"
            );

        if(url){

            this.playlistUrl =
                url;

            $("playlistInput").value =
                url;

            /* não bloqueia o início */

            this.carregarListaM3U(
                url,
                false
            );

        }

    },


    /* ========================================================
       FILTRO
    ======================================================== */

    obterCanaisFiltrados(){

        let result =
            this.canais.slice();


        if(
            this.categoriaAtual ===
            "favorites"
        ){

            result =
                result.filter(
                    channel => {

                        const key =
                            channel.url +
                            "|" +
                            channel.name;

                        return this.favoritos
                            .has(key);

                    }
                );

        }else if(
            this.categoriaAtual !==
            "all"
        ){

            result =
                result.filter(
                    channel =>
                        channel.category ===
                        this.categoriaAtual
                );

        }


        const query =
            $("searchInput")
                .value
                .trim()
                .toLowerCase();


        if(query){

            result =
                result.filter(
                    channel => {

                        return (
                            channel.name
                                .toLowerCase()
                                .includes(query)
                            ||
                            channel.group
                                .toLowerCase()
                                .includes(query)
                        );

                    }
                );

        }


        return result;

    },


    /* ========================================================
       RENDER
    ======================================================== */

    renderizar(){

        const grid =
            $("channelGrid");

        const empty =
            $("emptyState");

        grid.innerHTML = "";

        const canais =
            this.obterCanaisFiltrados();

        this.canaisFiltrados =
            canais;


        $("channelCount")
            .textContent =
            canais.length +
            (
                canais.length === 1
                    ? " item"
                    : " itens"
            );


        const titles = {

            all:"Todos",

            live:"TV ao vivo",

            movies:"Filmes",

            series:"Séries",

            music:"Música",

            adult:"Adulto",

            favorites:"Favoritos"

        };


        $("sectionTitle")
            .textContent =
            titles[
                this.categoriaAtual
            ] || "Todos";


        if(!canais.length){

            empty.style.display =
                "flex";

            return;

        }


        empty.style.display =
            "none";


        canais.forEach(
            (channel, index) => {

                const originalIndex =
                    this.canais.indexOf(
                        channel
                    );


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "channel-card";

                card.tabIndex = 0;


                if(
                    this.currentChannel ===
                    channel
                ){

                    card.classList.add(
                        "active"
                    );

                }


                const key =
                    channel.url +
                    "|" +
                    channel.name;


                const isFavorite =
                    this.favoritos.has(
                        key
                    );


                card.innerHTML = `

                    <div class="channel-icon">

                        ${
                            channel.logo
                            ?
                            `<img
                                src="${this.escapeAttr(channel.logo)}"
                                style="width:100%;height:100%;object-fit:contain;border-radius:7px"
                                onerror="this.style.display='none'">`
                            :
                            `<i class="fa-solid fa-tv"></i>`
                        }

                    </div>

                    <div class="channel-name">
                        ${this.escapeHtml(channel.name)}
                    </div>

                    <div class="channel-group">
                        ${this.escapeHtml(channel.group)}
                    </div>

                    <div
                        class="favorite ${isFavorite ? "active" : ""}"
                        title="Favorito">

                        <i class="fa-solid fa-star"></i>

                    </div>
                `;


                card.addEventListener(
                    "click",
                    event => {

                        if(
                            event.target.closest(
                                ".favorite"
                            )
                        ){

                            this.alternarFavorito(
                                originalIndex
                            );

                            return;

                        }

                        this.tocarCanal(
                            channel
                        );

                    }
                );


                card.addEventListener(
                    "keydown",
                    event => {

                        if(
                            event.key === "Enter"
                        ){

                            this.tocarCanal(
                                channel
                            );

                        }

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );

    },


    /* ========================================================
       CATEGORIAS
    ======================================================== */

    atualizarCategorias(){

        const count = category =>

            this.canais.filter(
                c =>
                    c.category ===
                    category
            ).length;


        $("countAll")
            .textContent =
            this.canais.length;

        $("countLive")
            .textContent =
            count("live");

        $("countMovies")
            .textContent =
            count("movies");

        $("countSeries")
            .textContent =
            count("series");

        $("countMusic")
            .textContent =
            count("music");

        $("countAdult")
            .textContent =
            count("adult");

        $("countFavorites")
            .textContent =
            this.canais.filter(
                c =>
                    this.favoritos.has(
                        c.url +
                        "|" +
                        c.name
                    )
            ).length;

    },


    /* ========================================================
       PLAYER
    ======================================================== */

    async tocarCanal(channel){

        if(!channel || !channel.url){
            return;
        }

        this.currentChannel =
            channel;

        $("playerTitle")
            .textContent =
            channel.name;


        $("playerModal")
            .classList.add(
                "show"
            );


        const video =
            $("video");


        if(this.hls){

            try{
                this.hls.destroy();
            }catch(e){}

            this.hls =
                null;

        }


        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();


        const url =
            channel.url;


        const isHls =
            /\.m3u8($|\?)/i.test(
                url
            );


        if(
            isHls &&
            window.Hls &&
            Hls.isSupported()
        ){

            this.hls =
                new Hls(
                    {
                        enableWorker:true,
                        lowLatencyMode:false
                    }
                );


            this.hls.loadSource(
                url
            );

            this.hls.attachMedia(
                video
            );


            this.hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {

                    video.play()
                        .catch(
                            () => {}
                        );

                }
            );


            this.hls.on(
                Hls.Events.ERROR,
                (
                    event,
                    data
                ) => {

                    console.warn(
                        "HLS:",
                        data
                    );

                }
            );

        }else{

            video.src =
                url;

            try{

                await video.play();

            }catch(e){

                console.warn(
                    e
                );

            }

        }

    },


    fecharPlayer(){

        const video =
            $("video");

        try{
            video.pause();
        }catch(e){}


        if(this.hls){

            try{
                this.hls.destroy();
            }catch(e){}

            this.hls =
                null;

        }


        video.removeAttribute(
            "src"
        );

        video.load();


        $("playerModal")
            .classList.remove(
                "show"
            );

        this.currentChannel =
            null;

        this.renderizar();

    },


    /* ========================================================
       ESCAPE HTML
    ======================================================== */

    escapeHtml(value){

        return String(
            value || ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    },


    escapeAttr(value){

        return this.escapeHtml(
            value
        );

    }

};


/* ============================================================
   INICIALIZAÇÃO
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        App.init();

    }
);
</script>
