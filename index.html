<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GC PLAY PRO - Future System</title>
<meta name="theme-color" content="#000000">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

:root {
  --bg: #030503;
  --surface: #0a0f0a;
  --surface-glass: rgba(10, 20, 10, 0.7);
  --border: #143314;
  --border-neon: #1ed73a;
  --text: #f0fff0;
  --dim: #709070;
  --neon: #28D905;
  --neon-glow: 0 0 20px rgba(40, 217, 5, 0.35);
  --neon-glow-strong: 0 0 35px rgba(40, 217, 5, 0.6);
  --radius: 16px;
  --radius-sm: 10px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Rajdhani', sans-serif;}
body{
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  display: flex;
}

/* TELA DE ATIVAÇÃO FUTURÍSTICA */
#tvSetupScreen {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(circle at center, #071407 0%, #020502 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; overflow-y: auto;
}

.futuristic-container {
  width: 100%; max-width: 950px;
  background: var(--surface-glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-neon);
  box-shadow: var(--neon-glow-strong);
  border-radius: var(--radius);
  display: grid; grid-template-columns: 1fr 380px;
  overflow: hidden; position: relative;
}
@media (max-width: 850px) {
  .futuristic-container { grid-template-columns: 1fr; max-width: 500px; }
}

.setup-left {
  padding: 40px; display: flex; flex-direction: column; justify-content: space-between;
}

.logo-area {
  display: flex; align-items: center; gap: 14px; margin-bottom: 25px;
}
.logo-icon {
  width: 48px; height: 48px; background: rgba(40, 217, 5, 0.1);
  border: 1px solid var(--neon); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--neon); box-shadow: var(--neon-glow);
}
.logo-text h1 {
  font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900;
  letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);
}
.logo-text h1 span { color: var(--neon); text-shadow: 0 0 12px var(--neon); }
.logo-text p { font-size: 11px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }

.input-group-futuristic {
  margin-bottom: 25px;
}
.input-group-futuristic label {
  display: block; font-size: 12px; font-weight: 700; color: var(--neon);
  text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
}
.input-wrapper {
  position: relative; display: flex; align-items: center;
}
.input-wrapper i {
  position: absolute; left: 16px; color: var(--dim); font-size: 16px;
}
.input-wrapper input {
  width: 100%; padding: 15px 15px 15px 48px;
  background: #050a05; border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: #fff; font-size: 14px;
  outline: none; transition: all 0.3s ease;
}
.input-wrapper input:focus {
  border-color: var(--neon); box-shadow: var(--neon-glow);
}

.btn-futuristic {
  width: 100%; padding: 16px; background: var(--neon);
  color: #000; font-family: 'Orbitron', sans-serif; font-weight: 800;
  font-size: 14px; letter-spacing: 1.5px; border: none;
  border-radius: var(--radius-sm); cursor: pointer;
  box-shadow: var(--neon-glow); transition: all 0.3s ease;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-futuristic:hover {
  background: #fff; box-shadow: 0 0 25px #fff; transform: translateY(-2px);
}

/* PAINEL DO QR CODE DIREITO */
.setup-right {
  background: rgba(2, 5, 2, 0.9);
  border-left: 1px solid var(--border);
  padding: 40px 30px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}

.qr-frame {
  position: relative; padding: 12px; background: #050a05;
  border: 1px solid var(--neon); border-radius: 14px;
  box-shadow: var(--neon-glow); margin-bottom: 20px;
}
.qrcode-box {
  width: 150px; height: 150px; background: #fff;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.qrcode-box img { width: 100%; height: 100%; display: block; }

.device-mac-tag {
  font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 800;
  color: var(--neon); background: rgba(40,217,5,0.08);
  border: 1px dashed var(--neon); padding: 8px 16px;
  border-radius: 8px; letter-spacing: 2px; margin: 10px 0 15px 0;
  box-shadow: var(--neon-glow);
}

.btn-copy-link {
  background: transparent; border: 1px solid var(--dim);
  color: var(--text); padding: 10px 16px; font-size: 12px;
  border-radius: 8px; cursor: pointer; font-weight: 600;
  display: flex; align-items: center; gap: 8px; transition: all 0.2s;
}
.btn-copy-link:hover { border-color: var(--neon); color: var(--neon); background: rgba(40,217,5,0.05); }


/* DASHBOARD DO APLICATIVO */
#appDashboard {
  display: none; width: 100vw; height: 100vh; height: 100dvh; flex-direction: row; background: var(--bg);
}
#sidebar {
  width: 270px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
}
#sidebar .logo-app {
  padding: 22px; font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900;
  color: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
}
#sidebar .logo-app span { color: var(--neon); }
#sidebar nav { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
#sidebar nav button {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 14px 16px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--dim); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
}
#sidebar nav button:hover { background: rgba(40,217,5,0.05); color: #fff; }
#sidebar nav button.on {
  background: rgba(40,217,5,0.15); color: var(--neon);
  border-left: 4px solid var(--neon); box-shadow: inset 10px 0 20px rgba(40,217,5,0.05);
}

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#topbar {
  padding: 18px 30px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
#topbar .title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1px; }

#content { flex: 1; overflow-y: auto; padding: 30px; }
.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px; cursor: pointer;
  transition: all 0.25s ease; display: flex; align-items: center; gap: 14px;
}
.card:hover {
  border-color: var(--neon); transform: translateY(-3px);
  box-shadow: var(--neon-glow); background: rgba(10,25,10,0.6);
}
.card .thumb {
  width: 48px; height: 48px; border-radius: 10px; background: #040804;
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--neon); flex-shrink: 0;
}
.card .detail { flex: 1; min-width: 0; }
.card .detail .nm { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.card .detail .mt { font-size: 11px; color: var(--dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

/* PLAYER FULLSCREEN OVERLAY */
#player-overlay {
  position: fixed; inset: 0; background: #000; z-index: 99999;
  display: none; flex-direction: column;
}
#player-overlay.on { display: flex; }
#player-overlay .topbar-player { background: #030503; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 16px 30px; }
#player-overlay video { flex: 1; width: 100%; height: 100%; background: #000; outline: none; }

.btn-close-player {
  background: rgba(224, 64, 64, 0.1); border: 1px solid #e04040; color: #e04040;
  width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s;
}
.btn-close-player:hover { background: #e04040; color: #fff; box-shadow: 0 0 15px rgba(224,64,64,0.5); }
</style>
</head>
<body>

    <!-- TELA DE ATIVAÇÃO / SETUP FUTURÍSTICA -->
    <div id="tvSetupScreen">
        <div class="futuristic-container">
            <!-- Lado Esquerdo: Inserir Link M3U -->
            <div class="setup-left">
                <div>
                    <div class="logo-area">
                        <div class="logo-icon"><i class="fa-solid fa-cube"></i></div>
                        <div class="logo-text">
                            <h1>GC PLAY <span>PRO</span></h1>
                            <p>Next-Gen IPTV System</p>
                        </div>
                    </div>
                    <div style="font-size: 13px; color: var(--dim); line-height: 1.5; margin-bottom: 25px;">
                        Insira sua lista M3U abaixo ou faça ativação instantânea escaneando o QR Code ao lado pelo seu painel remoto.
                    </div>
                </div>

                <div class="input-group-futuristic">
                    <label><i class="fa-solid fa-link" style="color:var(--neon);margin-right:6px;"></i> Link M3U do Provedor</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-network-wired"></i>
                        <input type="text" id="manualM3uInput" placeholder="https://seu-provedor.com/get.php?username=...">
                    </div>
                </div>

                <button class="btn-futuristic" onclick="salvarLinkManualDireto()">
                    <i class="fa-solid fa-bolt"></i> INICIALIZAR SISTEMA
                </button>
            </div>

            <!-- Lado Direito: QR Code e ID Único -->
            <div class="setup-right">
                <div style="font-size: 11px; font-weight: 700; color: var(--neon); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">
                    Ativação Remota QR
                </div>
                
                <div class="qr-frame">
                    <div class="qrcode-box" id="qrCodeBox">
                        <!-- Gerado dinamicamente -->
                    </div>
                </div>

                <div style="font-size: 11px; color: var(--dim); text-transform: uppercase;">ID do Dispositivo:</div>
                <div class="device-mac-tag" id="displayMac">GC-000000</div>

                <button class="btn-copy-link" onclick="copiarLinkPortal()">
                    <i class="fa-solid fa-copy"></i> Copiar Link de Ativação
                </button>
            </div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL DO APP -->
    <div id="appDashboard">
        <div id="sidebar">
            <div class="logo-app"><i class="fa-solid fa-cube" style="color:var(--neon);"></i> GC PLAY <span>PRO</span></div>
            <nav>
                <button class="on" onclick="filtrarCategoria('live', this)"><i class="fa-solid fa-satellite-dish"></i> Ao Vivo (Live)</button>
                <button onclick="filtrarCategoria('movie', this)"><i class="fa-solid fa-film"></i> Filmes (VOD)</button>
                <button onclick="filtrarCategoria('series', this)"><i class="fa-solid fa-clapperboard"></i> Séries</button>
                <button onclick="voltarConfiguracao()" style="margin-top: auto; color: #e04040;"><i class="fa-solid fa-power-off"></i> Desconectar M3U</button>
            </nav>
        </div>

        <div id="main">
            <div id="topbar">
                <div class="title" id="currentCategoryTitle">Canais Ao Vivo</div>
                <div style="font-size: 12px; color: var(--dim); font-weight: 600;" id="counterItems">0 itens</div>
            </div>
            <div id="content">
                <div id="dynamicGrid" class="grid-view"></div>
            </div>
        </div>
    </div>

    <!-- PLAYER OVERLAY FUTURÍSTICO -->
    <div id="player-overlay">
        <div class="topbar-player">
            <div id="overlayTitle" style="font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; color: #fff;">Reproduzindo</div>
            <button class="btn-close-player" onclick="fecharPlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

<script>
    const SUPABASE_URL = 'https://oududghyzkucvrxffoyg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3KI2wOG7ZXTTIkRccOTYnA_zpAjuaLz';
    let supabaseClient = null;
    try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

    let deviceId = "";
    let portalUrlGerado = "";
    let ativouProcesso = false;
    let listaGlobalM3U = { live: [], movie: [], series: [] };

    window.addEventListener('DOMContentLoaded', () => {
        deviceId = localStorage.getItem('gc_device_id');
        if (!deviceId || deviceId.length < 5) {
            deviceId = "GC-" + Math.floor(Math.random() * 899999 + 100000);
            localStorage.setItem('gc_device_id', deviceId);
        }
        document.getElementById('displayMac').innerText = deviceId;

        let pathSegments = window.location.pathname.split('/');
        pathSegments.pop();
        portalUrlGerado = window.location.protocol + "//" + window.location.host + pathSegments.join('/') + "/ativar.html?mac=" + deviceId;
        
        gerarQRCode(portalUrlGerado);

        let savedM3u = localStorage.getItem('gc_manual_m3u');
        if (savedM3u) {
            ativouProcesso = true;
            processarLinkM3U(savedM3u);
            return;
        }

        if (supabaseClient) {
            verificarSupabaseNuvem(deviceId);
            setInterval(() => {
                if(!ativouProcesso) verificarSupabaseNuvem(deviceId);
            }, 3000);
        }
    });

    function gerarQRCode(texto) {
        const box = document.getElementById('qrCodeBox');
        if (!box) return;
        box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(texto)}" alt="QR Code">`;
    }

    async function verificarSupabaseNuvem(mac) {
        if (ativouProcesso || !supabaseClient) return;
        try {
            let { data } = await supabaseClient.from('ativacoes').select('url_m3u').eq('mac', mac).maybeSingle();
            if (data && data.url_m3u && !ativouProcesso) {
                ativouProcesso = true;
                localStorage.setItem('gc_manual_m3u', data.url_m3u);
                processarLinkM3U(data.url_m3u);
            }
        } catch(e) {}
    }

    function salvarLinkManualDireto() {
        let link = document.getElementById('manualM3uInput').value.trim();
        if(link.length > 5) {
            localStorage.setItem('gc_manual_m3u', link);
            ativouProcesso = true;
            processarLinkM3U(link);
        } else {
            alert("Insira um link M3U válido.");
        }
    }

    async function processarLinkM3U(url) {
        document.getElementById('tvSetupScreen').style.display = 'none';
        document.getElementById('appDashboard').style.display = 'flex';

        const proxies = [
            url,
            "https://corsproxy.io/?" + encodeURIComponent(url),
            "https://api.allorigins.win/raw?url=" + encodeURIComponent(url)
        ];

        let conteudoM3U = "";
        for (let p of proxies) {
            try {
                let res = await fetch(p);
                if(res.ok) {
                    let txt = await res.text();
                    if(txt && txt.includes('#EXTINF')) {
                        conteudoM3U = txt;
                        break;
                    }
                }
            } catch(err) {}
        }

        if(!conteudoM3U) {
            alert("Erro de CORS ou link inacessível. Verifique o link M3U.");
            voltarConfiguracao();
            return;
        }

        parsearDadosM3U(conteudoM3U);
        filtrarCategoria('live', document.querySelector('#sidebar nav button'));
    }

    function parsearDadosM3U(dados) {
        listaGlobalM3U = { live: [], movie: [], series: [] };
        let linhas = dados.split('\n');
        let nomeAtual = "Conteúdo";
        let grupoAtual = "Geral";

        for(let i = 0; i < linhas.length; i++) {
            let linha = linhas[i].trim();
            if(linha.startsWith('#EXTINF:')) {
                let matchNome = linha.match(/,(.+)$/);
                if(matchNome) nomeAtual = matchNome[1];

                let matchGrp = linha.match(/group-title="([^"]+)"/i);
                if(matchGrp) grupoAtual = matchGrp[1];
            } else if(linha && !linha.startsWith('#')) {
                let tipo = 'live';
                let lowerGrp = grupoAtual.toLowerCase();
                let lowerUrl = linha.toLowerCase();
                let lowerName = nomeAtual.toLowerCase();

                if(lowerGrp.includes('filme') || lowerGrp.includes('vod') || lowerUrl.includes('/movie/') || lowerName.includes('filme')) {
                    tipo = 'movie';
                } else if(lowerGrp.includes('série') || lowerGrp.includes('serie') || lowerUrl.includes('/series/') || lowerName.includes('s0') || lowerName.includes('temp')) {
                    tipo = 'series';
                }

                listaGlobalM3U[tipo].push({ name: nomeAtual, group: grupoAtual, url: linha });
                nomeAtual = "Conteúdo";
                grupoAtual = "Geral";
            }
        }
    }

    function filtrarCategoria(tipo, btnElement) {
        if(btnElement) {
            document.querySelectorAll('#sidebar nav button').forEach(b => b.classList.remove('on'));
            btnElement.classList.add('on');
        }

        let grid = document.getElementById('dynamicGrid');
        grid.innerHTML = "";
        let itens = listaGlobalM3U[tipo] || [];

        document.getElementById('counterItems').innerText = itens.length + " itens";
        if(tipo === 'live') document.getElementById('currentCategoryTitle').innerText = "Canais Ao Vivo";
        if(tipo === 'movie') document.getElementById('currentCategoryTitle').innerText = "Filmes (VOD)";
        if(tipo === 'series') document.getElementById('currentCategoryTitle').innerText = "Séries";

        if(itens.length === 0) {
            grid.innerHTML = `<div style="color:var(--dim); padding:20px;">Nenhum conteúdo encontrado nesta aba.</div>`;
            return;
        }

        itens.forEach((item) => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="thumb"><i class="fa-solid ${tipo === 'live' ? 'fa-tv' : tipo === 'movie' ? 'fa-film' : 'fa-clapperboard'}"></i></div>
                <div class="detail">
                    <div class="nm">${item.name}</div>
                    <div class="mt">${item.group}</div>
                </div>
            `;
            card.onclick = () => dispararPlayer(item.url, item.name);
            grid.appendChild(card);
        });
    }

    function dispararPlayer(url, nome) {
        document.getElementById('overlayTitle').innerText = nome;
        let video = document.getElementById('videoPlayer');
        document.getElementById('player-overlay').classList.add('on');
