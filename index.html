<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#050505">

<title>GC PLAY PRO</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:50;
    background:#050505;
    border-bottom:1px solid #242424;
}

.top{
    max-width:1400px;
    margin:auto;
    min-height:76px;
    padding:10px 18px;

    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    color:#39ff14;
    font-size:29px;
    font-weight:900;
    white-space:nowrap;
}

.grow{
    flex:1;
}

/* =========================
   BOTÕES
========================= */

.btn{
    border:1px solid #333;
    background:#111;
    color:#fff;

    border-radius:12px;

    padding:12px 16px;
}

.btn:hover{
    border-color:#39ff14;
}

.btn.primary{
    background:#39ff14;
    color:#000;
    border-color:#39ff14;
    font-weight:900;
}

.btn.danger{
    color:#ff7777;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1400px;
    margin:auto;
    padding:20px 18px 50px;
}

.hero{
    padding:18px 4px;
}

.hero h1{
    margin:0 0 10px;
    font-size:40px;
}

.hero p{
    margin:0;

    color:#999;

    font-size:20px;
    line-height:1.4;

    max-width:800px;
}

/* =========================
   STATUS
========================= */

.status{
    padding:13px 15px;
    margin:12px 0;

    border-radius:12px;

    border:1px solid #333;

    background:#0c0c0c;

    color:#aaa;
}

.status.ok{
    border-color:#198b12;
    color:#b8ffb0;
}

.status.error{
    border-color:#a52626;
    color:#ffaaaa;
}

/* =========================
   LISTAS
========================= */

.lists{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:8px 0 14px;
}

.pill{
    border:1px solid #333;

    background:#111;

    color:#fff;

    border-radius:999px;

    padding:10px 16px;

    white-space:nowrap;
}

.pill.active{
    color:#39ff14;
    border-color:#39ff14;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin:10px 0;
}

.search{
    flex:1;

    min-width:220px;

    padding:14px;

    border-radius:12px;

    border:1px solid #333;

    background:#0e0e0e;

    color:#fff;

    outline:none;
}

.search:focus{
    border-color:#39ff14;
}

select{
    padding:13px 14px;

    border-radius:12px;

    border:1px solid #333;

    background:#111;

    color:#fff;

    min-width:170px;
}

/* =========================
   CONTADOR
========================= */

.counter{
    color:#888;

    font-size:14px;

    margin:12px 0;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap:12px;

    width:100%;
}

/* =========================
   CARD
========================= */

.card{
    min-width:0;

    border:1px solid #292929;

    border-radius:14px;

    overflow:hidden;

    background:#101010;
}

.cardBtn{
    width:100%;

    padding:0;

    border:0;

    background:transparent;

    color:#fff;

    text-align:left;
}

.thumb{
    height:120px;

    background:#080808;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.thumb img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.noimg{
    color:#333;

    font-size:38px;
}

.cardText{
    padding:10px;
}

.cardTitle{
    font-size:14px;

    font-weight:bold;

    line-height:1.3;
}

.cardGroup{
    margin-top:6px;

    color:#777;

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* =========================
   PAGINAÇÃO
========================= */

.pagination{
    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:7px;

    padding:25px 0;
}

.page{
    min-width:42px;

    padding:10px;

    border-radius:9px;

    border:1px solid #333;

    background:#111;

    color:#fff;
}

.page.active{
    color:#39ff14;

    border-color:#39ff14;
}

.page:disabled{
    opacity:.35;
}

.pageInfo{
    color:#888;

    padding:0 8px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    background:rgba(0,0,0,.85);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;
}

.box{
    width:min(700px,100%);

    max-height:92vh;

    overflow:auto;

    background:#111;

    border:1px solid #333;

    border-radius:17px;

    padding:20px;
}

.box h2{
    margin-top:0;
}

.field{
    margin:14px 0;
}

.field label{
    display:block;

    color:#aaa;

    font-size:13px;

    margin-bottom:7px;
}

.field input{
    width:100%;

    padding:14px;

    border-radius:10px;

    border:1px solid #333;

    background:#080808;

    color:#fff;

    outline:none;
}

.field input:focus{
    border-color:#39ff14;
}

.actions{
    display:flex;

    justify-content:flex-end;

    gap:8px;

    flex-wrap:wrap;

    margin-top:18px;
}

/* =========================
   LIST MANAGER
========================= */

.listRow{
    border:1px solid #292929;

    background:#0b0b0b;

    border-radius:12px;

    padding:12px;

    margin:8px 0;

    display:flex;

    align-items:center;

    gap:10px;
}

.listName{
    font-weight:bold;
}

.listURL{
    color:#666;

    font-size:12px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

/* =========================
   PLAYER
========================= */

.playerBox{
    width:min(1100px,100%);

    background:#111;

    border:1px solid #333;

    border-radius:15px;

    padding:10px;
}

.playerHead{
    display:flex;

    align-items:center;

    gap:10px;

    padding:5px;
}

.playerTitle{
    flex:1;

    font-weight:bold;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

video{
    width:100%;

    max-height:75vh;

    display:block;

    background:#000;

    border-radius:10px;
}

.playerStatus{
    color:#888;

    font-size:13px;

    padding:10px 5px;
}

/* =========================
   SÉRIES
========================= */

.season{
    border:1px solid #292929;

    border-radius:12px;

    margin:10px 0;

    overflow:hidden;
}

.seasonBtn{
    width:100%;

    padding:14px;

    background:#181818;

    color:#fff;

    border:0;

    text-align:left;

    font-weight:bold;
}

.episodes{
    display:none;
}

.episodes.open{
    display:block;
}

.episode{
    display:flex;

    align-items:center;

    gap:10px;

    border-top:1px solid #292929;

    padding:10px;
}

.episodeName{
    flex:1;

    font-size:14px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    z-index:200;

    background:#181818;

    border:1px solid #333;

    padding:12px 17px;

    border-radius:12px;

    display:none;

    max-width:90%;

    text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .top{
        min-height:64px;

        padding:8px 12px;
    }

    .logo{
        font-size:21px;
    }

    .top .btn{
        padding:10px 11px;
    }

    main{
        padding:12px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero p{
        font-size:17px;
    }

    .grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:8px;
    }

    .thumb{
        height:95px;
    }

    .cardText{
        padding:8px;
    }

    .cardTitle{
        font-size:12px;
    }

    .cardGroup{
        font-size:10px;
    }

    .search{
        width:100%;

        min-width:0;

        order:1;
    }

    select{
        flex:1;
    }

    .toolbar .btn{
        flex:1;
    }

    .listRow{
        flex-wrap:wrap;
    }

}

</style>
</head>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const PROXY_URL =
"https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/gcplay-proxy";

const STORAGE =
"GC_PLAY_PRO_LISTS_V11";

const PER_PAGE =
100;


/* =====================================================
   ESTADO
===================================================== */

let lists = [];

let currentList = null;

let items = [];

let filteredItems = [];

let seriesGroups = [];

let currentPage = 1;

let hlsPlayer = null;

let tsPlayer = null;

let currentItem = null;


/* =====================================================
   HELPER
===================================================== */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function showStatus(
    text,
    type="ok"
){

    const el =
        $("status");

    el.textContent =
        text;

    el.className =
        "status " +
        (
            type === "error"
            ?
            "error"
            :
            "ok"
        );

    el.classList.remove(
        "hidden"
    );

}


function toast(text){

    const el =
        $("toast");

    el.textContent =
        text;

    el.style.display =
        "block";

    clearTimeout(
        window.__toast
    );

    window.__toast =
        setTimeout(
            ()=>{
                el.style.display =
                    "none";
            },
            3000
        );

}


function saveLists(){

    localStorage.setItem(
        STORAGE,
        JSON.stringify(lists)
    );

}


function loadLists(){

    try{

        lists =
            JSON.parse(
                localStorage.getItem(
                    STORAGE
                )
                ||
                "[]"
            );

        if(
            !Array.isArray(lists)
        ){
            lists=[];
        }

    }
    catch(e){

        lists=[];

    }

}


/* =====================================================
   PROXY
===================================================== */

function proxyURL(
    url,
    mode
){

    return (
        PROXY_URL +
        "?mode=" +
        encodeURIComponent(mode) +
        "&url=" +
        encodeURIComponent(url)
    );

}


/* =====================================================
   PARSER EXTINF
===================================================== */

function parseExtinf(line){

    const result = {};

    const regex =
        /([\w-]+)="([^"]*)"/g;

    let match;

    while(
        (match=regex.exec(line))
    ){

        result[
            match[1].toLowerCase()
        ] =
        match[2];

    }


    const comma =
        line.indexOf(",");


    result.title =
        comma >= 0
        ?
        line
            .slice(comma+1)
            .trim()
        :
        "Sem nome";


    return result;

}


/* =====================================================
   DETECTAR CATEGORIA
===================================================== */

function detectCategory(
    meta,
    url
){

    const text = (

        (meta.title || "") +
        " " +
        (meta["group-title"] || "") +
        " " +
        (meta["tvg-name"] || "") +
        " " +
        url

    ).toLowerCase();


    if(
        /adult|adulto|18\+|xxx|porn/
        .test(text)
    ){

        return "Adult";

    }


    if(
        /series|serie|série|season|temporada|episode|episodio|episódio/
        .test(text)
    ){

        return "Series";

    }


    if(
        /movie|movies|filme|films|vod|cinema/
        .test(text)
    ){

        return "Films";

    }


    if(
        /music|musica|música|radio/
        .test(text)
    ){

        return "Music";

    }


    return "TV";

}


/* =====================================================
   ITEM
===================================================== */

function addItem(
    meta,
    url
){

    if(!url){
        return;
    }


    const item = {

        id:
            items.length,

        name:
            meta.title
            ||
            meta["tvg-name"]
            ||
            "Sem nome",

        url:
            url,

        logo:
            meta["tvg-logo"]
            ||
            "",

        group:
            meta["group-title"]
            ||
            "Sem categoria",

        category:
            detectCategory(
                meta,
                url
            )

    };


    items.push(
        item
    );

}


/* =====================================================
   SÉRIES
===================================================== */

function seriesName(item){

    let name =
        item.name;


    name =
        name.replace(
            /\bS\d{1,3}\s*E\d{1,3}\b/gi,
            ""
        );


    name =
        name.replace(
            /\b\d{1,3}x\d{1,3}\b/gi,
            ""
        );


    name =
        name.replace(
            /\bSeason\s*\d+\b/gi,
            ""
        );


    name =
        name.replace(
            /\bTemporada\s*\d+\b/gi,
            ""
        );


    name =
        name.replace(
            /\bEpisode\s*\d+\b/gi,
            ""
        );


    name =
        name.replace(
            /\bEpis[oó]dio\s*\d+\b/gi,
            ""
        );


    return name
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


function seasonNumber(item){

    const text =
        item.name +
        " " +
        item.url;


    let m =
        text.match(
            /\bS(\d{1,3})\b/i
        );


    if(m){
        return Number(m[1]);
    }


    m =
        text.match(
            /\bSeason[\s._-]*(\d{1,3})\b/i
        );


    if(m){
        return Number(m[1]);
    }


    m =
        text.match(
            /\bTemporada[\s._-]*(\d{1,3})\b/i
        );


    if(m){
        return Number(m[1]);
    }


    return 1;

}


function episodeNumber(item){

    const text =
        item.name +
        " " +
        item.url;


    let m =
        text.match(
            /\bE(\d{1,3})\b/i
        );


    if(m){
        return Number(m[1]);
    }


    m =
        text.match(
            /\b\d{1,3}x(\d{1,3})\b/i
        );


    if(m){
        return Number(m[1]);
    }


    return 0;

}


function buildSeries(){

    const map =
        new Map();


    for(
        const item of items
    ){

        if(
            item.category !== "Series"
        ){

            continue;

        }


        const name =
            seriesName(item);


        const key =
            name.toLowerCase();


        if(
            !map.has(key)
        ){

            map.set(
                key,
                {
                    name:name,
                    logo:item.logo,
                    items:[]
                }
            );

        }


        map
            .get(key)
            .items
            .push(item);

    }


    seriesGroups =
        Array.from(
            map.values()
        );


    seriesGroups.sort(
        (a,b)=>
            a.name.localeCompare(
                b.name
            )
    );

}


/* =====================================================
   CATEGORIAS
===================================================== */

function updateCategories(){

    const select =
        $("category");


    const counts = {};


    for(
        const item of items
    ){

        counts[item.category] =
            (
                counts[item.category]
                ||
                0
            ) + 1;

    }


    let html =
        '<option value="ALL">' +
        'Todas (' +
        items.length +
        ')' +
        '</option>';


    const order =
        [
            "TV",
            "Films",
            "Series",
            "Music",
            "Adult"
        ];


    for(
        const cat of order
    ){

        if(
            counts[cat]
        ){

            html +=
                '<option value="' +
                cat +
                '">' +
                cat +
                " (" +
                counts[cat] +
                ")" +
                "</option>";

        }

    }


    select.innerHTML =
        html;

}


/* =====================================================
   FILTRO
===================================================== */

function filterItems(){

    const category =
        $("category")
            .value;


    const search =
        $("search")
            .value
            .trim()
            .toLowerCase();


    if(
        category === "Series"
    ){

        filteredItems =
            seriesGroups.filter(
                serie => {

                    if(!search){
                        return true;
                    }


                    return (
                        serie.name
                            .toLowerCase()
                            .includes(search)
                    );

                }
            );


        return;

    }


    filteredItems =
        items.filter(
            item => {

                const categoryOK =

                    category === "ALL"
                    ||
                    item.category === category;


                const searchOK =

                    !search
                    ||
                    (
                        item.name +
                        " " +
                        item.group
                    )
                    .toLowerCase()
                    .includes(search);


                return (
                    categoryOK &&
                    searchOK
                );

            }
        );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    filterItems();


    const total =
        filteredItems.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                total /
                PER_PAGE
            )
        );


    if(
        currentPage >
        totalPages
    ){

        currentPage =
            totalPages;

    }


    const start =
        (
            currentPage-1
        ) *
        PER_PAGE;


    const pageItems =
        filteredItems.slice(
            start,
            start+PER_PAGE
        );


    if(total){

        $("counter")
            .textContent =
            "Mostrando " +
            (start+1) +
            "–" +
            Math.min(
                start+PER_PAGE,
                total
            ) +
            " de " +
            total;

    }
    else{

        $("counter")
            .textContent =
            "Nenhum item encontrado.";

    }


    const grid =
        $("grid");


    if(
        !pageItems.length
    ){

        grid.innerHTML =
            '<div style="' +
            'grid-column:1/-1;' +
            'text-align:center;' +
            'padding:60px;' +
            'color:#777' +
            '">' +
            'Nenhum item encontrado.' +
            '</div>';


        renderPagination(
            totalPages
        );

        return;

    }


    if(
        $("category").value ===
        "Series"
    ){

        grid.innerHTML =
            pageItems
                .map(
                    renderSeriesCard
                )
                .join("");

    }
    else{

        grid.innerHTML =
            pageItems
                .map(
                    renderCard
                )
                .join("");

    }


    bindCards();

    renderPagination(
        totalPages
    );

}

/* =====================================================
   PAGINAÇÃO
===================================================== */

function renderPagination(
    totalPages
){

    const el =
        $("pagination");


    if(
        totalPages <= 1
    ){

        el.innerHTML =
            "";

        return;

    }


    let html = "";


    html +=
        '<button class="page" ' +
        'data-page="prev" ' +
        (
            currentPage === 1
            ?
            "disabled"
            :
            ""
        ) +
        '>‹</button>';


    let start =
        Math.max(
            1,
            currentPage-2
        );


    let end =
        Math.min(
            totalPages,
            start+4
        );


    if(
        end-start < 4
    ){

        start =
            Math.max(
                1,
                end-4
            );

    }


    for(
        let i=start;
        i<=end;
        i++
    ){

        html +=

            '<button class="page ' +
            (
                i === currentPage
                ?
                "active"
                :
                ""
            ) +
            '" data-page="' +
            i +
            '">' +
            i +
            '</button>';

    }


    html +=

        '<span class="pageInfo">' +

        currentPage +

        " / " +

        totalPages +

        '</span>';


    html +=

        '<button class="page" ' +
        'data-page="next" ' +

        (
            currentPage === totalPages
            ?
            "disabled"
            :
            ""
        ) +

        '>›</button>';


    el.innerHTML =
        html;


    el
        .querySelectorAll(
            "[data-page]"
        )
        .forEach(
            button => {

                button.onclick =
                    function(){

                        const value =
                            this.dataset.page;


                        if(
                            value ===
                            "prev"
                        ){

                            currentPage--;

                        }
                        else if(
                            value ===
                            "next"
                        ){

                            currentPage++;

                        }
                        else{

                            currentPage =
                                Number(
                                    value
                                );

                        }


                        render();


                        window.scrollTo({
                            top:0,
                            behavior:"smooth"
                        });

                    };

            }
        );

}


/* =====================================================
   CARREGAR M3U
===================================================== */

async function loadM3U(
    list
){

    currentList =
        list;


    items = [];

    filteredItems = [];

    seriesGroups = [];

    currentPage = 1;


    renderPills();


    $("grid").innerHTML =
        "";


    $("pagination").innerHTML =
        "";


    showStatus(
        "Conectando ao servidor..."
    );


    try{

        const endpoint =
            proxyURL(
                list.url,
                "playlist"
            );


        const response =
            await fetch(
                endpoint,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            const text =
                await response.text();


            throw new Error(
                text ||
                "HTTP " +
                response.status
            );

        }


        if(!response.body){

            throw new Error(
                "O servidor não retornou dados."
            );

        }


        const reader =
            response.body
                .getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer = "";

        let meta = null;

        let count = 0;


        while(true){

            const result =
                await reader.read();


            if(
                result.done
            ){

                break;

            }


            buffer +=
                decoder.decode(
                    result.value,
                    {
                        stream:true
                    }
                );


            const lines =
                buffer.split(
                    /\r?\n/
                );


            buffer =
                lines.pop() || "";


            for(
                const raw of lines
            ){

                const line =
                    raw.trim();


                if(!line){

                    continue;

                }


                if(
                    line.startsWith(
                        "#EXTINF"
                    )
                ){

                    meta =
                        parseExtinf(
                            line
                        );

                    continue;

                }


                if(
                    line.startsWith("#")
                ){

                    continue;

                }


                if(meta){

                    addItem(
                        meta,
                        line
                    );

                    meta=null;

                    count++;


                    if(
                        count % 1000 === 0
                    ){

                        showStatus(
                            count +
                            " itens encontrados..."
                        );


                        await new Promise(
                            resolve =>
                                setTimeout(
                                    resolve,
                                    0
                                )
                        );

                    }

                }

            }

        }


        buffer +=
            decoder.decode();


        const lastLines =
            buffer.split(
                /\r?\n/
            );


        for(
            const raw of lastLines
        ){

            const line =
                raw.trim();


            if(
                !line ||
                line.startsWith("#")
            ){

                continue;

            }


            if(meta){

                addItem(
                    meta,
                    line
                );

                meta=null;

            }

        }


        showStatus(
            "Organizando " +
            items.length +
            " itens..."
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    0
                )
        );


        buildSeries();

        updateCategories();

        render();


        showStatus(
            items.length +
            " itens carregados de " +
            list.name +
            "."
        );


        list.updatedAt =
            new Date()
                .toISOString();


        saveLists();


        toast(
            "Lista carregada!"
        );

    }
    catch(error){

        console.error(
            "GC PLAY PRO:",
            error
        );


        showStatus(
            "Erro ao carregar: " +
            error.message,
            "error"
        );


        toast(
            "Falha ao carregar a lista."
        );

    }

}

){

        seriesGroups.find(

        toast(
            "Série não encontrada."
        );

        new Map();


    for(
        const item of
        serie.items

            seasonNumber(

        if(
            !seasons.has(

            );

            .get(season)

/* =====================================================
   IDENTIFICAR TIPO DO VÍDEO
===================================================== */

function detectMediaType(
    item
){

    const url =
        item.url
            .toLowerCase();


    /*
       HLS
    */

    if(
        /\.m3u8(?:$|\?)/i
            .test(url)
    ){

        return "hls";

    }


    /*
       MP4
    */

    if(
        /\.(mp4|m4v)(?:$|\?)/i
            .test(url)
    ){

        return "mp4";

    }


    /*
       WEBM
    */

    if(
        /\.webm(?:$|\?)/i
            .test(url)
    ){

        return "webm";

    }


    /*
       MPEG-TS
    */

    if(
        /\.(ts|mpegts)(?:$|\?)/i
            .test(url)
    ){

        return "mpegts";

    }


    /*
       AVI
    */

    if(
        /\.avi(?:$|\?)/i
            .test(url)
    ){

        return "avi";

    }


    /*
       MKV
    */

    if(
        /\.mkv(?:$|\?)/i
            .test(url)
    ){

        return "mkv";

    }


    /*
       TV
    */

    if(
        item.category === "TV"
    ){

        return "mpegts";

    }


    /*
       FILMES E SÉRIES
       quando não existe extensão,
       vamos tentar MPEG-TS primeiro
       e depois vídeo nativo.
    */

    return "unknown";

}


/* =====================================================
   PLAYER - HLS
===================================================== */

function playHLS(
    item,
    url
){

    return new Promise(
        (resolve,reject)=>{

            const video =
                $("video");


            destroyPlayers();


            $("playerStatus")
                .textContent =
                "Conectando HLS...";


            if(
                window.Hls &&
                Hls.isSupported()
            ){

                hlsPlayer =
                    new Hls({

                        enableWorker:true,

                        lowLatencyMode:false,

                        enableStashBuffer:true,

                        backBufferLength:30

                    });


                hlsPlayer.attachMedia(
                    video
                );


                hlsPlayer.loadSource(
                    url
                );


                hlsPlayer.on(
                    Hls.Events.MANIFEST_PARSED,
                    ()=>{

                        $("playerStatus")
                            .textContent =
                            "HLS conectado.";

                        video
                            .play()
                            .then(
                                ()=>{
                                    resolve();
                                }
                            )
                            .catch(
                                ()=>{
                                    resolve();
                                }
                            );

                    }
                );


                hlsPlayer.on(
                    Hls.Events.ERROR,
                    (
                        event,
                        data
                    )=>{

                        console.error(
                            "HLS:",
                            data
                        );


                        if(
                            data &&
                            data.fatal
                        ){

                            reject(
                                new Error(
                                    "Falha no HLS"
                                )
                            );

                        }

                    }
                );


            }
            else if(
                video.canPlayType(
                    "application/vnd.apple.mpegurl"
                )
            ){

                video.src =
                    url;


                video
                    .play()
                    .then(
                        ()=>{
                            resolve();
                        }
                    )
                    .catch(
                        ()=>{
                            resolve();
                        }
                    );

            }
            else{

                reject(
                    new Error(
                        "HLS não suportado."
                    )
                );

            }

        }
    );

}


/* =====================================================
   PLAYER - MPEG TS
===================================================== */

function playMPEGTS(
    item,
    url
){

    return new Promise(
        (resolve,reject)=>{

            const video =
                $("video");


            destroyPlayers();


            $("playerStatus")
                .textContent =
                "Conectando MPEG-TS...";


            if(
                !window.mpegts ||
                !mpegts.isSupported()
            ){

                reject(
                    new Error(
                        "MPEG-TS não suportado neste navegador."
                    )
                );

                return;

            }


            try{

                tsPlayer =
                    mpegts.createPlayer(

                        {
                            type:"mpegts",

                            isLive:
                                item.category === "TV",

                            url:url

                        },

                        {

                            enableWorker:true,

                            enableStashBuffer:true,

                            stashInitialSize:128,

                            lazyLoad:false,

                            autoCleanupSourceBuffer:true

                        }

                    );


                tsPlayer.attachMediaElement(
                    video
                );


                tsPlayer.load();


                tsPlayer.on(
                    mpegts.Events.ERROR,
                    function(
                        type,
                        detail,
                        info
                    ){

                        console.error(
                            "MPEGTS ERROR",
                            type,
                            detail,
                            info
                        );


                        reject(
                            new Error(
                                "Falha MPEG-TS"
                            )
                        );

                    }
                );


                setTimeout(
                    ()=>{

                        video
                            .play()
                            .then(
                                ()=>{
                                    $("playerStatus")
                                        .textContent =
                                        "MPEG-TS conectado.";

                                    resolve();

                                }
                            )
                            .catch(
                                ()=>{

                                    $("playerStatus")
                                        .textContent =
                                        "MPEG-TS conectado. Toque no ▶ para iniciar.";

                                    resolve();

                                }
                            );

                    },
                    500
                );

            }
            catch(error){

                reject(
                    error
                );

            }

        }
    );

}


/* =====================================================
   PLAYER - VÍDEO NATIVO
===================================================== */

function playNative(
    item,
    url
){

    return new Promise(
        (resolve,reject)=>{

            const video =
                $("video");


            destroyPlayers();


            $("playerStatus")
                .textContent =
                "Conectando vídeo...";


            video.src =
                url;


            let finished = false;


            const success =
                ()=>{

                    if(finished){
                        return;
                    }


                    finished=true;


                    $("playerStatus")
                        .textContent =
                        "Vídeo conectado.";


                    video
                        .play()
                        .catch(
                            ()=>{
                                $("playerStatus")
                                    .textContent =
                                    "Vídeo conectado. Toque no ▶ para iniciar.";
                            }
                        );


                    resolve();

                };


            const error =
                ()=>{

                    if(finished){
                        return;
                    }


                    finished=true;


                    reject(
                        new Error(
                            "O navegador não conseguiu reproduzir este vídeo."
                        )
                    );

                };


            video.addEventListener(
                "loadedmetadata",
                success,
                {
                    once:true
                }
            );


            video.addEventListener(
                "canplay",
                success,
                {
                    once:true
                }
            );


            video.addEventListener(
                "error",
                error,
                {
                    once:true
                };


            /*
               Timeout.
            */

            setTimeout(
                ()=>{

                    if(!finished){

                        /*
                           Se o navegador
                           ainda estiver carregando,
                           damos mais uma chance.
                        */

                        if(
                            video.readyState >= 2
                        ){

                            success();

                        }

                    }

                },
                12000
            );

        }
    );

}


/* =====================================================
   PLAYER - FALLBACK
===================================================== */

async function tryPlayer(
    item,
    url
){

    const type =
        detectMediaType(
            item
        );


    console.log(
        "Tipo detectado:",
        type,
        item.url
    );


    /*
       HLS
    */

    if(
        type === "hls"
    ){

        try{

            await playHLS(
                item,
                url
            );

            return;

        }
        catch(error){

            console.warn(
                "HLS falhou:",
                error
            );

        }

    }


    /*
       MP4 / WEBM
    */

    if(
        type === "mp4" ||
        type === "webm"
    ){

        try{

            await playNative(
                item,
                url
            );

            return;

        }
        catch(error){

            console.warn(
                "Vídeo nativo falhou:",
                error
            );

        }


        /*
           Fallback MPEG-TS
        */

        try{

            await playMPEGTS(
                item,
                url
            );

            return;

        }
        catch(error){

            console.warn(
                "Fallback TS falhou:",
                error
            );

        }

    }


    /*
       MPEG-TS conhecido
    */

    if(
        type === "mpegts"
    ){

        try{

            await playMPEGTS(
                item,
                url
            );

            return;

        }
        catch(error){

            console.warn(
                "MPEG-TS falhou:",
                error
            );

        }


        /*
           Fallback nativo
        */

        try{

            await playNative(
                item,
                url
            );

            return;

        }
        catch(error){

            console.warn(
                "Fallback nativo falhou:",
                error
            );

        }

    }


    /*
       AVI / MKV ou desconhecido
    */

    try{

        await playNative(
            item,
            url
        );

        return;

    }
    catch(error){

        console.warn(
            "Nativo falhou:",
            error
        );

    }


    try{

        await playMPEGTS(
            item,
            url
        );

        return;

    }
    catch(error){

        console.warn(
            "MPEGTS também falhou:",
            error
        );

    }


    throw new Error(
        "Não foi possível reproduzir este conteúdo."
    );

}


/* =====================================================
   PLAYER PRINCIPAL
===================================================== */

async function playItem(
    id
){

    const item =
        items.find(
            x =>
                x.id === id
        );


    if(!item){

        toast(
            "Item não encontrado."
        );

        return;

    }


    currentItem =
        item;


    $("playerTitle")
        .textContent =
        item.name;


    $("playerStatus")
        .textContent =
        "Preparando reprodução...";


    $("playerModal")
        .classList
        .remove(
            "hidden"
        );


    const video =
        $("video");


    video.pause();


    video.removeAttribute(
        "src"
    );


    video.load();


    const url =
        proxyURL(
            item.url,
            "media"
        );


    console.log(
        "URL original:",
        item.url
    );


    console.log(
        "URL proxy:",
        url
    );


    try{

        await tryPlayer(
            item,
            url
        );


    }
    catch(error){

        console.error(
            "PLAYER FINAL:",
            error
        );


        $("playerStatus")
            .textContent =
            "Não foi possível reproduzir este conteúdo.";


        toast(
            "Falha na reprodução."
        );

    }

}
