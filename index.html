<script>


/* ============================================================
   CONFIGURAÇÃO
============================================================ */


/*
    ESTE É O ÚNICO SERVIDOR FIXO:

    É o nosso PROXY SUPABASE.

    Nenhum servidor IPTV está fixado aqui.
*/


const PROXY_URL =
"https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/gcplay-proxy";


const STORAGE_KEY =
"gcplay_pro_v5";


/* ============================================================
   ESTADO
============================================================ */

let state = {

    lists: [],

    current: null,

    items: []

};


let hls = null;

let player = null;


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"

            }[char];

        }
    );

}


/* ============================================================
   TOAST
============================================================ */

function toast(message){

    const element =
        document.getElementById(
            "toast"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            function(){

                element.style.display =
                    "none";

            },
            3200
        );

}


/* ============================================================
   STORAGE
============================================================ */

function saveState(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            state.lists
        )

    );

}


function loadState(){

    try{

        state.lists =
            JSON.parse(

                localStorage.getItem(
                    STORAGE_KEY
                )
                ||
                "[]"

            );

    }

    catch(error){

        state.lists = [];

    }

}


/* ============================================================
   PROXY URL
============================================================ */

function proxyURL(

    target,

    mode

){

    return (

        PROXY_URL +

        "?mode=" +

        encodeURIComponent(
            mode
        ) +

        "&url=" +

        encodeURIComponent(
            target
        )

    );

}


/* ============================================================
   MODAIS
============================================================ */

function openM3U(){

    document
        .getElementById(
            "m3uModal"
        )
        .classList
        .remove(
            "hidden"
        );

}


function closeM3U(){

    document
        .getElementById(
            "m3uModal"
        )
        .classList
        .add(
            "hidden"
        );

}


function openLists(){

    renderListManager();


    document
        .getElementById(
            "listsModal"
        )
        .classList
        .remove(
            "hidden"
        );

}


function closeLists(){

    document
        .getElementById(
            "listsModal"
        )
        .classList
        .add(
            "hidden"
        );

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(

    text,

    success

){

    const element =
        document.getElementById(
            "status"
        );


    element.textContent =
        text;


    element.className =
        "status " +
        (
            success
            ?
            "ok"
            :
            "err"
        );


    element.classList
        .remove(
            "hidden"
        );

}


/* ============================================================
   NORMALIZAR URL
============================================================ */

function normalizeURL(
    url
){

    url =
        (
            url ||
            ""
        ).trim();


    if(!url){

        return "";

    }


    if(
        url.startsWith(
            "//"
        )
    ){

        return (
            "http:" +
            url
        );

    }


    return url;

}


/* ============================================================
   PARSER EXTINF
============================================================ */

function parseEXTINF(
    line
){

    const data = {};


    const regex =
        /([\w-]+)="([^"]*)"/g;


    let match;


    while(
        (
            match =
            regex.exec(line)
        )
    ){

        data[
            match[1]
                .toLowerCase()
        ] =
            match[2];

    }


    const comma =
        line.indexOf(",");


    data.title =

        comma >= 0

        ?

        line
            .slice(
                comma + 1
            )
            .trim()

        :

        "Sem nome";


    return data;

}


/* ============================================================
   CLASSIFICAR
============================================================ */

function classify(

    metadata,

    url

){

    const group =

        (
            metadata[
                "group-title"
            ]
            ||
            ""
        )
        .toLowerCase();


    const title =

        (
            metadata.title
            ||
            ""
        )
        .toLowerCase();


    const address =

        (
            url
            ||
            ""
        )
        .toLowerCase();


    const combined =

        group +
        " " +
        title;


    if(

        /adult|18\+|xxx|erotic|adulto/
        .test(
            combined
        )

    ){

        return "Adult";

    }


    if(

        /series?|série|season|temporada|episódio|episode/
        .test(
            combined
        )

        ||

        /\/series?\//
        .test(
            address
        )

    ){

        return "Series";

    }


    if(

        /movie|filme|film|vod|cinema/
        .test(
            combined
        )

        ||

        /\/movies?\//
        .test(
            address
        )

    ){

        return "Films";

    }


    if(

        /music|música|radio/
        .test(
            combined
        )

    ){

        return "Music";

    }


    return "TV";

}


/* ============================================================
   PROCESSAR UM ITEM M3U
============================================================ */

function addM3UItem(

    metadata,

    channelURL

){

    if(!channelURL){

        return null;

    }


    metadata =

        metadata
        ||
        {
            title:"Canal"
        };


    const item = {

        id:
            state.items.length,

        name:

            metadata.title
            ||
            metadata[
                "tvg-name"
            ]
            ||
            "Sem nome",

        url:

            channelURL,

        logo:

            metadata[
                "tvg-logo"
            ]
            ||
            "",

        group:

            metadata[
                "group-title"
            ]
            ||
            "Sem categoria",

        tvgId:

            metadata[
                "tvg-id"
            ]
            ||
            "",

        category:

            classify(
                metadata,
                channelURL
            ),

        raw:

            metadata

    };


    state.items.push(
        item
    );


    return item;

}


/* ============================================================
   CATEGORIAS
============================================================ */

function buildCategories(){

    const select =
        document.getElementById(
            "cat"
        );


    const old =
        select.value;


    const counts = {};


    for(
        const item
        of state.items
    ){

        counts[
            item.category
        ] =

            (
                counts[
                    item.category
                ]
                ||
                0
            ) + 1;

    }


    let html =

        '<option value="ALL">' +

        "Todas (" +

        state.items.length +

        ")" +

        "</option>";


    const fixed = [

        "TV",

        "Films",

        "Series",

        "Music",

        "Adult"

    ];


    for(
        const category
        of fixed
    ){

        if(
            counts[category]
        ){

            html +=

                '<option value="' +

                category +

                '">' +

                category +

                " (" +

                counts[category] +

                ")" +

                "</option>";

        }

    }


    for(
        const category
        of Object.keys(
            counts
        )
        .filter(
            function(c){

                return !fixed.includes(
                    c
                );

            }
        )
        .sort()
    ){

        html +=

            '<option value="' +

            escapeHTML(
                category
            ) +

            '">' +

            escapeHTML(
                category
            ) +

            " (" +

            counts[category] +

            ")" +

            "</option>";

    }


    select.innerHTML =
        html;


    if(

        [
            ...select.options
        ]
        .some(
            function(option){

                return (
                    option.value ===
                    old
                );

            }
        )

    ){

        select.value =
            old;

    }

}


/* ============================================================
   BOTÕES DE LISTA
============================================================ */

function renderListPills(){

    const element =
        document.getElementById(
            "listPills"
        );


    element.innerHTML =

        state.lists

        .map(
            function(list){

                return

                    '<button class="pill ' +

                    (

                        list.id ===
                        state.current

                        ?

                        "active"

                        :

                        ""

                    ) +

                    '" onclick="selectList(\'' +

                    list.id +

                    '\')">' +

                    escapeHTML(
                        list.name
                    ) +

                    "</button>";

            }
        )

        .join("");

}


/* ============================================================
   RENDER
============================================================ */

function render(){

    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    const category =
        document
            .getElementById(
                "cat"
            )
            .value;


    const filtered =

        state.items
        .filter(
            function(item){

                const categoryOK =

                    category ===
                    "ALL"

                    ||

                    item.category ===
                    category;


                const searchOK =

                    !search

                    ||

                    (

                        item.name +

                        " " +

                        item.group +

                        " " +

                        item.url

                    )
                    .toLowerCase()
                    .includes(
                        search
                    );


                return (

                    categoryOK
                    &&
                    searchOK

                );

            }
        );


    const grid =
        document.getElementById(
            "grid"
        );


    if(
        !filtered.length
    ){

        grid.innerHTML =

            '<div class="empty" ' +

            'style="grid-column:1/-1">' +

            "Nenhum item encontrado." +

            "</div>";

        return;

    }


    grid.innerHTML =

        filtered

        .map(
            function(item){

                return

                '<div class="card">' +

                    '<button onclick="playItem(' +

                    item.id +

                    ')">' +


                        '<div class="thumb">' +


                            (
                                item.logo

                                ?

                                /*
                                    IMPORTANTE:

                                    O logo agora vai
                                    direto para o servidor.

                                    Não fazemos proxy
                                    de milhares de
                                    logos.
                                */

                                '<img loading="lazy" ' +

                                'src="' +

                                escapeHTML(
                                    item.logo
                                ) +

                                '" ' +

                                'onerror="' +

                                "this.style.display='none'" +

                                '">'


                                :

                                '<div class="noimg">▶</div>'

                            )


                        +

                        "</div>" +


                        '<div class="ct">' +


                            "<b>" +

                            escapeHTML(
                                item.name
                            ) +

                            "</b>" +


                            "<small>" +

                            escapeHTML(
                                item.group
                            ) +

                            " • " +

                            escapeHTML(
                                item.category
                            ) +

                            "</small>" +


                        "</div>" +


                    "</button>" +


                "</div>";

            }
        )

        .join("");

}


/* ============================================================
   CARREGAR LISTA — STREAMING
============================================================ */

async function loadList(
    list
){

    state.current =
        list.id;


    state.items = [];


    renderListPills();

    buildCategories();

    render();


    setStatus(

        "Conectando ao servidor de " +
        list.name +
        "...",

        true

    );


    try{


        /*
        ========================================================
        FAZER FETCH
        ========================================================
        */

        const response =

            await fetch(

                proxyURL(
                    list.url,
                    "playlist"
                ),

                {

                    method:
                        "GET",

                    cache:
                        "no-store",

                    headers:{

                        "Accept":
                            "application/x-mpegURL,text/plain,*/*"

                    }

                }

            );


        /*
        ========================================================
        VERIFICAR HTTP
        ========================================================
        */

        if(
            !response.ok
        ){

            const errorText =
                await response.text();


            throw new Error(

                errorText

                ||

                (
                    "HTTP " +
                    response.status
                )

            );

        }


        /*
        ========================================================
        STREAM
        ========================================================
        */

        if(
            !response.body
        ){

            throw new Error(

                "O navegador não disponibilizou o fluxo da playlist."

            );

        }


        /*
        ========================================================
        READER
        ========================================================
        */

        const reader =

            response.body
                .getReader();


        /*
        ========================================================
        DECODER
        ========================================================
        */

        const decoder =

            new TextDecoder(
                "utf-8"
            );


        /*
        ========================================================
        BUFFER

        Guardamos somente a parte
        ainda não processada.
        ========================================================
        */

        let buffer = "";


        let metadata =
            null;


        let total = 0;


        /*
        ========================================================
        LOOP
        ========================================================
        */

        while(true){


            const result =

                await reader.read();


            /*
            FIM
            */

            if(
                result.done
            ){

                break;

            }


            /*
            DECODIFICAR PARTE
            */

            buffer +=

                decoder.decode(

                    result.value,

                    {
                        stream:true
                    }

                );


            /*
            SEPARAR LINHAS
            */

            const lines =

                buffer.split(
                    /\r?\n/
                );


            /*
            ÚLTIMA LINHA PODE
            ESTAR INCOMPLETA
            */

            buffer =

                lines.pop()
                ||
                "";


            /*
            PROCESSAR LINHAS
            */

            for(
                const rawLine
                of lines
            ){

                const line =
                    rawLine.trim();


                if(!line){

                    continue;

                }


                /*
                EXTINF
                */

                if(

                    line.startsWith(
                        "#EXTINF"
                    )

                ){

                    metadata =
                        parseEXTINF(
                            line
                        );

                    continue;

                }


                /*
                DIRETIVAS
                */

                if(
                    line.startsWith("#")
                ){

                    continue;

                }


                /*
                URL
                */

                const channelURL =

                    normalizeURL(
                        line
                    );


                if(
                    !channelURL
                ){

                    continue;

                }


                /*
                ADICIONAR
                */

                addM3UItem(

                    metadata,

                    channelURL

                );


                metadata =
                    null;


                total++;


                /*
                ATUALIZAR INTERFACE
                */

                if(
                    total % 100 === 0
                ){

                    buildCategories();

                    render();


                    setStatus(

                        total +
                        " itens encontrados...",

                        true

                    );


                    /*
                    Deixa o navegador
                    respirar.
                    */

                    await new Promise(

                        function(resolve){

                            setTimeout(
                                resolve,
                                0
                            );

                        }

                    );

                }

            }

        }


        /*
        ========================================================
        DECODER FINAL
        ========================================================
        */

        buffer +=

            decoder.decode();


        /*
        PROCESSAR RESTANTE
        */

        const lastLines =

            buffer.split(
                /\r?\n/
            );


        for(
            const rawLine
            of lastLines
        ){

            const line =
                rawLine.trim();


            if(!line){

                continue;

            }


            if(

                line.startsWith(
                    "#EXTINF"
                )

            ){

                metadata =
                    parseEXTINF(
                        line
                    );

                continue;

            }


            if(
                line.startsWith("#")
            ){

                continue;

            }


            const channelURL =

                normalizeURL(
                    line
                );


            if(
                !channelURL
            ){

                continue;

            }


            addM3UItem(

                metadata,

                channelURL

            );


            metadata =
                null;


            total++;

        }


        /*
        ========================================================
        FINAL
        ========================================================
        */

        list.updatedAt =

            new Date()
                .toISOString();


        saveState();


        buildCategories();

        render();


        if(
            state.items.length
        ){

            setStatus(

                state.items.length +
                " itens carregados de " +
                list.name +
                ".",

                true

            );


            toast(
                "Lista carregada com sucesso."
            );

        }

        else{

            throw new Error(

                "Nenhum canal foi encontrado na M3U."

            );

        }


    }

    catch(error){


        console.error(
            "GC PLAY PRO:",
            error
        );


        setStatus(

            "Erro ao carregar: " +
            error.message,

            false

        );


        toast(
            "Falha ao carregar a lista."
        );

    }

}


/* ============================================================
   SALVAR NOVA LISTA
============================================================ */

async function saveM3U(){

    const name =

        document
            .getElementById(
                "mName"
            )
            .value
            .trim()

        ||

        "Minha lista";


    const url =

        document
            .getElementById(
                "mUrl"
            )
            .value
            .trim();


    if(

        !/^https?:\/\//i
        .test(
            url
        )

    ){

        toast(
            "Informe uma URL M3U HTTP ou HTTPS."
        );

        return;

    }


    const list = {

        id:
            crypto.randomUUID(),

        name:
            name,

        url:
            url,

        createdAt:

            new Date()
                .toISOString(),

        updatedAt:
            null

    };


    state.lists.push(
        list
    );


    saveState();


    closeM3U();


    document
        .getElementById(
            "mName"
        )
        .value = "";


    document
        .getElementById(
            "mUrl"
        )
        .value = "";


    await loadList(
        list
    );

}


/* ============================================================
   SELECIONAR LISTA
============================================================ */

function selectList(
    id
){

    const list =

        state.lists.find(
            function(item){

                return (
                    item.id === id
                );

            }
        );


    if(list){

        loadList(
            list
        );

    }

}


/* ============================================================
   GERENCIAR LISTAS
============================================================ */

function renderListManager(){

    const element =
        document.getElementById(
            "listRows"
        );


    if(
        !state.lists.length
    ){

        element.innerHTML =

            '<div class="empty">' +

            "Nenhuma lista cadastrada." +

            "</div>";

        return;

    }


    element.innerHTML =

        state.lists

        .map(
            function(list){

                return

                    '<div class="listRow">' +


                        '<div class="grow">' +


                            '<div class="name">' +

                            escapeHTML(
                                list.name
                            ) +

                            "</div>" +


                            '<div class="url">' +

                            escapeHTML(
                                list.url
                            ) +

                            "</div>" +


                        "</div>" +


                        '<button class="btn" ' +

                        'onclick="editList(\'' +

                        list.id +

                        '\')">' +

                        "Editar" +

                        "</button>" +


                        '<button class="btn danger" ' +

                        'onclick="deleteList(\'' +

                        list.id +

                        '\')">' +

                        "Excluir" +

                        "</button>" +


                    "</div>";

            }
        )

        .join("");

}


/* ============================================================
   EDITAR LISTA
============================================================ */

function editList(
    id
){

    const list =

        state.lists.find(
            function(item){

                return (
                    item.id === id
                );

            }
        );


    if(!list){

        return;

    }


    const name =

        prompt(
            "Nome da lista:",
            list.name
        );


    if(
        name === null
    ){

        return;

    }


    const url =

        prompt(
            "URL M3U:",
            list.url
        );


    if(
        url === null
    ){

        return;

    }


    const cleanURL =
        url.trim();


    if(

        !/^https?:\/\//i
        .test(
            cleanURL
        )

    ){

        toast(
            "URL inválida."
        );

        return;

    }


    list.name =

        name.trim()
        ||
        "Minha lista";


    list.url =
        cleanURL;


    saveState();


    renderListManager();


    loadList(
        list
    );

}


/* ============================================================
   EXCLUIR LISTA
============================================================ */

function deleteList(
    id
){

    if(

        !confirm(
            "Excluir esta lista?"
        )

    ){

        return;

    }


    state.lists =

        state.lists.filter(
            function(list){

                return (
                    list.id !== id
                );

            }
        );


    if(
        state.current === id
    ){

        state.current =
            null;

        state.items = [];

    }


    saveState();


    renderListManager();

    renderListPills();

    buildCategories();

    render();

}


/* ============================================================
   ATUALIZAR
============================================================ */

async function refreshCurrent(){

    const list =

        state.lists.find(
            function(item){

                return (
                    item.id ===
                    state.current
                );

            }
        );


    if(!list){

        toast(
            "Adicione uma lista M3U primeiro."
        );

        return;

    }


    await loadList(
        list
    );

}


/* ============================================================
   FECHAR PLAYER
============================================================ */

function closePlayer(){

    document
        .getElementById(
            "playerModal"
        )
        .classList
        .add(
            "hidden"
        );


    try{

        if(hls){

            hls.destroy();

            hls = null;

        }

    }

    catch(error){}


    try{

        if(player){

            player.destroy();

            player = null;

        }

    }

    catch(error){}


    const video =
        document.getElementById(
            "video"
        );


    video.pause();


    video.removeAttribute(
        "src"
    );


    video.load();

}


/* ============================================================
   PLAYER
============================================================ */

function playItem(
    id
){

    const item =

        state.items.find(
            function(channel){

                return (
                    channel.id === id
                );

            }
        );


    if(!item){

        return;

    }


    document
        .getElementById(
            "playerName"
        )
        .textContent =
        item.name;


    document
        .getElementById(
            "playerStatus"
        )
        .textContent =
        "Conectando...";


    document
        .getElementById(
            "playerModal"
        )
        .classList
        .remove(
            "hidden"
        );


    const video =
        document.getElementById(
            "video"
        );


    /*
    ============================================================
    URL DO STREAM

    Sempre passa pelo proxy.

    O servidor vem da própria M3U.
    ============================================================
    */

    const streamURL =

        proxyURL(

            item.url,

            "media"

        );


    const originalURL =

        item.url
            .toLowerCase();


    /*
    ============================================================
    HLS
    ============================================================
    */

    if(

        /\.m3u8(?:$|\?)/i
        .test(
            originalURL
        )

    ){

        if(

            window.Hls
            &&
            Hls.isSupported()

        ){

            hls =

                new Hls({

                    enableWorker:
                        true,

                    lowLatencyMode:
                        false

                });


            hls.loadSource(
                streamURL
            );


            hls.attachMedia(
                video
            );


            hls.on(

                Hls.Events
                    .MANIFEST_PARSED,

                function(){

                    document
                        .getElementById(
                            "playerStatus"
                        )
                        .textContent =
                        "HLS conectado.";


                    video
                        .play()
                        .catch(
                            function(){}
                        );

                }

            );


            hls.on(

                Hls.Events.ERROR,

                function(
                    event,
                    data
                ){

                    if(
                        data &&
                        data.fatal
                    ){

                        document
                            .getElementById(
                                "playerStatus"
                            )
                            .textContent =

                            "Erro HLS: " +
                            data.details;

                    }

                }

            );

        }


        else if(

            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )

        ){

            video.src =
                streamURL;


            video
                .play()
                .catch(
                    function(){}
                );

        }


        else{

            document
                .getElementById(
                    "playerStatus"
                )
                .textContent =

                "Este navegador não suporta HLS.";

        }


        return;

    }


    /*
    ============================================================
    MPEG-TS
    ============================================================
    */

    if(
        typeof mpegts ===
        "undefined"
    ){

        document
            .getElementById(
                "playerStatus"
            )
            .textContent =

            "mpegts.js não carregou.";

        return;

    }


    try{

        player =

            mpegts.createPlayer(

                {

                    type:
                        "mpegts",

                    isLive:
                        true,

                    url:
                        streamURL

                },

                {

                    enableWorker:
                        true,

                    enableStashBuffer:
                        true,

                    stashInitialSize:
                        128

                }

            );


        player.attachMediaElement(
            video
        );


        player.load();


        player.play()
            .catch(
                function(){}
            );


        player.on(

            mpegts.Events.ERROR,

            function(){

                document
                    .getElementById(
                        "playerStatus"
                    )
                    .textContent =

                    "Falha ao reproduzir o MPEG-TS.";

            }

        );


        document
            .getElementById(
                "playerStatus"
            )
            .textContent =

            "MPEG-TS conectado.";

    }


    catch(error){

        console.error(
            error
        );


        document
            .getElementById(
                "playerStatus"
            )
            .textContent =

            "Erro no player: " +
            error.message;

    }

}


/* ============================================================
   INICIALIZAÇÃO
============================================================ */

loadState();


renderListPills();


buildCategories();


if(
    state.lists.length
){

    loadList(
        state.lists[0]
    );

}


else{

    document
        .getElementById(
            "grid"
        )
        .innerHTML =

        '<div class="empty" ' +

        'style="grid-column:1/-1">' +

        "Adicione sua primeira lista M3U para começar." +

        "</div>";

}
