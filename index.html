<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GC PLAY PRO - TV</title>
    <meta name="theme-color" content="#28D905">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #28D905; --bg-main: #000; --bg-card: #0d0d0d; --border: #222; --text-muted: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-main); color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .smart-container { display: flex; flex: 1; width: 100%; height: 100%; flex-direction: column; }
        @media (min-width: 900px) { .smart-container { flex-direction: row; } }
        .main-content-area { flex: 1; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .top-brand-bar { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; color: #fff; }
        .top-brand-bar span { color: var(--primary); }
        .app-brand-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; background: rgba(40, 217, 5, 0.1); padding: 4px; border: 1px solid var(--primary); }
        .add-account-card { width: 100%; max-width: 280px; height: 140px; background: rgba(255,255,255,0.02); border: 3px dashed var(--border); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--text-muted); }
        .add-account-card:hover { border-color: var(--primary); color: #fff; background: #1f1f1f; }
        .sidebar-panel { width: 100%; background: #050705; border-top: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
        @media (min-width: 900px) { .sidebar-panel { width: 340px; border-top: none; border-left: 1px solid var(--border); justify-content: space-between; } }
        .qrcode-container { background: #fff; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; width: 130px; height: 130px; }
        .qrcode-container canvas, .qrcode-container img { display: block; width: 118px !important; height: 118px !important; }
        .mac-display-box { font-family: monospace; font-size: 15px; font-weight: bold; color: var(--primary); letter-spacing: 1px; margin: 6px 0; }
        .btn-ui { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; background: var(--primary); color: #000; text-transform: uppercase; }
        
        #loadingScreen { display: none; width: 100%; height: 100vh; height: 100dvh; flex-direction: column; align-items: center; justify-content: center; background: #000; position: fixed; top: 0; left: 0; z-index: 9998; text-align: center; }
        .spinner { width: 60px; height: 60px; border: 5px solid rgba(40,217,5,0.1); border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Estilo do Player Interno M3U */
        #playerScreen { display: none; width: 100%; height: 100vh; height: 100dvh; background: #000; position: fixed; top: 0; left: 0; z-index: 9999; display: flex; flex-direction: row; }
        .playlist-sidebar { width: 320px; background: #111; border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        .playlist-header { padding: 15px; background: #181818; font-weight: bold; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--primary); }
        .channels-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 12px; margin-bottom: 6px; background: #1a1a1a; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
        .channel-item:hover, .channel-item.active { background: rgba(40,217,5,0.15); border-color: var(--primary); color: var(--primary); }
        .video-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body>

    <div id="tvSetupScreen" class="smart-container">
        <div class="main-content-area">
            <div class="top-brand-bar">
                <img src="https://i.imgur.com/7D2A74V.png" class="app-brand-logo" onerror="this.style.display='none'">
                <i class="fa-solid fa-circle-play" style="color: var(--primary);"></i> GC PLAY <span>PRO</span>
            </div>
            <div>
                <div class="add-account-card" onclick="alert('Escaneie o QR Code ao lado para ativar pelo celular!')">
                    <i class="fa-solid fa-plus" style="font-size: 26px; color: var(--primary);"></i>
                    <span style="font-size: 12px; font-weight: bold; color: #fff;">Adicionar Manualmente</span>
                </div>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); border-top: 2px solid var(--border); padding-top: 10px;">
                📱 Ativação Oficial via Nuvem
            </div>
        </div>

        <div class="sidebar-panel">
            <div style="font-size: 12px; color: var(--primary); font-weight: 700; padding: 8px 14px; background: rgba(40,217,5,0.1); border-radius: 8px; border: 2px solid rgba(40,217,5,0.3);">
                SUPORTE: (19) 99990-18248
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="qrcode-container" id="qrCodeBox"></div>
                <div style="color: var(--primary); font-size: 11px; font-weight: bold; margin-top: 4px;">Escaneie para Ativar</div>
                <div class="mac-display-box" id="displayMac">Gerando...</div>
                <button class="btn-ui" onclick="copiarLinkPortal()"><i class="fa-solid fa-copy"></i> Copiar Link</button>
            </div>
            <div style="font-size: 11px; color: var(--text-muted);">v8.7 GC PLAY PRO</div>
        </div>
    </div>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 20px; font-weight: 600;">Reconhecendo ativação...</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">Carregando lista M3U...</p>
    </div>

    <div id="playerScreen" style="display:none;">
        <div class="playlist-sidebar">
            <div class="playlist-header"><i class="fa-solid fa-list"></i> Canais e Conteúdos</div>
            <div class="channels-list" id="channelsListContainer">
                <div style="color: #666; text-align: center; margin-top: 20px;">Carregando lista...</div>
            </div>
        </div>
        <div class="video-container">
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oududghyzkucvrxffoyg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3KI2wOG7ZXTTIkRccOTYnA_zpAjuaLz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let portalUrlGerado = "";
        let deviceId = "";
        let ativouProcesso = false;

        window.addEventListener('DOMContentLoaded', () => {
            deviceId = localStorage.getItem('gc_device_id');
            if (!deviceId || deviceId.length < 5) {
                deviceId = "GC-" + Math.floor(Math.random() * 899999 + 100000);
                localStorage.setItem('gc_device_id', deviceId);
            }
            
            const macElement = document.getElementById('displayMac');
            if(macElement) macElement.innerText = deviceId;

            let pathSegments = window.location.pathname.split('/');
            pathSegments.pop();
            let basePath = window.location.protocol + "//" + window.location.host + pathSegments.join('/') + "/ativar.html";
            portalUrlGerado = basePath + "?mac=" + deviceId;

            gerarQRCodeSeguro(portalUrlGerado);

            verificarAtivacaoNuvem(deviceId);
            setInterval(() => {
                if(!ativouProcesso) {
                    verificarAtivacaoNuvem(deviceId);
                }
            }, 3000);
        });

        function gerarQRCodeSeguro(urlTexto) {
            const box = document.getElementById('qrCodeBox');
            if (!box) return;
            box.innerHTML = "";
            try {
                new QRCode(box, {
                    text: urlTexto,
                    width: 118,
                    height: 118,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (e) {
                box.innerHTML = "<span style='color:red; font-size:10px;'>Erro QR</span>";
            }
        }

        async function verificarAtivacaoNuvem(mac) {
            if (ativouProcesso) return;
            try {
                let { data, error } = await supabaseClient
                    .from('ativacoes')
                    .select('url_m3u')
                    .eq('mac', mac)
                    .maybeSingle();

                if (data && data.url_m3u && !ativouProcesso) {
                    ativouProcesso = true;
                    processarListaM3U(data.url_m3u);
                }
            } catch (err) {}
        }

        async function processarListaM3U(url) {
            document.getElementById('tvSetupScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            try {
                // Tenta buscar a lista M3U (Caso haja bloqueio CORS direto do servidor da lista, usa um proxy público compatível)
                let fetchUrl = url;
                let response = await fetch(fetchUrl).catch(() => null);
                
                if (!response || !response.ok) {
                    // Fallback usando proxy CORS se o provedor bloquear requisições diretas do GitHub Pages
                    fetchUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
                    response = await fetch(fetchUrl);
                }

                let text = await response.text();
                parseM3UContent(text);

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('playerScreen').style.display = 'flex';
            } catch (e) {
                alert("Erro ao carregar ou processar a lista M3U. Verifique o link cadastrado.");
                window.location.reload();
            }
        }

        function parseM3UContent(data) {
            let lines = data.split('\n');
            let channels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    let nameMatch = line.match(/,(.+)$/);
                    currentChannel.name = nameMatch ? nameMatch[1] : "Canal";
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            }

            let container = document.getElementById('channelsListContainer');
            container.innerHTML = "";

            if (channels.length === 0) {
                container.innerHTML = "<div style='color:#888; text-align:center; padding:20px;'>Nenhum canal encontrado na lista.</div>";
                return;
            }

            channels.forEach((ch, index) => {
                let div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = `${index + 1}. ${ch.name}`;
                div.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    playStream(ch.url);
                };
                container.appendChild(div);
            });

            // Toca automaticamente o primeiro canal
            if (channels.length > 0) {
                container.firstChild.click();
            }
        }

        function playStream(url) {
            const video = document.getElementById('videoPlayer');
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else {
                video.src = url;
                video.load();
                video.play().catch(() => {});
            }
        }

        function copiarLinkPortal() {
            if(!portalUrlGerado) return;
            navigator.clipboard.writeText(portalUrlGerado).then(() => {
                alert("Link de ativação copiado com sucesso!");
            }).catch(() => {
                prompt("Copie o link abaixo:", portalUrlGerado);
            });
        }
    </script>
</body>
</html>
