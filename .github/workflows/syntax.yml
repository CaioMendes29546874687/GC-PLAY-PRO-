name: GC PLAY PRO syntax check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in app.js gc-architecture-v2.js gc-architecture-bridge.js gc-final-readiness.js gc-samsung-fix.js gc-pro-runtime.js gc-smoke-test.js sw.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
      - name: GC architecture smoke test
        run: node gc-smoke-test.js
