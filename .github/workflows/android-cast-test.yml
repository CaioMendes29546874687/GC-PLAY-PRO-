name: Build GC PLAY PRO Android - TESTE DE TRANSMISSÃO

on:
  workflow_dispatch:

jobs:
  build:
    name: APK GC PLAY PRO + Google Cast
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR CÓDIGO
      # ============================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURAR JAVA
      # ============================================================

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3. CONFIGURAR NODE
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: npm install


      # ============================================================
      # 5. PREPARAR HTML CAST
      # ============================================================

      - name: Preparar HTML CAST
        run: |
          mkdir -p www

          cp GC_PLAY_PRO_V11_CAST_TESTE.html www/index.html

          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

          echo "HTML CAST preparado."
          echo "Capacitor runtime copiado:"
          ls -lh www/capacitor.js


      # ============================================================
      # 6. CRIAR PROJETO ANDROID
      # ============================================================

      - name: Criar projeto Android
        run: npx cap add android


      # ============================================================
      # 7. GERAR LOGO E SPLASH
      # ============================================================

      - name: Gerar ícone e Splash do GC PLAY PRO
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000" \
            --logoSplashScale 0.30


      # ============================================================
      # 8. ADICIONAR GOOGLE CAST SDK
      # ============================================================

      - name: Adicionar Google Cast SDK
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          dependency = "implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'"

          if dependency not in text:
              marker = "dependencies {"

              if marker not in text:
                  raise SystemExit(
                      "Bloco dependencies não encontrado."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          gradle.write_text(text)

          print("Google Cast SDK adicionado.")
          PY


      # ============================================================
      # 9. COPIAR PLUGINS CAST
      # ============================================================

      - name: Copiar plugins CAST
        run: |
          mkdir -p android/app/src/main/java/com/gcplaypro/app

          cp GCPlayCastPlugin.java \
            android/app/src/main/java/com/gcplaypro/app/GCPlayCastPlugin.java

          cp CastOptionsProvider.java \
            android/app/src/main/java/com/gcplaypro/app/CastOptionsProvider.java

          MAIN="android/app/src/main/java/com/gcplaypro/app/GCPlayCastPlugin.java"
          OPTIONS="android/app/src/main/java/com/gcplaypro/app/CastOptionsProvider.java"

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "Não foi possível descobrir o package."
            exit 1
          fi

          echo "Package encontrado: $PACKAGE"

          sed -i "s/__PACKAGE__/$PACKAGE/g" "$MAIN"
          sed -i "s/__PACKAGE__/$PACKAGE/g" "$OPTIONS"

          echo "Plugins CAST preparados."


      # ============================================================
      # 10. REGISTRAR PLUGIN CAST NA MAINACTIVITY
      # ============================================================

      - name: Registrar plugin CAST
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.java não encontrada."
            exit 1
          fi

          echo "MainActivity encontrada:"
          echo "$MAIN"

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "Package da MainActivity não encontrado."
            exit 1
          fi

          echo "Package:"
          echo "$PACKAGE"

          PLUGIN_IMPORT="import ${PACKAGE}.GCPlayCastPlugin;"

          if ! grep -q "GCPlayCastPlugin" "$MAIN"; then

            sed -i "/^package /a $PLUGIN_IMPORT" "$MAIN"

          fi

          if ! grep -q "registerPlugin(GCPlayCastPlugin.class)" "$MAIN"; then

            if grep -q "void onCreate" "$MAIN"; then

              python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          line = "        registerPlugin(GCPlayCastPlugin.class);"

          if "registerPlugin(GCPlayCastPlugin.class)" not in text:

              marker = "super.onCreate(savedInstanceState);"

              if marker not in text:
                  raise SystemExit(
                      "super.onCreate não encontrado."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + line,
                  1
              )

          path.write_text(text)
          PY

            else

              sed -i "/^package /a import android.os.Bundle;" "$MAIN"

              python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          block = """
          @Override
          public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              registerPlugin(GCPlayCastPlugin.class);
          }
          """

          pos = text.rfind("}")

          if pos == -1:
              raise SystemExit(
                  "Final da MainActivity não encontrado."
              )

          text = text[:pos] + block + "\n" + text[pos:]

          path.write_text(text)
          PY

            fi

          fi

          echo "MainActivity final:"
          cat "$MAIN"


      # ============================================================
      # 11. CONFIGURAR ANDROIDMANIFEST
      # ============================================================

      - name: Configurar AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          # --------------------------------------------------------
          # Google Cast Options Provider
          # --------------------------------------------------------

          provider_line = """
              <meta-data
                  android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME"
                  android:value="com.gcplaypro.app.CastOptionsProvider" />
          """

          if "OPTIONS_PROVIDER_CLASS_NAME" not in text:

              marker = "<application"

              start = text.find(marker)

              if start == -1:
                  raise SystemExit(
                      "Tag application não encontrada."
                  )

              end = text.find(">", start)

              if end == -1:
                  raise SystemExit(
                      "Tag application inválida."
                  )

              text = (
                  text[:end + 1]
                  + provider_line
                  + text[end + 1:]
              )


          # --------------------------------------------------------
          #
