name: Build GC PLAY PRO Android - CAST TESTE

on:
  workflow_dispatch:

jobs:
  build:
    name: APK GC PLAY PRO + Google Cast
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR CÓDIGO
      # ============================================================
      - name: Baixar código
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA
      # ============================================================
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3 - NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 4 - INSTALAR DEPENDÊNCIAS
      # ============================================================
      - name: Instalar dependências
        run: npm install


      # ============================================================
      # 5 - PREPARAR WWW
      # ============================================================
      - name: Preparar aplicação GC PLAY PRO CAST
        shell: bash
        run: |
          set -e

          echo "Verificando arquivos..."

          test -f GC_PLAY_PRO_V11_CAST_TESTE.html
          test -f GCPlayCastPlugin.java
          test -f CastOptionsProvider.java

          mkdir -p www

          cp GC_PLAY_PRO_V11_CAST_TESTE.html www/index.html

          echo "Aplicação CAST preparada."
          ls -lh www/index.html


      # ============================================================
      # 6 - CRIAR PROJETO ANDROID
      # ============================================================
      - name: Criar projeto Android
        run: npx cap add android


      # ============================================================
      # 7 - GERAR ÍCONE E SPLASH
      # ============================================================
      - name: Gerar ícone e Splash do GC PLAY PRO
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000" \
            --logoSplashScale 0.30


      # ============================================================
      # 8 - ADICIONAR GOOGLE CAST SDK
      # ============================================================
      - name: Adicionar Google Cast SDK
        shell: bash
        run: |
          set -e

          GRADLE="android/app/build.gradle"

          echo "Adicionando Google Cast SDK..."

          if ! grep -q "play-services-cast-framework" "$GRADLE"; then

            python3 - <<'PY'
from pathlib import Path
import re

gradle = Path("android/app/build.gradle")
text = gradle.read_text()

dependency = '    implementation "com.google.android.gms:play-services-cast-framework:22.3.1"\n'

# Caso exista bloco dependencies
match = re.search(r'dependencies\s*\{', text)

if not match:
    raise SystemExit("Bloco dependencies não encontrado.")

pos = match.end()

text = text[:pos] + "\n" + dependency + text[pos:]

gradle.write_text(text)

print("Google Cast SDK adicionado.")
PY

          else
            echo "Google Cast SDK já estava presente."
          fi

          grep -n "play-services-cast-framework" "$GRADLE"


      # ============================================================
      # 9 - INSTALAR PLUGIN CAST
      # ============================================================
      - name: Instalar plugin GCPlayCast
        shell: bash
        run: |
          set -e

          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.java não encontrado."
            exit 1
          fi

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "Não foi possível identificar o package."
            exit 1
          fi

          echo "Package encontrado:"
          echo "$PACKAGE"

          mkdir -p "$(dirname "$MAIN")"

          sed "s/^package .*/package $PACKAGE;/" \
            GCPlayCastPlugin.java > \
            "$(dirname "$MAIN")/GCPlayCastPlugin.java"

          sed "s/^package .*/package $PACKAGE;/" \
            CastOptionsProvider.java > \
            "$(dirname "$MAIN")/CastOptionsProvider.java"

          echo "Plugins copiados."

          ls -lh "$(dirname "$MAIN")/GCPlayCastPlugin.java"
          ls -lh "$(dirname "$MAIN")/CastOptionsProvider.java"


      # ============================================================
      # 10 - REGISTRAR PLUGIN NO MAINACTIVITY
      # ============================================================
      - name: Registrar plugin GCPlayCast
        shell: bash
        run: |
          set -e

          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)

          python3 - "$MAIN" <<'PY'
from pathlib import Path
import sys

main = Path(sys.argv[1])
text = main.read_text()

import_line = "import com.gcplaypro.app.GCPlayCastPlugin;"

# Descobrir package
package = ""
for line in text.splitlines():
    if line.startswith("package "):
        package = line.replace("package ", "").replace(";", "").strip()
        break

if not package:
    raise SystemExit("Package não encontrado.")

import_line = f"import {package}.GCPlayCastPlugin;"

if import_line not in text:
    lines = text.splitlines()

    insert = 0

    for i, line in enumerate(lines):
        if line.startswith("package "):
            insert = i + 1
            break

    lines.insert(insert, "")
    lines.insert(insert + 1, import_line)

    text = "\n".join(lines) + "\n"


# Procurar classe MainActivity
if "registerPlugin(GCPlayCastPlugin.class)" not in text:

    marker = "super.onCreate(savedInstanceState);"

    if marker in text:
        replacement = (
            marker
            + "\n"
            + "        registerPlugin(GCPlayCastPlugin.class);"
        )

        text = text.replace(
            marker,
            replacement,
            1
        )

    else:
        # Caso MainActivity não tenha onCreate
        marker_class = "{"

        pos = text.find(marker_class)

        if pos == -1:
            raise SystemExit("Não foi possível localizar MainActivity.")

        text = (
            text[:pos + 1]
            + "\n\n"
            + "    {\n"
            + "        registerPlugin(GCPlayCastPlugin.class);\n"
            + "    }\n"
            + text[pos + 1:]
        )


main.write_text(text)

print("MainActivity configurada.")
print(main.read_text())
PY


      # ============================================================
      # 11 - CONFIGURAR ANDROIDMANIFEST
      # ============================================================
      - name: Configurar Google Cast no AndroidManifest
        shell: bash
        run: |
          set -e

          python3 <<'PY'
from pathlib import Path
import re

manifest = Path("android/app/src/main/AndroidManifest.xml")

if not manifest.exists():
    raise SystemExit("AndroidManifest.xml não encontrado.")

text = manifest.read_text()

# ------------------------------------------------------------
# Descobrir package da MainActivity
# ------------------------------------------------------------

main = next(
    Path("android/app/src/main/java").rglob("MainActivity.java")
)

main_text = main.read_text()

package = ""

for line in main_text.splitlines():
    line = line.strip()

    if line.startswith("package "):
        package = line.replace("package ", "").replace(";", "").strip()
        break

if not package:
    raise SystemExit("Package da aplicação não encontrado.")

print("Package:")
print(package)


# ------------------------------------------------------------
# 1. GOOGLE CAST OPTIONS PROVIDER
# ------------------------------------------------------------

meta_name = (
    "com.google.android.gms.cast.framework."
    "OPTIONS_PROVIDER_CLASS_NAME"
)

meta_block = f'''        <meta-data
            android:name="{meta_name}"
            android:value="{package}.CastOptionsProvider" />'''

if meta_name not in text:

    # Localiza a tag <application ...> COMPLETA.
    # Isso evita inserir o meta-data dentro da abertura
    # da tag application.
    application_match = re.search(
        r'<application\b[^>]*>',
        text,
        flags=re.DOTALL
    )

    if not application_match:
        raise SystemExit(
            "Tag <application> não encontrada no AndroidManifest."
        )

    insert_pos = application_match.end()

    text = (
        text[:insert_pos]
        + "\n"
        + meta_block
        + "\n"
        + text[insert_pos:]
    )

    print("Meta-data do Google Cast adicionado.")

else:
    print("Meta-data do Google Cast já existe.")


# ------------------------------------------------------------
# 2. ANDROID TV
# ------------------------------------------------------------

if "android.software.leanback" not in text:

    tv_features = '''    <uses-feature
        android:name="android.software.leanback"
        android:required="false" />

    <uses-feature
        android:name="android.hardware.touchscreen"
        android:required="false" />

'''

    application_match = re.search(
        r'<application\b',
        text
    )

    if not application_match:
        raise SystemExit(
            "Não foi possível localizar <application>."
        )

    text = (
        text[:application_match.start()]
        + tv_features
        + text[application_match.start():]
    )

    print("Compatibilidade Android TV adicionada.")

else:
    print("Compatibilidade Android TV já existe.")


# ------------------------------------------------------------
# 3. LEANBACK LAUNCHER
# ------------------------------------------------------------

if "android.intent.category.LEANBACK_LAUNCHER" not in text:

    launcher_pattern = (
        r'(<category\s+'
        r'android:name="android\.intent\.category\.LAUNCHER"\s*/>)'
    )

    replacement = (
        r'\1'
        "\n"
        '                          <category '
        'android:name="android.intent.category.LEANBACK_LAUNCHER" />'
    )

    text, count = re.subn(
        launcher_pattern,
        replacement,
        text,
        count=1
    )

    if count == 0:
        print(
            "Aviso: categoria LAUNCHER não encontrada. "
            "LEANBACK_LAUNCHER não foi adicionada."
        )
    else:
        print("LEANBACK_LAUNCHER adicionada.")

else:
    print("LEANBACK_LAUNCHER já existe.")


# ------------------------------------------------------------
# GRAVAR
# ------------------------------------------------------------

manifest.write_text(text)

print("")
print("========================================")
print("ANDROIDMANIFEST FINAL")
print("========================================")
print(text)
print("========================================")
PY


      # ============================================================
      # 12 - VERIFICAR XML DO MANIFEST
      # ============================================================
      - name: Verificar AndroidManifest
        shell: bash
        run: |
          set -e

          python3 <<'PY'
from pathlib import Path
import xml.etree.ElementTree as ET

manifest = Path("android/app/src/main/AndroidManifest.xml")

text = manifest.read_text()

try:
    ET.fromstring(text)
    print("XML do AndroidManifest está válido.")
except Exception as e:
    print("")
    print("ERRO NO ANDROIDMANIFEST:")
    print(e)
    print("")
    print(text)
    raise
PY


      # ============================================================
      # 13 - CONFIGURAR ANDROID TV
      # ============================================================
      - name: Verificar compatibilidade Android TV
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Verificando Android TV..."

          grep -q "android.software.leanback" "$MANIFEST"
          grep -q "android.hardware.touchscreen" "$MANIFEST"

          echo "Android TV OK."


      # ============================================================
      # 14 - SINCRONIZAR CAPACITOR
      # ============================================================
      - name: Sincronizar aplicativo
        run: npx cap sync android


      # ============================================================
      # 15 - VERIFICAÇÃO FINAL
      # ============================================================
      - name: Verificação final do projeto Android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFICAÇÃO FINAL"
          echo "======================================"

          echo ""
          echo "Manifest:"
          grep -n "OPTIONS_PROVIDER_CLASS_NAME" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Leanback:"
          grep -n "LEANBACK_LAUNCHER" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Cast SDK:"
          grep -R "play-services-cast-framework" \
            android/app/build.gradle || true

          echo ""
          echo "Plugin:"
          find android/app/src/main/java \
            -name "GCPlayCastPlugin.java" \
            -o -name "CastOptionsProvider.java"

          echo ""
          echo "======================================"
          echo "VERIFICAÇÃO CONCLUÍDA"
          echo "======================================"


      # ============================================================
      # 16 - GERAR APK
      # ============================================================
      - name: Gerar APK CAST
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace


      # ============================================================
      # 17 - DISPONIBILIZAR APK
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-PLAY-PRO-Android-CAST-Teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
