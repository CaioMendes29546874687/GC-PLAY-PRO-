name: Build GC PLAY PRO Android - TESTE DE TRANSMISSÃO

on:
  workflow_dispatch:

jobs:
  build:
    name: APK GC PLAY PRO + Google Cast
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR CÓDIGO
      # ============================================================

      - name: Baixar código
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA
      # ============================================================

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ============================================================
      # 3 - NODE
      # ============================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # ============================================================
      # 4 - DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: npm install


      # ============================================================
      # 5 - PREPARAR HTML CAST
      # ============================================================

      - name: Preparar HTML CAST
        run: |
          mkdir -p www

          cp GC_PLAY_PRO_V11_CAST_TESTE.html www/index.html

          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

          echo "HTML CAST preparado."
          echo "Capacitor runtime:"
          ls -lh www/capacitor.js


      # ============================================================
      # 6 - CRIAR ANDROID
      # ============================================================

      - name: Criar projeto Android
        run: npx cap add android


      # ============================================================
      # 7 - LOGO E SPLASH
      # ============================================================

      - name: Gerar ícone e Splash do GC PLAY PRO
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000" \
            --logoSplashScale 0.30


      # ============================================================
      # 8 - GOOGLE CAST
      # ============================================================

      - name: Adicionar Google Cast SDK
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          dependency = "implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'"

          if dependency not in text:
              marker = "dependencies {"

              if marker not in text:
                  raise SystemExit(
                      "Bloco dependencies não encontrado."
                  )

              text = text.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          gradle.write_text(text)

          print("Google Cast SDK adicionado.")
          PY


      # ============================================================
      # 9 - DESCOBRIR PACKAGE REAL E COPIAR PLUGINS
      # ============================================================

      - name: Copiar plugins CAST
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.java não encontrada."
            exit 1
          fi

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "Não foi possível descobrir o package."
            exit 1
          fi

          echo "Package REAL:"
          echo "$PACKAGE"

          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')

          echo "Pasta Java:"
          echo "$PACKAGE_PATH"

          mkdir -p "android/app/src/main/java/$PACKAGE_PATH"

          cp GCPlayCastPlugin.java \
            "android/app/src/main/java/$PACKAGE_PATH/GCPlayCastPlugin.java"

          cp CastOptionsProvider.java \
            "android/app/src/main/java/$PACKAGE_PATH/CastOptionsProvider.java"

          PLUGIN="android/app/src/main/java/$PACKAGE_PATH/GCPlayCastPlugin.java"
          OPTIONS="android/app/src/main/java/$PACKAGE_PATH/CastOptionsProvider.java"

          sed -i "s/__PACKAGE__/$PACKAGE/g" "$PLUGIN"
          sed -i "s/__PACKAGE__/$PACKAGE/g" "$OPTIONS"

          echo "Plugin CAST:"
          cat "$PLUGIN"

          echo "CastOptionsProvider:"
          cat "$OPTIONS"


      # ============================================================
      # 10 - REGISTRAR PLUGIN NA MAINACTIVITY
      # ============================================================

      - name: Registrar plugin CAST
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          echo "MainActivity:"
          echo "$MAIN"

          echo "Package:"
          echo "$PACKAGE"

          IMPORT="import ${PACKAGE}.GCPlayCastPlugin;"

          if ! grep -q "GCPlayCastPlugin" "$MAIN"; then
            sed -i "/^package /a $IMPORT" "$MAIN"
          fi

          if ! grep -q "registerPlugin(GCPlayCastPlugin.class)" "$MAIN"; then

            if grep -q "void onCreate" "$MAIN"; then

              python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = "super.onCreate(savedInstanceState);"

          if marker not in text:
              raise SystemExit(
                  "super.onCreate não encontrado."
              )

          if "registerPlugin(GCPlayCastPlugin.class)" not in text:

              text = text.replace(
                  marker,
                  marker + "\n        registerPlugin(GCPlayCastPlugin.class);",
                  1
              )

          path.write_text(text)
          PY

            else

              if ! grep -q "import android.os.Bundle;" "$MAIN"; then
                sed -i "/^package /a import android.os.Bundle;" "$MAIN"
              fi

              python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          block = """
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(GCPlayCastPlugin.class);
              }
          """

          pos = text.rfind("}")

          if pos == -1:
              raise SystemExit(
                  "Final da MainActivity não encontrado."
              )

          text = text[:pos] + block + "\n" + text[pos:]

          path.write_text(text)
          PY

            fi

          fi

          echo "MainActivity FINAL:"
          cat "$MAIN"


      # ============================================================
      # 11 - CONFIGURAR MANIFEST
      # ============================================================

      - name: Configurar AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          # --------------------------------------------------------
          # Descobrir package real
          # --------------------------------------------------------

          main = next(
              Path("android/app/src/main/java").rglob("MainActivity.java")
          )

          main_text = main.read_text()

          package = ""

          for line in main_text.splitlines():
              if line.startswith("package "):
                  package = (
                      line
                      .replace("package ", "")
                      .replace(";", "")
                      .strip()
                  )
                  break

          if not package:
              raise SystemExit(
                  "Package não encontrado."
              )

          print("Package Manifest:")
          print(package)

          provider_class = (
              package + ".CastOptionsProvider"
          )

          # --------------------------------------------------------
          # Cast Options Provider
          # --------------------------------------------------------

          if "OPTIONS_PROVIDER_CLASS_NAME" not in text:

              marker = "<application"

              start = text.find(marker)

              if start == -1:
                  raise SystemExit(
                      "Tag application não encontrada."
                  )

              end = text.find(">", start)

              if end == -1:
                  raise SystemExit(
                      "Tag application inválida."
                  )

              metadata = f"""
                  <meta-data
                      android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME"
                      android:value="{provider_class}" />
              """

              text = (
                  text[:end + 1]
                  + metadata
                  + text[end + 1:]
              )


          # --------------------------------------------------------
          # Android TV
          # --------------------------------------------------------

          if "android.software.leanback" not in text:

              features = """
              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              """

              text = text.replace(
                  "<application",
                  features + "<application",
                  1
              )


          # --------------------------------------------------------
          # Leanback launcher
          # --------------------------------------------------------

          launcher = (
              '<category android:name="android.intent.category.LAUNCHER" />'
          )

          if (
              "android.intent.category.LEANBACK_LAUNCHER"
              not in text
          ):

              replacement = launcher + """
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />"""

              text = text.replace(
                  launcher,
                  replacement,
                  1
              )


          manifest.write_text(text)

          print("AndroidManifest configurado.")
          print(manifest.read_text())
          PY


      # ============================================================
      # 12 - VALIDAR MANIFEST
      # ============================================================

      - name: Validar AndroidManifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"

          ET.parse(path)

          print("AndroidManifest XML válido.")
          PY


      # ============================================================
      # 13 - VERIFICAR ANDROID TV
      # ============================================================

      - name: Verificar compatibilidade Android TV
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "android.software.leanback" "$MANIFEST"

          grep -q "android.hardware.touchscreen" "$MANIFEST"

          grep -q "android.intent.category.LEANBACK_LAUNCHER" "$MANIFEST"

          echo "Android TV OK."


      # ============================================================
      # 14 - SINCRONIZAR CAPACITOR
      # ============================================================

      - name: Sincronizar Capacitor
        run: npx cap sync android


      # ============================================================
      # 15 - VERIFICAÇÃO FINAL CAST
      # ============================================================

      - name: Verificar configuração CAST
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')

          PLUGIN="android/app/src/main/java/$PACKAGE_PATH/GCPlayCastPlugin.java"

          OPTIONS="android/app/src/main/java/$PACKAGE_PATH/CastOptionsProvider.java"

          echo "Package:"
          echo "$PACKAGE"

          echo "Plugin:"
          echo "$PLUGIN"

          echo "Options:"
          echo "$OPTIONS"

          test -f "$PLUGIN"
          test -f "$OPTIONS"
          test -f "www/index.html"
          test -f "www/capacitor.js"

          grep -q "package $PACKAGE;" "$PLUGIN"
          grep -q "package $PACKAGE;" "$OPTIONS"

          grep -q "GCPlayCastPlugin" "$MAIN"

          grep -q "OPTIONS_PROVIDER_CLASS_NAME" \
            android/app/src/main/AndroidManifest.xml

          grep -q "play-services-cast-framework" \
            android/app/build.gradle

          echo "================================"
          echo "CONFIGURAÇÃO CAST OK"
          echo "================================"


      # ============================================================
      # 16 - GERAR APK
      # ============================================================

      - name: Gerar APK CAST
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace


      # ============================================================
      # 17 - DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-PLAY-PRO-Android-CAST-Teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
