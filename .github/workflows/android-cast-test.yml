name: Build GC PLAY PRO Android - CAST TESTE

on:
  workflow_dispatch:

jobs:
  build:
    name: APK GC PLAY PRO + Google Cast
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Preparar HTML CAST
        shell: bash
        run: |
          set -e
          test -f GC_PLAY_PRO_V11_CAST_TESTE.html
          mkdir -p www
          cp GC_PLAY_PRO_V11_CAST_TESTE.html www/index.html
          echo "HTML CAST preparado."

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone e Splash
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#000000" \
            --iconBackgroundColorDark "#000000" \
            --splashBackgroundColor "#000000" \
            --splashBackgroundColorDark "#000000" \
            --logoSplashScale 0.30

      - name: Adicionar Google Cast SDK
        shell: bash
        run: |
          set -e

          GRADLE="android/app/build.gradle"

          python3 - "$GRADLE" <<'PY'
          from pathlib import Path
          import sys

          gradle = Path(sys.argv[1])
          text = gradle.read_text()

          dependency = '    implementation "com.google.android.gms:play-services-cast-framework:22.3.1"\n'

          if "play-services-cast-framework" not in text:
              marker = "dependencies {"

              if marker not in text:
                  raise SystemExit("Bloco dependencies não encontrado.")

              text = text.replace(
                  marker,
                  marker + "\n" + dependency,
                  1
              )

              gradle.write_text(text)

          print("Google Cast SDK configurado.")
          PY

      - name: Copiar plugins CAST
        shell: bash
        run: |
          set -e

          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)

          if [ -z "$MAIN" ]; then
            echo "MainActivity.java não encontrado."
            exit 1
          fi

          PACKAGE=$(grep '^package ' "$MAIN" | head -1 | sed 's/^package //; s/;//')

          if [ -z "$PACKAGE" ]; then
            echo "Package não encontrado."
            exit 1
          fi

          DIR=$(dirname "$MAIN")

          sed "s/^package .*/package $PACKAGE;/" \
            GCPlayCastPlugin.java > "$DIR/GCPlayCastPlugin.java"

          sed "s/^package .*/package $PACKAGE;/" \
            CastOptionsProvider.java > "$DIR/CastOptionsProvider.java"

          echo "Plugins CAST instalados."
          echo "Package: $PACKAGE"

      - name: Registrar plugin CAST
        shell: bash
        run: |
          set -e

          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          main = Path(sys.argv[1])
          text = main.read_text()

          package = ""

          for line in text.splitlines():
              line = line.strip()

              if line.startswith("package "):
                  package = line[8:].replace(";", "").strip()
                  break

          if not package:
              raise SystemExit("Package não encontrado.")

          import_line = f"import {package}.GCPlayCastPlugin;"

          if import_line not in text:
              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      lines.insert(i + 1, "")
                      lines.insert(i + 2, import_line)
                      break

              text = "\n".join(lines) + "\n"

          if "registerPlugin(GCPlayCastPlugin.class)" not in text:

              marker = "super.onCreate(savedInstanceState);"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n        registerPlugin(GCPlayCastPlugin.class);",
                      1
                  )
              else:
                  raise SystemExit(
                      "onCreate não encontrado na MainActivity."
                  )

          main.write_text(text)

          print("GCPlayCastPlugin registrado.")
          PY

      - name: Configurar AndroidManifest
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          main = next(
              Path("android/app/src/main/java").rglob(
                  "MainActivity.java"
              )
          )

          main_text = main.read_text()

          package = ""

          for line in main_text.splitlines():
              line = line.strip()

              if line.startswith("package "):
                  package = line[8:].replace(";", "").strip()
                  break

          if not package:
              raise SystemExit("Package não encontrado.")

          meta_name = (
              "com.google.android.gms.cast.framework."
              "OPTIONS_PROVIDER_CLASS_NAME"
          )

          if meta_name not in text:

              match = re.search(
                  r"<application\b[^>]*>",
                  text,
                  re.DOTALL
              )

              if not match:
                  raise SystemExit(
                      "Tag application não encontrada."
                  )

              meta = (
                  "\n        <meta-data\n"
                  f'            android:name="{meta_name}"\n'
                  f'            android:value="{package}.CastOptionsProvider" />\n'
              )

              text = (
                  text[:match.end()]
                  + meta
                  + text[match.end():]
              )

          if "android.software.leanback" not in text:

              features = (
                  '    <uses-feature\n'
                  '        android:name="android.software.leanback"\n'
                  '        android:required="false" />\n'
                  '\n'
                  '    <uses-feature\n'
                  '        android:name="android.hardware.touchscreen"\n'
                  '        android:required="false" />\n\n'
              )

              match = re.search(
                  r"<application\b",
                  text
              )

              if not match:
                  raise SystemExit(
                      "Application não encontrada."
                  )

              text = (
                  text[:match.start()]
                  + features
                  + text[match.start():]
              )

          if "android.intent.category.LEANBACK_LAUNCHER" not in text:

              pattern = (
                  r'(<category\s+'
                  r'android:name="android\.intent\.category\.LAUNCHER"\s*/>)'
              )

              replacement = (
                  r'\1\n'
                  '                          <category '
                  'android:name="android.intent.category.LEANBACK_LAUNCHER" />'
              )

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count == 0:
                  print(
                      "Aviso: LAUNCHER não encontrado."
                  )

          manifest.write_text(text)

          print("AndroidManifest configurado.")
          PY

      - name: Validar AndroidManifest
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          file = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          ET.fromstring(file.read_text())

          print("AndroidManifest XML válido.")
          PY

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar CAST
        shell: bash
        run: |
          set -e

          echo "Verificando Google Cast..."
          grep -R "play-services-cast-framework" android/app/build.gradle

          echo "Verificando plugin..."
          find android/app/src/main/java \
            -name "GCPlayCastPlugin.java" \
            -o -name "CastOptionsProvider.java"

          echo "Verificando Manifest..."
          grep -R "OPTIONS_PROVIDER_CLASS_NAME" \
            android/app/src/main/AndroidManifest.xml

          echo "CAST OK."

      - name: Gerar APK CAST
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-PLAY-PRO-Android-CAST-Teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
