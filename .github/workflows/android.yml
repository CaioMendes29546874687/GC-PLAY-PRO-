name: Build GC PLAY PRO Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK GC PLAY PRO
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar compatibilidade Android TV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          # -------------------------------------------------
          # Android TV: permitir instalação em dispositivos
          # que não possuem tela touchscreen.
          # -------------------------------------------------

          touchscreen = 'android.hardware.touchscreen'

          if touchscreen not in text:
              marker = '    <application'

              tv_features = '''    <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

          '''

              if marker in text:
                  text = text.replace(
                      marker,
                      tv_features + marker,
                      1
                  )

          # -------------------------------------------------
          # Android TV Launcher
          # -------------------------------------------------

          leanback_launcher = 'android.intent.category.LEANBACK_LAUNCHER'

          if leanback_launcher not in text:
              launcher = '<category android:name="android.intent.category.LAUNCHER" />'

              replacement = launcher + '''
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />'''

              if launcher in text:
                  text = text.replace(
                      launcher,
                      replacement,
                      1
                  )

          manifest.write_text(text)

          print("AndroidManifest.xml configurado para Android TV.")
          PY

      - name: Verificar AndroidManifest
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-PLAY-PRO-Android-TV-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
