name: Build GC PLAY PRO Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK GC PLAY PRO
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar Android TV
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          # Suporte Android TV
          if 'android.software.leanback' not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest\n'
                  '    xmlns:tools="http://schemas.android.com/tools"',
                  1
              )

              text = text.replace(
                  '>',
                  '>\n'
                  '    <uses-feature '
                  'android:name="android.software.leanback" '
                  'android:required="false" />\n'
                  '    <uses-feature '
                  'android:name="android.hardware.touchscreen" '
                  'android:required="false" />',
                  1
              )

          # Adiciona LEANBACK_LAUNCHER na MainActivity
          if 'android.intent.category.LEANBACK_LAUNCHER' not in text:
              text = text.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '<category android:name="android.intent.category.LAUNCHER" />\n'
                  '                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />',
                  1
              )

          manifest.write_text(text)
          PY

      - name: Verificar Manifest Android TV
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GC-PLAY-PRO-Android-TV-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
