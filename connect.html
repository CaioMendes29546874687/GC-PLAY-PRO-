<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Ativar GC PLAY PRO</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:min(500px,100%);
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:bold;
    color:#00e5ff;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:14px;
    margin-bottom:25px;
}

.info{
    background:#191919;
    border-radius:9px;
    padding:14px;
    margin-bottom:18px;
}

.label{
    color:#777;
    font-size:11px;
    margin-bottom:5px;
}

.value{
    word-break:break-all;
    font-size:13px;
}

.code{
    font-size:24px;
    font-weight:bold;
    letter-spacing:4px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

input{
    width:100%;
    height:48px;
    background:#181818;
    border:1px solid #333;
    border-radius:8px;
    padding:0 13px;
    color:#fff;
    outline:none;
    margin-bottom:16px;
}

input:focus{
    border-color:#00bcd4;
}

button{
    width:100%;
    height:50px;
    border:0;
    border-radius:8px;
    background:#00bcd4;
    color:#001014;
    font-weight:bold;
    font-size:15px;
}

button:disabled{
    opacity:.5;
}

.message{
    margin-top:18px;
    padding:13px;
    border-radius:8px;
    background:#191919;
    text-align:center;
    font-size:13px;
    display:none;
}

.message.show{
    display:block;
}

.success{
    color:#00e676;
}

.error{
    color:#ff5252;
}

.loading{
    color:#ffb300;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        GC PLAY PRO
    </div>

    <div class="subtitle">
        Ativação do dispositivo
    </div>


    <div class="info">

        <div class="label">
            ID DO DISPOSITIVO
        </div>

        <div
            id="deviceId"
            class="value"
        >
            Carregando...
        </div>

    </div>


    <div class="info">

        <div class="label">
            CÓDIGO
        </div>

        <div
            id="activationCode"
            class="value code"
        >
            ------
        </div>

    </div>


    <label for="playlist">
        URL da sua playlist M3U
    </label>

    <input
        id="playlist"
        type="url"
        placeholder="https://exemplo.com/lista.m3u"
        autocomplete="off"
    >


    <button
        id="activateButton"
        onclick="ativar()"
    >
        ATIVAR DISPOSITIVO
    </button>


    <div
        id="message"
        class="message"
    ></div>

</div>


<script>

const SUPABASE_URL =
    "https://kuzgdvpdqmocklsgyzvt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2qV7Uw-99dQlVcXluSuikw_YZGClN13";

const EDGE_FUNCTION_URL =
    SUPABASE_URL +
    "/functions/v1/activate-device";


const params =
    new URLSearchParams(
        window.location.search
    );


const deviceId =
    (params.get("device") || "")
        .trim();


const activationCode =
    (params.get("code") || "")
        .trim()
        .toUpperCase();


document.getElementById(
    "deviceId"
).textContent =
    deviceId || "ID não informado";


document.getElementById(
    "activationCode"
).textContent =
    activationCode || "------";


function mostrarMensagem(
    texto,
    tipo
){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent = texto;

    el.className =
        "message show " +
        (tipo || "");

}


function validarUUID(value){

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value);

}


function validarCodigo(value){

    return /^[A-Z0-9]{6}$/.test(value);

}


function validarURL(value){

    try{

        const url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }catch{

        return false;

    }

}


async function ativar(){

    const button =
        document.getElementById(
            "activateButton"
        );


    const playlist =
        document.getElementById(
            "playlist"
        ).value.trim();


    if(!validarUUID(deviceId)){

        mostrarMensagem(
            "Este QR Code não possui um ID de dispositivo válido.",
            "error"
        );

        return;

    }


    if(!validarCodigo(activationCode)){

        mostrarMensagem(
            "Código de ativação inválido.",
            "error"
        );

        return;

    }


    if(!validarURL(playlist)){

        mostrarMensagem(
            "Digite uma URL M3U válida.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "ATIVANDO...";


    mostrarMensagem(
        "Enviando ativação...",
        "loading"
    );


    try{

        const response =
            await fetch(
                EDGE_FUNCTION_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    },

                    body:JSON.stringify({

                        action:"activate",

                        device_id:
                            deviceId,

                        activation_code:
                            activationCode,

                        playlist_url:
                            playlist

                    })
                }
            );


        let data;

        try{

            data =
                await response.json();

        }catch{

            data = {};

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                "Não foi possível ativar o dispositivo."
            );

        }


        if(!data.success){

            throw new Error(
                data.error ||
                "Ativação recusada."
            );

        }


        mostrarMensagem(
            "Dispositivo ativado com sucesso! Você já pode voltar para a TV.",
            "success"
        );


        button.textContent =
            "ATIVADO ✓";


    }catch(error){

        console.error(error);


        mostrarMensagem(
            error.message ||
            "Erro ao ativar dispositivo.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "ATIVAR DISPOSITIVO";

    }

}

</script>

</body>
</html>
