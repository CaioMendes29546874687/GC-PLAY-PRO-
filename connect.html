<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#28D905"><title>GC PLAY PRO • Ativação</title><style>:root{--p:#28d905;--bg:#020502;--card:#091009;--line:#173717;--txt:#efffef;--muted:#739073}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial;padding:20px}.box{max-width:520px;margin:30px auto;background:var(--card);border:1px solid var(--p);border-radius:16px;padding:25px;box-shadow:0 0 35px #28d90533}h1{font-size:22px}span{color:var(--p)}label{font-size:12px;color:var(--muted);display:block;margin-top:14px}input{width:100%;padding:13px;margin-top:6px;background:#020502;color:#fff;border:1px solid var(--line);border-radius:8px;font-size:15px}button{width:100%;margin-top:15px;padding:13px;border-radius:8px;border:1px solid var(--p);background:#28d90512;color:var(--p);font-weight:800;font-size:15px}.msg{margin-top:15px;padding:12px;border-radius:8px;background:#030703;border:1px solid var(--line);font-size:13px;white-space:pre-wrap}.ok{border-color:#28d90566;color:var(--p)}.err{border-color:#ff454566;color:#ff8a8a}.small{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.5}</style></head><body><div class="box"><h1>GC PLAY <span>PRO</span></h1><p>Ativação remota do aparelho</p><label>ID DO APARELHO</label><input id="device"><label>CÓDIGO DE ATIVAÇÃO</label><input id="code" maxlength="6"><label>LINK M3U DO CLIENTE</label><input id="playlist" placeholder="http://... ou https://..."><button onclick="activate()">ATIVAR APARELHO</button><div id="msg" class="msg">Informe os dados e ative.</div><div id="info" class="small"></div></div><script>const END='https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/activate-device';const q=new URLSearchParams(location.search);device.value=q.get('device')||'';code.value=(q.get('code')||'').toUpperCase();async function activate(){const d=device.value.trim(),c=code.value.trim().toUpperCase(),p=playlist.value.trim();if(!d||!c||!/^https?:\/\//i.test(p)){msg.className='msg err';msg.textContent='Preencha ID, código e uma URL M3U válida.';return}msg.className='msg';msg.textContent='Ativando...';try{const r=await fetch(END,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'activate',device_id:d,activation_code:c,playlist_url:p})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'Erro HTTP '+r.status);msg.className='msg ok';msg.textContent='APARELHO ATIVADO COM SUCESSO!\n\nO GC PLAY PRO deve detectar a ativação automaticamente.';info.textContent='Dispositivo: '+d+'\nCódigo: '+c}catch(e){msg.className='msg err';msg.textContent='Não foi possível ativar.\n\n'+e.message}}</script></body></html>
