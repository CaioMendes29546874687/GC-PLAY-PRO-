<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<meta name="theme-color" content="#030503">

<title>GC PLAY PRO - Ativação</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#030503;
    color:#fff;
    font-family:Arial,sans-serif;
}

.box{
    width:100%;
    max-width:480px;
    background:#0a0f0a;
    border:1px solid #28d905;
    border-radius:18px;
    padding:28px;
    box-shadow:
        0 0 35px rgba(40,217,5,.35);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.logo span{
    color:#28d905;
}

.subtitle{
    text-align:center;
    color:#719071;
    font-size:13px;
    margin-bottom:25px;
}

label{
    display:block;
    color:#8ca88c;
    font-size:12px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border-radius:9px;
    border:1px solid #183718;
    background:#030503;
    color:#fff;
    font-size:16px;
    outline:none;
    margin-bottom:15px;
}

input:focus{
    border-color:#28d905;
    box-shadow:0 0 15px rgba(40,217,5,.2);
}

button{
    width:100%;
    border:1px solid #28d905;
    background:#102010;
    color:#28d905;
    padding:14px;
    border-radius:9px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

button:hover{
    background:#28d905;
    color:#030503;
}

.status{
    margin-top:18px;
    padding:12px;
    border-radius:9px;
    background:#050905;
    border:1px solid #143314;
    color:#8ca88c;
    font-size:13px;
    text-align:center;
    word-break:break-word;
}

.status.ok{
    color:#28d905;
    border-color:#28d905;
}

.status.error{
    color:#ff4040;
    border-color:#ff4040;
}

.device-info{
    margin-top:18px;
    padding:12px;
    border:1px dashed #1b421b;
    border-radius:9px;
    color:#709070;
    font-size:11px;
    word-break:break-all;
}

</style>
</head>

<body>

<div class="box">

    <div class="logo">
        GC PLAY <span>PRO</span>
    </div>

    <div class="subtitle">
        ATIVAÇÃO DO DISPOSITIVO
    </div>


    <label>
        Código de ativação
    </label>

    <input
        id="codigo"
        type="text"
        maxlength="6"
        autocomplete="off"
        autocapitalize="characters"
        placeholder="Ex.: ABC123"
    >


    <label>
        URL da sua lista M3U
    </label>

    <input
        id="playlist"
        type="url"
        autocomplete="off"
        placeholder="http:// ou https://"
    >


    <button
        id="btnAtivar"
        type="button"
    >
        ATIVAR DISPOSITIVO
    </button>


    <div
        id="status"
        class="status"
    >
        Informe o código e a lista M3U.
    </div>


    <div class="device-info">

        ID do dispositivo:

        <strong
            id="deviceId"
        >
            —
        </strong>

    </div>

</div>


<script>

"use strict";


const SUPABASE =
    "https://kuzgdvpdqmocklsgyzvt.supabase.co";


const ACTIVATE =
    SUPABASE +
    "/functions/v1/activate-device";


const params =
    new URLSearchParams(
        window.location.search
    );


const deviceFromURL =
    params.get("device") || "";


const codeFromURL =
    params.get("code") || "";


const deviceInput =
    document.getElementById(
        "deviceId"
    );


const codigoInput =
    document.getElementById(
        "codigo"
    );


const playlistInput =
    document.getElementById(
        "playlist"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const btn =
    document.getElementById(
        "btnAtivar"
    );


let deviceId =
    deviceFromURL.trim();


/*
 * Se o QR trouxe o device, usamos ele.
 *
 * Se não trouxe, o administrador pode informar
 * o ID manualmente no código abaixo futuramente.
 */

if(deviceId){

    document.getElementById(
        "deviceId"
    ).textContent =
        deviceId;

}


if(codeFromURL){

    codigoInput.value =
        codeFromURL
        .trim()
        .toUpperCase();

}


function status(texto,tipo){

    statusBox.textContent =
        texto;

    statusBox.className =
        "status " +
        (
            tipo || ""
        );

}


function validarUUID(valor){

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(
            String(valor || "")
        );

}


function validarCodigo(valor){

    return /^[A-Z0-9]{6}$/
        .test(
            String(valor || "")
            .trim()
            .toUpperCase()
        );

}


function validarURL(valor){

    try{

        const u =
            new URL(
                String(valor || "")
                .trim()
            );

        return (
            u.protocol ===
                "http:" ||
            u.protocol ===
                "https:"
        );

    }catch(error){

        return false;

    }

}


async function ativar(){

    const codigo =
        codigoInput.value
        .trim()
        .toUpperCase();


    const playlist =
        playlistInput.value
        .trim();


    if(
        !validarUUID(
            deviceId
        )
    ){

        status(
            "ID do dispositivo inválido.",
            "error"
        );

        return;

    }


    if(
        !validarCodigo(
            codigo
        )
    ){

        status(
            "O código deve possuir 6 caracteres.",
            "error"
        );

        codigoInput.focus();

        return;

    }


    if(
        !validarURL(
            playlist
        )
    ){

        status(
            "Informe uma URL M3U válida começando com http:// ou https://",
            "error"
        );

        playlistInput.focus();

        return;

    }


    btn.disabled=true;

    btn.textContent =
        "ATIVANDO...";


    status(
        "Enviando ativação para o GC PLAY PRO...",
        ""
    );


    try{

        const resposta =
            await fetch(
                ACTIVATE,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        action:
                            "activate",

                        device_id:
                            deviceId,

                        activation_code:
                            codigo,

                        playlist_url:
                            playlist

                    })

                }
            );


        const resultado =
            await resposta
            .json()
            .catch(
                ()=>({})
            );


        console.log(
            "Resposta ativação:",
            resultado
        );


        if(
            !resposta.ok ||
            !resultado.success
        ){

            throw new Error(
                resultado.error ||
                (
                    "Erro HTTP " +
                    resposta.status
                )
            );

        }


        status(
            "DISPOSITIVO ATIVADO COM SUCESSO!",
            "ok"
        );


        /*
         * Guarda a informação localmente.
         */

        localStorage.setItem(
            "gcplay_device_id",
            deviceId
        );


        localStorage.setItem(
            "gcplay_activation_code",
            codigo
        );


        localStorage.setItem(
            "gcplay_remote_playlist",
            playlist
        );


        btn.textContent =
            "ATIVADO";


        /*
         * Depois de 1,5 segundo volta para o player.
         */

        setTimeout(
            ()=>{

                window.location.href =
                    "./index.html";

            },
            1500
        );


    }catch(error){

        console.error(
            "Erro ativação:",
            error
        );


        status(
            error?.message ||
            "Não foi possível ativar o dispositivo.",
            "error"
        );


        btn.disabled=false;

        btn.textContent =
            "ATIVAR DISPOSITIVO";

    }

}


btn.addEventListener(
    "click",
    ativar
);


codigoInput.addEventListener(
    "input",
    ()=>{

        codigoInput.value =
            codigoInput.value
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            )
            .toUpperCase()
            .substring(
                0,
                6
            );

    }
);


codigoInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Enter"
        ){

            ativar();

        }

    }
);


playlistInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Enter"
        ){

            ativar();

        }

    }
);

</script>

</body>
</html>
