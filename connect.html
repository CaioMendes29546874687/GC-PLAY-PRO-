<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate">

<meta
    http-equiv="Pragma"
    content="no-cache">

<meta
    http-equiv="Expires"
    content="0">

<title>GC PLAY PRO - Ativação</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#050805;
    color:#ffffff;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:480px;
    background:#090d09;
    border:1px solid #1cff4f;
    border-radius:20px;
    padding:28px;
    box-shadow:
        0 0 20px rgba(28,255,79,.12),
        0 20px 60px rgba(0,0,0,.7);
}

.logo{
    width:68px;
    height:68px;
    margin:0 auto 16px;
    border-radius:16px;
    background:#050805;
    border:2px solid #1cff4f;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1cff4f;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(28,255,79,.25);
}

h1{
    margin:0;
    text-align:center;
    font-size:27px;
    letter-spacing:1px;
}

.subtitle{
    margin:8px 0 25px;
    text-align:center;
    color:#8fa194;
    font-size:14px;
}

.info-box{
    background:#050805;
    border:1px solid #1c2e20;
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
}

.info-title{
    color:#1cff4f;
    font-size:11px;
    font-weight:bold;
    margin-bottom:9px;
    letter-spacing:1px;
}

.device-id{
    color:#ffffff;
    font-size:13px;
    line-height:1.6;
    word-break:break-all;
    user-select:text;
}

.activation-code{
    color:#1cff4f;
    font-size:25px;
    font-weight:bold;
    letter-spacing:5px;
    text-align:center;
}

label{
    display:block;
    color:#9ca99e;
    font-size:13px;
    margin:18px 0 8px;
}

input{
    width:100%;
    height:50px;
    padding:0 14px;
    border-radius:10px;
    border:1px solid #26382a;
    background:#0d130e;
    color:#ffffff;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#1cff4f;
    box-shadow:0 0 0 2px rgba(28,255,79,.08);
}

button{
    width:100%;
    min-height:50px;
    margin-top:18px;
    border:1px solid #1cff4f;
    border-radius:10px;
    background:#1cff4f;
    color:#020602;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#5dff80;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.copy-button{
    margin-top:10px;
    background:#0b120c;
    color:#1cff4f;
    border:1px solid #1cff4f;
}

.copy-button:hover{
    background:#101d12;
}

.status{
    margin-top:18px;
    min-height:24px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
}

.status.waiting{
    color:#9ca99e;
}

.status.success{
    color:#1cff4f;
}

.status.error{
    color:#ff5c5c;
}

.status.warning{
    color:#ffd65c;
}

.loading{
    display:inline-block;
    width:16px;
    height:16px;
    margin-right:7px;
    vertical-align:-3px;
    border:2px solid #29402e;
    border-top-color:#1cff4f;
    border-radius:50%;
    animation:girar .7s linear infinite;
}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}

.footer{
    margin-top:24px;
    text-align:center;
    color:#526056;
    font-size:10px;
}

.debug{
    margin-top:15px;
    padding:10px;
    background:#080b08;
    border:1px solid #172218;
    border-radius:8px;
    color:#526056;
    font-size:9px;
    line-height:1.5;
    word-break:break-all;
    display:none;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        ▶
    </div>

    <h1>
        GC PLAY PRO
    </h1>

    <div class="subtitle">
        Ativação do dispositivo
    </div>


    <!-- ID DO DISPOSITIVO -->

    <div class="info-box">

        <div class="info-title">
            ID DO DISPOSITIVO
        </div>

        <div
            id="deviceId"
            class="device-id">

            Identificando dispositivo...

        </div>

        <button
            id="copyIdButton"
            class="copy-button"
            type="button">

            COPIAR ID

        </button>

    </div>


    <!-- CÓDIGO -->

    <div class="info-box">

        <div class="info-title">
            CÓDIGO DE ATIVAÇÃO
        </div>

        <div
            id="activationCode"
            class="activation-code">

            ------

        </div>

    </div>


    <!-- PLAYLIST -->

    <label for="playlist">

        URL da sua playlist M3U

    </label>

    <input
        id="playlist"
        type="url"
        placeholder="https://exemplo.com/lista.m3u"
        autocomplete="off"
        spellcheck="false">


    <button
        id="activateButton"
        type="button"
        disabled>

        ATIVAR DISPOSITIVO

    </button>


    <div
        id="status"
        class="status waiting">

        <span class="loading"></span>

        Identificando dispositivo...

    </div>


    <div
        id="debug"
        class="debug">
    </div>


    <div class="footer">

        GC PLAY PRO

    </div>

</div>


<script>

"use strict";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

var EDGE_FUNCTION_URL =
    "https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/activate-device";


/* =========================================================
   ELEMENTOS
========================================================= */

var deviceIdElement =
    document.getElementById("deviceId");

var activationCodeElement =
    document.getElementById("activationCode");

var playlistElement =
    document.getElementById("playlist");

var activateButton =
    document.getElementById("activateButton");

var statusElement =
    document.getElementById("status");

var copyIdButton =
    document.getElementById("copyIdButton");

var debugElement =
    document.getElementById("debug");


/* =========================================================
   VARIÁVEIS
========================================================= */

var deviceId = "";

var activationCode = "";

var dispositivoEncontrado = false;


/* =========================================================
   DEBUG
========================================================= */

function mostrarDebug(texto){

    if(!debugElement){

        return;

    }

    debugElement.style.display =
        "block";

    debugElement.textContent =
        texto;

}


/* =========================================================
   STATUS
========================================================= */

function mostrarStatus(
    mensagem,
    tipo,
    usarHTML
){

    statusElement.className =
        "status " +
        (tipo || "waiting");

    if(usarHTML){

        statusElement.innerHTML =
            mensagem;

    }else{

        statusElement.textContent =
            mensagem;

    }

}


/* =========================================================
   VALIDAR UUID
========================================================= */

function validarUUID(value){

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value);

}


/* =========================================================
   VALIDAR CÓDIGO
========================================================= */

function validarCodigo(value){

    return /^[A-Z0-9]{6}$/.test(value);

}


/* =========================================================
   VALIDAR URL
========================================================= */

function validarURL(value){

    try{

        var url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }catch(error){

        /*
           Fallback para navegadores antigos.
        */

        return /^https?:\/\/.+/i.test(value);

    }

}


/* =========================================================
   LER PARÂMETROS
========================================================= */

function lerParametros(){

    var query =
        window.location.search ||
        "";

    var params =
        new URLSearchParams(query);


    var id =
        params.get("device");

    if(!id){

        id =
            params.get("device_id");

    }


    var code =
        params.get("code");

    if(!code){

        code =
            params.get("activation_code");

    }


    deviceId =
        (id || "")
        .trim();


    activationCode =
        (code || "")
        .trim()
        .toUpperCase();


    /*
       Remove caracteres estranhos caso
       algum sistema tenha colocado espaços.
    */

    deviceId =
        deviceId.replace(
            /\s/g,
            ""
        );


    activationCode =
        activationCode.replace(
            /\s/g,
            ""
        );

}


/* =========================================================
   MOSTRAR ID
========================================================= */

function mostrarID(){

    if(validarUUID(deviceId)){

        deviceIdElement.textContent =
            deviceId;

    }else{

        deviceIdElement.textContent =
            "ID NÃO IDENTIFICADO";

    }

}


/* =========================================================
   REQUISIÇÃO PARA EDGE FUNCTION
========================================================= */

function enviarParaServidor(payload){

    return fetch(
        EDGE_FUNCTION_URL,
        {
            method:"POST",

            mode:"cors",

            cache:"no-store",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:JSON.stringify(payload)
        }
    );

}


/* =========================================================
   CONSULTAR DISPOSITIVO
========================================================= */

async function consultarDispositivo(){

    if(!validarUUID(deviceId)){

        mostrarStatus(
            "O QR Code não contém um ID de dispositivo válido.",
            "error"
        );

        activateButton.disabled =
            true;

        return false;

    }


    mostrarID();


    mostrarStatus(
        '<span class="loading"></span>Consultando dispositivo...',
        "waiting",
        true
    );


    mostrarDebug(
        "Consultando:\n" +
        EDGE_FUNCTION_URL +
        "\n\nDevice ID:\n" +
        deviceId
    );


    try{

        var response =
            await enviarParaServidor({

                action:"status",

                device_id:
                    deviceId

            });


        var data = null;


        try{

            data =
                await response.json();

        }catch(error){

            data = null;

        }


        /*
           Mostra informações técnicas no debug.
        */

        mostrarDebug(
            "HTTP: " +
            response.status +
            "\n\nResposta:\n" +
            JSON.stringify(
                data,
                null,
                2
            )
        );


        if(
            !response.ok
        ){

            throw new Error(

                data &&
                data.error

                ?

                data.error

                :

                "Servidor retornou HTTP " +
                response.status

            );

        }


        if(
            !data
        ){

            throw new Error(
                "O servidor não retornou uma resposta válida."
            );

        }


        if(
            !data.success
        ){

            throw new Error(

                data.error ||

                "O dispositivo não foi encontrado."

            );

        }


        if(
            !data.device
        ){

            throw new Error(
                "O servidor não retornou os dados do dispositivo."
            );

        }


        /*
           Código vindo do banco.
        */

        var codigoServidor =
            String(
                data.device.activation_code ||
                ""
            )
            .trim()
            .toUpperCase();


        if(
            !validarCodigo(codigoServidor)
        ){

            throw new Error(
                "O dispositivo foi encontrado, mas o código cadastrado é inválido."
            );

        }


        activationCode =
            codigoServidor;


        activationCodeElement.textContent =
            activationCode;


        dispositivoEncontrado =
            true;


        /*
           STATUS BLOCKED
        */

        var statusServidor =
            String(
                data.device.status ||
                ""
            )
            .toLowerCase();


        if(
            statusServidor ===
            "blocked"
        ){

            mostrarStatus(
                "Este dispositivo está bloqueado.",
                "error"
            );

            activateButton.disabled =
                true;

            return false;

        }


        /*
           EXPIRAÇÃO
        */

        if(
            data.device.expires_at
        ){

            var expiracao =
                new Date(
                    data.device.expires_at
                );


            if(
                !isNaN(
                    expiracao.getTime()
                ) &&
                expiracao <= new Date()
            ){

                mostrarStatus(
                    "A ativação deste dispositivo expirou.",
                    "error"
                );

                activateButton.disabled =
                    true;

                return false;

            }

        }


        /*
           PLAYLIST JÁ CADASTRADA
        */

        if(
            data.device.playlist_url &&
            !playlistElement.value
        ){

            playlistElement.value =
                data.device.playlist_url;

        }


        /*
           STATUS
        */

        if(
            statusServidor ===
            "active"
        ){

            mostrarStatus(
                "Dispositivo já está ativo. Você pode atualizar a playlist.",
                "success"
            );

        }else{

            mostrarStatus(
                "✓ Dispositivo identificado. Informe a URL da playlist.",
                "success"
            );

        }


        activateButton.disabled =
            false;


        return true;


    }catch(error){

        console.error(
            "Erro ao consultar dispositivo:",
            error
        );


        activationCodeElement.textContent =
            "------";


        var mensagem =
            error &&
            error.message
            ?
            error.message
            :
            "Erro desconhecido ao consultar o servidor.";


        /*
           Erros típicos de CORS/rede.
        */

        if(
            mensagem ===
            "Failed to fetch"
        ){

            mensagem =
                "Não foi possível conectar ao servidor. Verifique o CORS da Edge Function e a conexão com a internet.";

        }


        mostrarStatus(
            mensagem,
            "error"
        );


        mostrarDebug(
            "FALHA DE COMUNICAÇÃO\n\n" +
            "Endpoint:\n" +
            EDGE_FUNCTION_URL +
            "\n\nDevice ID:\n" +
            deviceId +
            "\n\nErro:\n" +
            mensagem
        );


        activateButton.disabled =
            true;


        return false;

    }

}


/* =========================================================
   COPIAR ID
========================================================= */

function copiarID(){

    if(
        !validarUUID(deviceId)
    ){

        return;

    }


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(
            deviceId
        )
        .then(
            function(){

                copyIdButton.textContent =
                    "ID COPIADO";

                setTimeout(
                    function(){

                        copyIdButton.textContent =
                            "COPIAR ID";

                    },
                    1800
                );

            }
        )
        .catch(
            function(){

                copiarIDFallback();

            }
        );

    }else{

        copiarIDFallback();

    }

}


/* =========================================================
   COPIAR FALLBACK
========================================================= */

function copiarIDFallback(){

    var campo =
        document.createElement(
            "textarea"
        );


    campo.value =
        deviceId;


    document.body.appendChild(
        campo
    );


    campo.select();


    try{

        document.execCommand(
            "copy"
        );


        copyIdButton.textContent =
            "ID COPIADO";


        setTimeout(
            function(){

                copyIdButton.textContent =
                    "COPIAR ID";

            },
            1800
        );


    }catch(error){

        alert(
            "ID do dispositivo:\n\n" +
            deviceId
        );

    }


    document.body.removeChild(
        campo
    );

}


/* =========================================================
   ATIVAR DISPOSITIVO
========================================================= */

async function ativar(){

    var playlist =
        playlistElement.value.trim();


    if(
        !validarUUID(deviceId)
    ){

        mostrarStatus(
            "ID do dispositivo inválido.",
            "error"
        );

        return;

    }


    if(
        !validarCodigo(activationCode)
    ){

        var encontrado =
            await consultarDispositivo();


        if(!encontrado){

            return;

        }

    }


    if(
        !validarURL(playlist)
    ){

        mostrarStatus(
            "Digite uma URL HTTP ou HTTPS válida da playlist M3U.",
            "error"
        );

        playlistElement.focus();

        return;

    }


    activateButton.disabled =
        true;


    mostrarStatus(
        '<span class="loading"></span>Ativando dispositivo...',
        "waiting",
        true
    );


    try{

        var response =
            await enviarParaServidor({

                action:"activate",

                device_id:
                    deviceId,

                activation_code:
                    activationCode,

                playlist_url:
                    playlist

            });


        var data = null;


        try{

            data =
                await response.json();

        }catch(error){

            data = null;

        }


        mostrarDebug(
            "ATIVAÇÃO\n\n" +
            "HTTP: " +
            response.status +
            "\n\nResposta:\n" +
            JSON.stringify(
                data,
                null,
                2
            )
        );


        if(
            !response.ok
        ){

            throw new Error(

                data &&
                data.error

                ?

                data.error

                :

                "Servidor retornou HTTP " +
                response.status

            );

        }


        if(
            !data ||
            !data.success
        ){

            throw new Error(

                data &&
                data.error

                ?

                data.error

                :

                "Não foi possível ativar o dispositivo."

            );

        }


        /*
           Salvar playlist localmente.
        */

        try{

            localStorage.setItem(
                "gcplay_playlist_url",
                playlist
            );

        }catch(error){}


        /*
           SUCESSO
        */

        mostrarStatus(
            "✓ DISPOSITIVO ATIVADO COM SUCESSO! Você já pode voltar ao GC PLAY PRO.",
            "success"
        );


        activateButton.textContent =
            "DISPOSITIVO ATIVADO";


        activateButton.disabled =
            true;


    }catch(error){

        console.error(
            "Erro de ativação:",
            error
        );


        var mensagem =
            error &&
            error.message
            ?
            error.message
            :
            "Erro ao ativar dispositivo.";


        if(
            mensagem ===
            "Failed to fetch"
        ){

            mensagem =
                "Não foi possível conectar ao servidor. Verifique o CORS da Edge Function.";

        }


        mostrarStatus(
            mensagem,
            "error"
        );


        activateButton.disabled =
            false;

    }

}


/* =========================================================
   EVENTO COPIAR
========================================================= */

copyIdButton.addEventListener(
    "click",
    copiarID
);


/* =========================================================
   EVENTO ATIVAR
========================================================= */

activateButton.addEventListener(
    "click",
    ativar
);


/* =========================================================
   ENTER
========================================================= */

playlistElement.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            ativar();

        }

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function iniciar(){

    /*
       Lê o QR.
    */

    lerParametros();


    /*
       Mostra ID.
    */

    mostrarID();


    /*
       Verifica ID.
    */

    if(
        !validarUUID(deviceId)
    ){

        activationCodeElement.textContent =
            "------";


        mostrarStatus(
            "QR Code inválido: o ID do dispositivo não foi encontrado.",
            "error"
        );


        activateButton.disabled =
            true;


        return;

    }


    /*
       Consulta banco.
    */

    await consultarDispositivo();

}


/* =========================================================
   START
========================================================= */

iniciar();

</script>

</body>
</html>
