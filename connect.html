<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ativar GC PLAY PRO</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#070b12;
    color:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:min(440px,100%);
    background:#0e151f;
    border:1px solid #263447;
    border-radius:18px;
    padding:28px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.logo{
    width:62px;
    height:62px;
    margin:0 auto 16px;
    border-radius:15px;
    background:#e50914;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
}

h1{
    margin:0 0 8px;
    font-size:25px;
}

.subtitle{
    margin:0 0 22px;
    color:#8c9aab;
    font-size:14px;
    line-height:1.5;
}

.device{
    background:#080d14;
    border:1px solid #263447;
    border-radius:10px;
    padding:13px;
    margin-bottom:15px;
}

.device small{
    display:block;
    color:#748399;
    font-size:10px;
    margin-bottom:6px;
}

.device strong{
    display:block;
    font-size:20px;
    letter-spacing:3px;
}

label{
    display:block;
    text-align:left;
    color:#9aa7b8;
    font-size:12px;
    margin:15px 0 7px;
}

input{
    width:100%;
    height:45px;
    padding:0 13px;
    border-radius:9px;
    border:1px solid #29394d;
    background:#111a26;
    color:#fff;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#e50914;
}

button{
    width:100%;
    height:46px;
    margin-top:18px;
    border:0;
    border-radius:9px;
    background:#e50914;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff2530;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.status{
    margin-top:18px;
    min-height:20px;
    font-size:13px;
    line-height:1.5;
}

.status.success{
    color:#19d36b;
}

.status.error{
    color:#ff5c65;
}

.status.waiting{
    color:#a7b2c1;
}

.spinner{
    width:18px;
    height:18px;
    display:inline-block;
    vertical-align:middle;
    margin-right:7px;
    border:2px solid #4a5666;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.footer{
    margin-top:22px;
    color:#536174;
    font-size:10px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">▶</div>

    <h1>GC PLAY PRO</h1>

    <p class="subtitle">
        Ativação do dispositivo
    </p>

    <div class="device">

        <small>
            CÓDIGO DO DISPOSITIVO
        </small>

        <strong id="code">
            --------
        </strong>

    </div>

    <label for="playlist">
        URL da sua playlist M3U
    </label>

    <input
        id="playlist"
        type="url"
        placeholder="https://exemplo.com/lista.m3u"
        autocomplete="off"
        spellcheck="false">

    <button
        id="activateButton"
        onclick="ativar()">
        ATIVAR DISPOSITIVO
    </button>

    <div
        id="status"
        class="status waiting">
        Aguardando dados do QR Code...
    </div>

    <div class="footer">
        GC PLAY PRO
    </div>

</div>


<script>

"use strict";


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const EDGE_FUNCTION_URL =
    "https://kuzgdvpdqmocklsgyzvt.supabase.co/functions/v1/activate-device";


/* =========================================================
   ELEMENTOS
========================================================= */

const codeElement =
    document.getElementById("code");

const playlistElement =
    document.getElementById("playlist");

const buttonElement =
    document.getElementById("activateButton");

const statusElement =
    document.getElementById("status");


/* =========================================================
   LER QR CODE
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const deviceId =
    (
        params.get("device") ||
        ""
    ).trim();


const activationCode =
    (
        params.get("code") ||
        ""
    )
    .trim()
    .toUpperCase();


/* =========================================================
   VALIDAÇÕES
========================================================= */

function validUUID(value){

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(value);

}


function validCode(value){

    return /^[A-Z0-9]{6}$/.test(
        value
    );

}


function validPlaylistURL(value){

    try{

        const url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }catch{

        return false;

    }

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

function inicializar(){

    if(
        !validUUID(deviceId)
    ){

        codeElement.textContent =
            "INVÁLIDO";

        mostrarStatus(
            "Este QR Code não possui um ID de dispositivo válido.",
            "error"
        );

        buttonElement.disabled =
            true;

        return;

    }


    if(
        !validCode(activationCode)
    ){

        codeElement.textContent =
            "INVÁLIDO";

        mostrarStatus(
            "Este QR Code não possui um código de ativação válido.",
            "error"
        );

        buttonElement.disabled =
            true;

        return;

    }


    codeElement.textContent =
        activationCode;


    mostrarStatus(
        "Dispositivo identificado. Informe a URL da sua playlist.",
        "waiting"
    );


    const savedPlaylist =
        localStorage.getItem(
            "gcplay_playlist_url"
        );


    if(savedPlaylist){

        playlistElement.value =
            savedPlaylist;

    }

}


/* =========================================================
   ATIVAÇÃO
========================================================= */

async function ativar(){

    const playlist =
        playlistElement.value.trim();


    if(
        !validUUID(deviceId)
    ){

        mostrarStatus(
            "ID do dispositivo inválido.",
            "error"
        );

        return;

    }


    if(
        !validCode(activationCode)
    ){

        mostrarStatus(
            "Código de ativação inválido.",
            "error"
        );

        return;

    }


    if(
        !validPlaylistURL(playlist)
    ){

        mostrarStatus(
            "Digite uma URL válida da playlist M3U.",
            "error"
        );

        playlistElement.focus();

        return;

    }


    buttonElement.disabled =
        true;


    mostrarStatus(
        '<span class="spinner"></span>Ativando dispositivo...',
        "waiting",
        true
    );


    try{

        const response =
            await fetch(
                EDGE_FUNCTION_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        action:"activate",

                        device_id:
                            deviceId,

                        activation_code:
                            activationCode,

                        playlist_url:
                            playlist

                    })
                }
            );


        let data = null;


        try{

            data =
                await response.json();

        }catch{

            data = null;

        }


        if(
            !response.ok ||
            !data ||
            !data.success
        ){

            throw new Error(
                (
                    data &&
                    data.error
                ) ||
                "Não foi possível ativar o dispositivo."
            );

        }


        localStorage.setItem(
            "gcplay_playlist_url",
            playlist
        );


        mostrarStatus(
            "✓ Dispositivo ativado com sucesso! Você já pode voltar ao GC PLAY PRO.",
            "success"
        );


        buttonElement.textContent =
            "DISPOSITIVO ATIVADO";


        buttonElement.disabled =
            true;


    }catch(error){

        console.error(
            "Erro de ativação:",
            error
        );


        mostrarStatus(
            error.message ||
            "Erro ao ativar o dispositivo.",
            "error"
        );


        buttonElement.disabled =
            false;

    }

}


/* =========================================================
   STATUS
========================================================= */

function mostrarStatus(
    mensagem,
    tipo="waiting",
    html=false
){

    statusElement.className =
        "status " +
        tipo;


    if(html){

        statusElement.innerHTML =
            mensagem;

    }else{

        statusElement.textContent =
            mensagem;

    }

}


/* =========================================================
   ENTER
========================================================= */

playlistElement.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            ativar();

        }

    }
);


/* =========================================================
   START
========================================================= */

inicializar();

</script>

</body>
</html>
